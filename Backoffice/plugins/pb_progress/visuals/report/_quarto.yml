project:
  type: default
  output-dir: output
  render:
    - pb-report.qmd
  pre-render:
    - python ../scripts/pre_render.py

format:
  html:
    theme:
      - cosmo
      - styles/ifrc.scss
    toc: false
    toc-depth: 2
    number-sections: false
    page-layout: full
    smooth-scroll: true
    fig-align: center
    embed-resources: true
    format-links: false
    include-after-body:
      - partials/report-tools.html
      - partials/language-selector.html
  pdf:
    documentclass: article
    papersize: a4
    geometry:
      - top=20mm
      - bottom=20mm
      - left=18mm
      - right=18mm
    toc: true
    number-sections: false
    fig-align: center

execute:
  enabled: false
  echo: false
  warning: false
