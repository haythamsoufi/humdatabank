<script nonce="{{ csp_nonce() }}">
document.addEventListener('DOMContentLoaded', function () {
  var root = document.getElementById('upr-excel-import-root');
  if (!root) return;
  var csrfToken = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
  var uploadUrl  = {{ url_for('upr_excel_import.upload') | tojson }};
  var analyzeUrl = {{ url_for('upr_excel_import.analyze') | tojson }};
  var previewUrl = {{ url_for('upr_excel_import.preview') | tojson }};
  var runUrl     = {{ url_for('upr_excel_import.run_import') | tojson }};
  var statusUrlTpl = {{ url_for('upr_excel_import.job_status', job_id='__JOB__') | tojson }};

  var step          = 1;
  var analyzeLoaded = false;
  var analyzeData   = null;
  var previewLoading = false;
  var previewLoaded = false;
  var previewStale = false;
  var activeJobId   = null;
  var pollTimer     = null;

  var panels    = document.querySelectorAll('#upr-excel-import-root .upr-excel-wizard-panel');
  var stepEls   = document.querySelectorAll('#upr-excel-wizard-steps .upr-excel-wizard-step');
  var connectors = document.querySelectorAll('#upr-excel-wizard-steps .upr-excel-wizard-connector');
  var btnBack   = document.getElementById('upr-excel-wizard-back');
  var btnNext   = document.getElementById('upr-excel-wizard-next');
  var btnPreview = document.getElementById('upr-excel-wizard-preview');
  var btnRun    = document.getElementById('upr-excel-wizard-run');
  var doneActions = document.getElementById('upr-excel-wizard-done-actions');
  var btnRestart  = document.getElementById('upr-excel-wizard-restart');
  var previewLoadingEl = document.getElementById('upr-excel-preview-loading');
  var previewSummaryEl = document.getElementById('upr-excel-preview-summary');
  var previewStaleHintEl = document.getElementById('upr-excel-preview-stale-hint');
  var roundsInput = document.getElementById('upr-rounds');
  var batchSizeInput = document.getElementById('upr-batch-size');
  var dryRunInput = document.getElementById('upr-dry-run');

  // ── Helpers ──────────────────────────────────────────────────────────────

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function postJSON(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); });
  }

  function selectedTemplateIds() {
    return Array.from(document.querySelectorAll('.template-checkbox:checked'))
      .map(function (el) { return parseInt(el.value, 10); });
  }

  function selectedRounds() {
    var raw = (document.getElementById('upr-rounds').value || '').trim();
    if (!raw) return [];
    return raw.split(',').map(function (s) { return s.trim(); }).filter(Boolean);
  }

  function canRunImport() {
    return selectedTemplateIds().length > 0;
  }

  function markPreviewStale() {
    if (!previewLoaded || previewLoading) return;
    previewStale = true;
    if (previewStaleHintEl) previewStaleHintEl.classList.remove('hidden');
  }

  function clearPreviewState() {
    previewLoaded = false;
    previewStale = false;
    previewSummaryEl.classList.add('hidden');
    previewSummaryEl.innerHTML = '';
    if (previewStaleHintEl) previewStaleHintEl.classList.add('hidden');
  }

  function resetConfigureStep() {
    clearPreviewState();
    previewLoading = false;
    previewLoadingEl.classList.add('hidden');
  }

  // ── Navigation ───────────────────────────────────────────────────────────

  function updateNavButtons() {
    var busy = step === 2 && previewLoading;
    btnBack.disabled = busy;
    btnNext.disabled = !analyzeLoaded;
    if (btnPreview) btnPreview.disabled = busy || !canRunImport();
    btnRun.disabled = busy || !canRunImport();
  }

  function showStep(n) {
    step = n;
    panels.forEach(function (p, i) { p.classList.toggle('hidden', i + 1 !== n); });
    stepEls.forEach(function (el, i) {
      el.classList.remove('active', 'completed', 'text-gray-400', 'border-gray-300');
      if      (i + 1 < n)  el.classList.add('completed');
      else if (i + 1 === n) el.classList.add('active');
      else                  el.classList.add('text-gray-400', 'border-gray-300');
    });
    connectors.forEach(function (c, i) {
      c.classList.remove('completed', 'active');
      if      (i + 1 < n)  c.classList.add('completed');
      else if (i + 1 === n) c.classList.add('active');
    });
    // Back: visible only on configure step (step 2)
    btnBack.classList.toggle('hidden', n !== 2);
    // Next: visible only on upload step (step 1)
    btnNext.classList.toggle('hidden', n !== 1);
    // Run + preview: visible only on configure step (step 2)
    btnRun.classList.toggle('hidden', n !== 2);
    if (btnPreview) btnPreview.classList.toggle('hidden', n !== 2);
    // Done actions: hidden whenever we change step (shown by pollStatus on terminal state)
    doneActions.classList.add('hidden');
    updateNavButtons();
  }

  btnNext.addEventListener('click', function () {
    if (step === 1 && analyzeLoaded) {
      resetConfigureStep();
      showStep(2);
    }
  });
  btnBack.addEventListener('click', function () { if (step > 1) showStep(step - 1); });

  function loadPreview() {
    if (previewLoading || !canRunImport()) return;
    previewLoading = true;
    previewSummaryEl.classList.add('hidden');
    previewSummaryEl.innerHTML = '';
    if (previewStaleHintEl) previewStaleHintEl.classList.add('hidden');
    previewLoadingEl.classList.remove('hidden');
    updateNavButtons();

    postJSON(previewUrl, { template_ids: selectedTemplateIds(), rounds: selectedRounds() })
      .then(function (data) {
        previewLoaded = !!data.success;
        previewStale = false;
        previewSummaryEl.classList.remove('hidden');
        previewSummaryEl.innerHTML = data.success
          ? renderPreviewSummary(data)
          : '<p class="text-red-600">' + escapeHtml(data.message || {{ _("Preview failed")|tojson|safe }}) + '</p>';
      })
      .catch(function (err) {
        previewLoaded = false;
        previewSummaryEl.classList.remove('hidden');
        previewSummaryEl.innerHTML = '<p class="text-red-600">' + escapeHtml(err.message || {{ _("Preview failed")|tojson|safe }}) + '</p>';
      })
      .finally(function () {
        previewLoading = false;
        previewLoadingEl.classList.add('hidden');
        updateNavButtons();
      });
  }

  if (btnPreview) btnPreview.addEventListener('click', loadPreview);

  document.querySelectorAll('.upr-excel-template-checkbox').forEach(function (el) {
    el.addEventListener('change', function () {
      markPreviewStale();
      updateNavButtons();
    });
  });
  if (roundsInput) roundsInput.addEventListener('input', markPreviewStale);
  if (batchSizeInput) batchSizeInput.addEventListener('input', markPreviewStale);
  if (dryRunInput) dryRunInput.addEventListener('change', markPreviewStale);

  // ── Configure preview ────────────────────────────────────────────────────

  function renderPreviewSummary(data) {
    var html = '<p><strong>' + {{ _("Transformed form_data rows")|tojson|safe }} + ':</strong> ' + data.transformed_rows + '</p>'
             + '<p><strong>' + {{ _("Countries with data")|tojson|safe }} + ':</strong> ' + data.countries + '</p>';
    if (data.warning_count) {
      var warnLabel = String(data.warning_count);
      if (data.warning_unique_count && data.warning_unique_count !== data.warning_count) {
        warnLabel += ' (' + data.warning_unique_count + ' ' + {{ _("unique")|tojson|safe }} + ')';
      }
      html += '<p class="text-amber-700"><strong>' + {{ _("Warnings")|tojson|safe }} + ':</strong> ' + warnLabel + '</p>'
            + '<div class="max-h-72 overflow-y-auto mt-2 border border-amber-200 rounded-md bg-amber-50 p-3">'
            + '<ul class="list-disc ml-5 space-y-1 text-amber-900 text-sm">'
            + (data.warnings || []).map(function (w) { return '<li>' + escapeHtml(w) + '</li>'; }).join('')
            + '</ul></div>';
    }
    return html;
  }

  // ── Import job polling ───────────────────────────────────────────────────

  btnRun.addEventListener('click', function () {
    if (!canRunImport() || previewLoading) return;
    showStep(3);
    document.getElementById('upr-excel-import-progress').classList.remove('hidden');
    postJSON(runUrl, {
      template_ids:         selectedTemplateIds(),
      rounds:               selectedRounds(),
      dry_run:              document.getElementById('upr-dry-run').checked,
      batch_size:           parseInt(document.getElementById('upr-batch-size').value, 10) || 1000,
      async:                true
    }).then(function (data) {
      if (!data.success || !data.job_id) {
        document.getElementById('upr-excel-import-result').innerHTML =
          '<p class="text-red-700">' + escapeHtml(data.message || data.error || 'Import failed') + '</p>';
        doneActions.classList.remove('hidden');
        return;
      }
      activeJobId = data.job_id;
      pollStatus();
    });
  });

  if (btnRestart) {
    btnRestart.addEventListener('click', function () { window.location.reload(); });
  }

  function pollStatus() {
    if (!activeJobId) return;
    fetch(statusUrlTpl.replace('__JOB__', encodeURIComponent(activeJobId)))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var job  = data.job || {};
        var pct  = job.percent || 0;
        document.getElementById('upr-excel-import-stage').textContent        = job.message || job.stage || '-';
        document.getElementById('upr-excel-import-progress-bar').style.width = pct + '%';
        document.getElementById('upr-excel-import-progress-text').textContent = Math.round(pct) + '%';

        if (job.status === 'completed') {
          var stats = job.stats || {};
          var msg = 'Loaded: ' + (stats.loaded  || 0)
                  + ', Inserted: '  + (stats.inserted || 0)
                  + ', Updated: '   + (stats.updated  || 0)
                  + ', Skipped: '   + (stats.skipped  || 0)
                  + ', Errors: '    + (stats.errors   || 0);
          if (job.download_ready && job.download_url) {
            msg += ' <a class="text-purple-700 underline" href="'
                 + escapeHtml(job.download_url) + '">' + {{ _("Download preview Excel")|tojson|safe }} + '</a>';
          }
          if (/^[a-fA-F0-9]{32}$/.test(activeJobId || '')) {
            msg += ' <a class="text-purple-700 underline" href="/admin/import-logs/'
                 + encodeURIComponent(activeJobId) + '" target="_blank" rel="noopener">'
                 + {{ _("View change log")|tojson|safe }} + '</a>';
          }
          document.getElementById('upr-excel-import-result').innerHTML = '<p class="text-green-700">' + msg + '</p>';
          doneActions.classList.remove('hidden');
          return;
        }
        if (job.status === 'failed') {
          document.getElementById('upr-excel-import-result').innerHTML =
            '<p class="text-red-700">' + escapeHtml(job.error || 'Failed') + '</p>';
          doneActions.classList.remove('hidden');
          return;
        }
        pollTimer = setTimeout(pollStatus, 1000);
      });
  }

  // ── Dropzone: upload + analyze pipeline ─────────────────────────────────
  //
  // We use initExcelImportDropzone with a custom onFileSelected callback.
  // After client-side file-type & size checks pass the hook:
  //   1. POSTs the file to /upload (server-side MIME + extension check)
  //   2. On success, POSTs to /analyze (reads the "UPR Data" sheet)
  //   3. Calls renderValidationStatus({ valid, preview }) — which drives the
  //      dropzone status panel AND enables/disables btnNext (passed as submitBtn).
  //
  // The custom buildValidPreviewHtml renders the workbook summary (rows / countries
  // / rounds / sections) in place of the generic template-import summary.

  var DZ = 'excel-io-dropzone'; // CSS class prefix from excel-import-dropzone.js

  function buildUprWorkbookPreviewHtml(preview) {
    var lines = [];
    var parts = [];
    if (preview.total_rows != null) parts.push(escapeHtml(String(preview.total_rows)) + ' ' + {{ _("rows")|tojson|safe }});
    if (preview.countries   != null) parts.push(escapeHtml(String(preview.countries)) + ' ' + {{ _("countries")|tojson|safe }});
    if (parts.length) lines.push('<p class="' + DZ + '__preview-line">' + parts.join(' &middot; ') + '</p>');
    var roundGroups = [
      { label: {{ _("Planning")|tojson|safe }}, key: 'planning_rounds' },
      { label: {{ _("AR")|tojson|safe }},       key: 'ar_rounds' },
      { label: {{ _("UPR Country Reporting")|tojson|safe }}, key: 'myr_rounds' }
    ];
    roundGroups.forEach(function (g) {
      var rr = preview[g.key];
      if (rr && rr.length) {
        lines.push(
          '<p class="' + DZ + '__preview-line">'
          + '<span class="' + DZ + '__preview-meta-label">' + escapeHtml(g.label) + ' ' + {{ _("rounds")|tojson|safe }} + ': </span>'
          + '<span class="' + DZ + '__preview-meta-value">' + escapeHtml(rr.join(', ')) + '</span>'
          + '</p>'
        );
      }
    });
    if (preview.excluded_rounds && preview.excluded_rounds.length) {
      lines.push(
        '<p class="' + DZ + '__preview-line">'
        + '<span class="' + DZ + '__preview-meta-label">' + {{ _("Later rounds (not imported)")|tojson|safe }} + ': </span>'
        + '<span class="' + DZ + '__preview-meta-value">' + escapeHtml(preview.excluded_rounds.join(', ')) + '</span>'
        + '</p>'
      );
    }
    if (preview.sections && preview.sections.length) {
      lines.push(
        '<p class="' + DZ + '__preview-line">'
        + '<span class="' + DZ + '__preview-meta-label">' + {{ _("Sections")|tojson|safe }} + ': </span>'
        + '<span class="' + DZ + '__preview-meta-value">' + escapeHtml(preview.sections.join(', ')) + '</span>'
        + '</p>'
      );
    }
    return '<div class="' + DZ + '__preview">'
         + '<p class="' + DZ + '__preview-line ' + DZ + '__preview-line--success">'
         + '<i class="fas fa-check-circle" aria-hidden="true"></i>'
         + '<span>' + {{ _("Valid UPR workbook")|tojson|safe }} + '</span></p>'
         + lines.join('')
         + '</div>';
  }

  import({{ static_url('js/components/excel-import-dropzone.js') | tojson }})
    .then(function (mod) {
      mod.initExcelImportDropzone('#upr-excel-dropzone', {
        requireValidation:     true,
        submitBtn:             btnNext,      // managed by renderValidationStatus
        csrfToken:             csrfToken,
        maxSizeBytes:          80 * 1024 * 1024,
        buildValidPreviewHtml: buildUprWorkbookPreviewHtml,
        invalidFileTypeLabel:  {{ _("Please upload a valid Excel file (.xlsx or .xls)")|tojson|safe }},
        maxSizeLabel:          {{ _("File is too large (max 80 MB)")|tojson|safe }},
        validationFailedLabel: {{ _("Validation failed. Please choose a different file.")|tojson|safe }},
        networkErrorLabel:     {{ _("Could not reach the server. Please try again.")|tojson|safe }},

        onReset: function () {
          analyzeLoaded = false;
          analyzeData   = null;
          updateNavButtons();
        },

        onFileSelected: function (file, ctx) {
          var renderValidationStatus = ctx.renderValidationStatus;
          var dropzone               = ctx.dropzone;
          var statusEl               = dropzone.querySelector('.' + DZ + '__status');

          analyzeLoaded = false;
          analyzeData   = null;
          updateNavButtons();

          function setPending(msg) {
            if (!statusEl) return;
            statusEl.className = DZ + '__status ' + DZ + '__status--pending';
            statusEl.innerHTML =
              '<div class="' + DZ + '__preview">'
              + '<p class="' + DZ + '__preview-line ' + DZ + '__preview-line--pending">'
              + '<i class="fas fa-spinner fa-spin" aria-hidden="true"></i>'
              + '<span>' + escapeHtml(msg) + '</span>'
              + '</p></div>';
          }

          // Step A: upload
          setPending({{ _("Uploading…")|tojson|safe }});
          var fd = new FormData();
          fd.append('file', file);

          fetch(uploadUrl, { method: 'POST', headers: { 'X-CSRFToken': csrfToken }, body: fd })
            .then(function (r) { return r.json(); })
            .then(function (uploadData) {
              if (!uploadData.success) {
                renderValidationStatus({
                  valid: false,
                  message: uploadData.message || {{ _("Upload failed")|tojson|safe }}
                });
                return;
              }

              // Step B: analyze (polls while the workbook parses in the background)
              setPending({{ _("Analyzing workbook\u2026 this can take a minute on first upload")|tojson|safe }});
              var analyzeDeadline = Date.now() + 5 * 60 * 1000;
              function pollAnalyze() {
                return postJSON(analyzeUrl, {}).then(function (aData) {
                  if (aData && aData.pending) {
                    if (Date.now() > analyzeDeadline) {
                      renderValidationStatus({
                        valid: false,
                        message: {{ _("Workbook analysis timed out. Please try uploading again.")|tojson|safe }}
                      });
                      return;
                    }
                    return new Promise(function (resolve) {
                      setTimeout(function () { resolve(pollAnalyze()); }, 1000);
                    });
                  }
                  if (!aData || !aData.success) {
                    renderValidationStatus({
                      valid: false,
                      message: (aData && aData.message) || {{ _("Analysis failed. Check that the file contains the UPR Data sheet.")|tojson|safe }}
                    });
                    return;
                  }
                  analyzeLoaded = true;
                  analyzeData   = aData;
                  renderValidationStatus({ valid: true, preview: aData });
                });
              }
              return pollAnalyze();
            })
            .catch(function (err) {
              renderValidationStatus({
                valid: false,
                message: err.message || {{ _("Upload failed")|tojson|safe }}
              });
            });
        }
      });
    })
    .catch(function (err) {
      // If the module fails to load, fall back to plain upload so the wizard
      // is not completely broken.
      console.error('Failed to load excel-import-dropzone module:', err);
      var fileInput = document.getElementById('upr_excel_file');
      if (fileInput) {
        fileInput.addEventListener('change', function () {
          var file = fileInput.files[0];
          if (!file) return;
          var fd = new FormData();
          fd.append('file', file);
          btnNext.disabled = true;
          fetch(uploadUrl, { method: 'POST', headers: { 'X-CSRFToken': csrfToken }, body: fd })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d.success) return;
              return postJSON(analyzeUrl, {}).then(function (a) {
                if (!a.success) return;
                analyzeLoaded = true;
                analyzeData   = a;
                updateNavButtons();
              });
            });
        });
      }
    });

  showStep(1);
});
</script>
