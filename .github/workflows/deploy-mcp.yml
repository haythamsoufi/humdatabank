# Build and deploy humanitarian-databank-mcp to Azure App Service (staging).
#
# Staging app: ifrc-databank-mcp-staging (resource group ifrctgo001rg)
# Image:       ifrcimage.azurecr.io/databank_mcp:<tag>
#
# Required GitHub secrets (repository → Settings → Secrets → Actions):
#   ACR_USERNAME              — ifrcimage.azurecr.io registry username
#   ACR_PASSWORD              — ifrcimage.azurecr.io registry password
#   AZURE_MCP_PUBLISH_PROFILE — publish profile XML for ifrc-databank-mcp-staging
#
# Optional: after deploy, ensure Backoffice staging has:
#   MCP_UPSTREAM_URL=https://ifrc-databank-mcp-staging.azurewebsites.net

name: Deploy MCP to Azure

run-name: Deploy MCP — ${{ inputs.environment }} (${{ inputs.version }})

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - Staging
      version:
        description: Container image tag in ACR (e.g. v1.1)
        required: true
        default: v1.1
        type: string
  push:
    branches: [main]
    paths:
      - humanitarian-databank-mcp/**

env:
  ACR_REGISTRY: ifrcimage.azurecr.io
  IMAGE_NAME: databank_mcp
  EFFECTIVE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push MCP container image
        uses: docker/build-push-action@v7
        with:
          context: ./humanitarian-databank-mcp
          file: ./humanitarian-databank-mcp/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EFFECTIVE_VERSION }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Deploy MCP container via Azure CLI
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_MCP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          python3 << 'PY'
          import base64
          import os
          import sys
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          profile = (os.environ.get("PUBLISH_PROFILE") or "").strip()
          if not profile:
              print("ERROR: AZURE_MCP_PUBLISH_PROFILE is not set.")
              sys.exit(1)

          root = ET.fromstring(profile)
          entry = next(
              p for p in root.findall("publishProfile")
              if p.get("publishMethod") == "MSDeploy"
          )
          host = entry.get("publishUrl", "").split(":")[0]
          user = entry.get("userName", "")
          pwd = entry.get("userPWD", "")
          token = base64.b64encode(f"{user}:{pwd}".encode()).decode()

          image = f"${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EFFECTIVE_VERSION }}"
          payload = (
              '{"properties":{"linuxFxVersion":"DOCKER|' + image + '"}}'
          ).encode()
          req = urllib.request.Request(
              f"https://{host}/api/sitecontainers/main",
              data=payload,
              method="PUT",
              headers={
                  "Authorization": f"Basic {token}",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(resp.read().decode()[:500])
          except urllib.error.HTTPError as exc:
              body = exc.read().decode() if exc.fp else ""
              print(f"ERROR: HTTP {exc.code} updating container image: {body[:500]}")
              sys.exit(1)

          restart_req = urllib.request.Request(
              f"https://{host}/api/app/restart",
              method="POST",
              headers={"Authorization": f"Basic {token}"},
          )
          with urllib.request.urlopen(restart_req, timeout=60):
              print("Restarted ifrc-databank-mcp-staging")
          PY

      - name: Deployment summary
        run: |
          {
            echo "## MCP deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`ifrc-databank-mcp-staging\` |"
            echo "| Resource group | \`ifrctgo001rg\` |"
            echo "| Image | \`${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EFFECTIVE_VERSION }}\` |"
            echo "| URL | https://ifrc-databank-mcp-staging.azurewebsites.net/mcp |"
            echo ""
            echo "Set Backoffice \`MCP_UPSTREAM_URL\` to \`https://ifrc-databank-mcp-staging.azurewebsites.net\` if not already configured."
          } >> "$GITHUB_STEP_SUMMARY"
