{#
    Shared numbered steps and warning callout for Excel import/export modals.
#}
{% macro excel_workflow_step(num, icon, title, body) -%}
<li class="flex gap-3 items-start">
    <span class="flex-shrink-0 w-6 h-6 rounded-full bg-green-600 text-white text-xs font-semibold flex items-center justify-center mt-0.5" aria-hidden="true">{{ num }}</span>
    <div class="min-w-0 flex-1">
        <p class="text-sm font-semibold text-gray-900 m-0 flex items-center gap-1.5">
            <i class="fas fa-{{ icon }} text-green-600 text-xs w-3.5 text-center" aria-hidden="true"></i>
            {{ title }}
        </p>
        <p class="text-xs text-gray-600 mt-1 mb-0 leading-relaxed">{{ body }}</p>
    </div>
</li>
{%- endmacro %}

{% macro excel_workflow_warning(message) -%}
<div class="flex gap-2.5 rounded-md border border-amber-200 bg-amber-50 px-3 py-2.5 text-xs text-amber-900 leading-relaxed">
    <i class="fas fa-exclamation-triangle text-amber-500 mt-0.5 flex-shrink-0" aria-hidden="true"></i>
    <span>{{ message }}</span>
</div>
{%- endmacro %}
