name: Humanitarian Databank
paths:
  - Backoffice
  - Website
paths-ignore:
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/build/**"
  - Backoffice/app/static/libs
  # Known false-positive sinks (API-token fingerprint, trusted-path open, JSON error body).
  # See Backoffice/app/utils/_trusted_primitives.py module docstring.
  - Backoffice/app/utils/_trusted_primitives.py
query-filters:
  # Defence in depth if the ignored module is ever re-scanned.
  - exclude:
      id: py/weak-sensitive-data-hashing
      paths:
        - "**/api_key_management.py"
        - "**/_trusted_primitives.py"
  - exclude:
      id: py/path-injection
      paths:
        - "**/safe_workbook.py"
        - "**/_trusted_primitives.py"
  - exclude:
      id: py/stack-trace-exposure
      paths:
        - "**/api_responses.py"
        - "**/_trusted_primitives.py"
