<script nonce="{{ csp_nonce() }}">
(function() {
    function formatFormErrors(errors) {
        if (!errors || typeof errors !== 'object') {
            return '';
        }
        var lines = [];
        Object.keys(errors).forEach(function(field) {
            var fieldErrors = errors[field];
            if (!Array.isArray(fieldErrors)) {
                return;
            }
            fieldErrors.forEach(function(msg) {
                if (msg) {
                    lines.push(String(field) + ': ' + String(msg));
                }
            });
        });
        return lines.join('\n');
    }

    function initIndicatorBankFormWafSubmit(formId, submitBtnId, options) {
        options = options || {};
        var stayOnPage = options.stayOnPage === true;

        var form = document.getElementById(formId);
        if (!form || form.dataset.wafSubmitInit === '1') {
            return;
        }
        form.dataset.wafSubmitInit = '1';

        form.addEventListener('submit', function(event) {
            event.preventDefault();
            if (form.dataset.saveInFlight === '1') {
                return;
            }
            form.dataset.saveInFlight = '1';

            var submitBtn = submitBtnId ? document.getElementById(submitBtnId) : form.querySelector('[type="submit"]');
            var originalBtnHtml = null;
            if (submitBtn) {
                originalBtnHtml = submitBtn.innerHTML;
                submitBtn.disabled = true;
            }

            var restoreSubmitBtn = function() {
                delete form.dataset.saveInFlight;
                if (submitBtn && originalBtnHtml !== null) {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = originalBtnHtml;
                }
            };

            if (!window.formDataToJson) {
                restoreSubmitBtn();
                var helperMsg = {{ _('Unable to save: form helper is not available.')|tojson|safe }};
                if (window.showAlert) {
                    window.showAlert(helperMsg, 'error');
                } else {
                    console.error(helperMsg);
                }
                return;
            }

            var payloadObj = window.formDataToJson(form);
            var csrfToken = payloadObj && payloadObj.csrf_token ? String(payloadObj.csrf_token) : '';
            var payloadB64 = btoa(unescape(encodeURIComponent(JSON.stringify(payloadObj))));
            var fetchFn = (window.getFetch && window.getFetch()) || fetch;

            fetchFn(form.action, {
                method: 'POST',
                body: JSON.stringify({ payload: payloadB64 }),
                credentials: 'same-origin',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json',
                    'Content-Type': 'application/json',
                    'X-CSRFToken': csrfToken
                }
            })
            .then(function(resp) {
                var contentType = resp.headers.get('Content-Type') || '';
                return resp.text().then(function(text) {
                    var data = null;
                    if (contentType.indexOf('application/json') !== -1 || (text && text.trim().charAt(0) === '{')) {
                        try {
                            data = JSON.parse(text);
                        } catch (parseErr) {
                            data = null;
                        }
                    }

                    if (!resp.ok) {
                        var errMsg = (data && data.message)
                            ? data.message
                            : ({{ _('Save failed')|tojson|safe }} + ' (' + resp.status + ')');
                        var errDetails = formatFormErrors(data && data.errors);
                        if (errDetails) {
                            errMsg += '\n\n' + errDetails;
                        }
                        throw new Error(errMsg);
                    }

                    if (stayOnPage) {
                        if (data && data.success) {
                            restoreSubmitBtn();
                            if (data.name && document.title.indexOf('Edit Indicator:') === 0) {
                                document.title = {{ _('Edit Indicator:')|tojson|safe }} + ' ' + data.name;
                            }
                            if (window.showAlert) {
                                window.showAlert(
                                    data.message || {{ _('Indicator saved successfully.')|tojson|safe }},
                                    'success'
                                );
                            }
                            return;
                        }
                        throw new Error((data && data.message) || {{ _('Failed to save indicator')|tojson|safe }});
                    }

                    if (resp.redirected) {
                        window.location.href = resp.url;
                        return;
                    }

                    document.open();
                    document.write(text);
                    document.close();
                });
            })
            .catch(function(err) {
                restoreSubmitBtn();
                var message = (err && err.message) ? err.message : {{ _('Failed to save indicator')|tojson|safe }};
                if (window.showAlert) {
                    window.showAlert(message, 'error');
                } else {
                    console.error(message);
                }
            });
        });
    }

    document.addEventListener('DOMContentLoaded', function() {
        initIndicatorBankFormWafSubmit('edit-indicator-form', 'editIndicatorBankSubmitBtn', { stayOnPage: true });
        initIndicatorBankFormWafSubmit('add-indicator-form', null, { stayOnPage: false });
    });
})();
</script>
