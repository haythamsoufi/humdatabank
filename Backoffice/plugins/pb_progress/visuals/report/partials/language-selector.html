<script>
document.addEventListener("DOMContentLoaded", function () {
  const panelsRoot = document.getElementById("pb-language-panels");
  const main = document.getElementById("quarto-document-content");
  if (!panelsRoot) return;

  const PB_TOC_DEBUG =
    new URLSearchParams(window.location.search).get("pb_debug_toc") === "1" ||
    localStorage.getItem("pb-debug-toc") === "1";
  let tocHostCache = null;

  function tocLog(msg, data) {
    const entry = { msg: msg, data: data || null, t: Date.now() };
    window.__pbReportTocDebug = window.__pbReportTocDebug || [];
    window.__pbReportTocDebug.push(entry);
    if (PB_TOC_DEBUG) {
      console.log("[pb-report-toc]", msg, data || "");
    }
  }

  function tocWarn(msg, data) {
    tocLog(msg, data);
    console.warn("[pb-report-toc]", msg, data || "");
  }

  const panels = Array.from(panelsRoot.querySelectorAll(".pb-lang-panel"));
  if (!panels.length) {
    tocWarn("no language panels found");
    return;
  }

  // ── Embedded-mode helpers ────────────────────────────────────────────────
  const isEmbedded = window.self !== window.top;
  if (isEmbedded) {
    // Hide the iframe's own scrollbar — the parent page handles all scrolling.
    document.documentElement.classList.add("pb-report-embedded");
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
  }

  function postHeightToParent() {
    if (!isEmbedded) return;
    requestAnimationFrame(function () {
      try {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        window.parent.postMessage({ type: "pb-report-height", height: h }, window.location.origin);
      } catch (e) {}
    });
  }
  // ────────────────────────────────────────────────────────────────────────

  const languages = panels.map((p) => p.dataset.lang).filter(Boolean);
  const storageKey = "pb-report-language";
  const defaultLang = panelsRoot.dataset.default || languages[0];
  // Honour an explicit ?lang= query-string param (e.g. set by the backoffice iframe src).
  const urlLang = new URLSearchParams(window.location.search).get("lang");
  let activeLang = (urlLang && languages.includes(urlLang))
    ? urlLang
    : (localStorage.getItem(storageKey) || defaultLang);
  if (!languages.includes(activeLang)) activeLang = defaultLang;

  const marginSidebar = document.querySelector("#quarto-margin-sidebar");
  const leftNav = document.querySelector("#quarto-sidebar nav");
  const chromeHost = marginSidebar || leftNav;
  const toolbarLangHost = document.getElementById("pb-report-toolbar-language");

  const selector = document.createElement("div");
  selector.className = "pb-language-selector";
  selector.innerHTML =
    '<label for="pb-language-select">Language</label>' +
    '<select id="pb-language-select" aria-label="Report language"></select>';

  if (isEmbedded) {
    selector.classList.add("pb-language-selector--embedded-hidden");
    document.body.appendChild(selector);
  } else if (toolbarLangHost) {
    selector.classList.add("pb-language-selector--toolbar");
    toolbarLangHost.appendChild(selector);
  } else if (chromeHost) {
    chromeHost.insertBefore(selector, chromeHost.firstChild);
  } else {
    panelsRoot.parentElement.insertBefore(selector, panelsRoot);
  }

  const select = selector.querySelector("#pb-language-select");
  languages.forEach((lang) => {
    const opt = document.createElement("option");
    opt.value = lang;
    opt.textContent = lang;
    select.appendChild(opt);
  });
  select.value = activeLang;

  function slug(lang) {
    return lang.toLowerCase().replace(/\s+/g, "-");
  }

  function wordHref(lang) {
    return "pb-report-" + slug(lang) + ".docx";
  }

  function clearAnchors() {
    panels.forEach((panel) => {
      panel.querySelectorAll("[data-anchor]").forEach((el) => el.removeAttribute("id"));
    });
  }

  function applyAnchors(panel) {
    panel.querySelectorAll("[data-anchor]").forEach((el) => {
      el.id = el.dataset.anchor;
    });
  }

  function tocHostElement() {
    if (marginSidebar) {
      tocLog("using quarto margin sidebar host");
      return marginSidebar;
    }
    if (leftNav) {
      tocLog("using quarto sidebar nav host");
      return leftNav;
    }
    const quartoSidebar = document.getElementById("quarto-sidebar");
    if (quartoSidebar) {
      tocLog("using quarto sidebar host");
      return quartoSidebar;
    }
    if (!tocHostCache) {
      tocHostCache = document.getElementById("pb-report-toc-host");
      if (!tocHostCache) {
        tocHostCache = document.createElement("div");
        tocHostCache.id = "pb-report-toc-host";
        document.body.appendChild(tocHostCache);
        tocWarn("no quarto sidebar in page-layout-full; created fallback toc host");
      }
    }
    return tocHostCache;
  }

  const TOC_NARROW_MAX = 1100;
  const TOC_STATE_KEY = "pb-report-toc-user-state";

  function isNarrowViewport() {
    return window.innerWidth < TOC_NARROW_MAX;
  }

  function tocOverlapsContent() {
    const toc = document.getElementById("toc");
    const sample =
      document.querySelector(".pb-lang-panel:not([hidden]) .pb-dashboard") ||
      document.querySelector(".pb-dashboard") ||
      main;
    if (!toc || !sample) return isNarrowViewport();
    const tocRect = toc.getBoundingClientRect();
    const contentRect = sample.getBoundingClientRect();
    return tocRect.width > 0 && tocRect.left < contentRect.right - 24;
  }

  function shouldAutoCollapseToc() {
    return isNarrowViewport() || tocOverlapsContent();
  }

  function reportChromeMeta(lang) {
    const blob = document.getElementById("pb-report-header-i18n");
    if (!blob) return {};
    try {
      return JSON.parse(blob.textContent || "{}")[lang] || {};
    } catch (error) {
      tocWarn("chrome i18n parse failed", { lang: lang, error: String(error) });
      return {};
    }
  }

  function tocTitleText() {
    return reportChromeMeta(activeLang).contentsLabel || "Contents";
  }

  function tocExpandLabel() {
    return reportChromeMeta(activeLang).tocExpandLabel || "Expand table of contents";
  }

  function tocCollapseLabel() {
    return reportChromeMeta(activeLang).tocCollapseLabel || "Collapse table of contents";
  }

  function applyTocDirection(toc) {
    if (!toc) return;
    const panel = panels.find((p) => p.dataset.lang === activeLang);
    const dir = (panel && panel.dataset.dir) || "ltr";
    toc.setAttribute("dir", dir);
    toc.classList.toggle("pb-report-toc-rtl", dir === "rtl");
  }

  function refreshTocChrome(toc) {
    if (!toc) return;
    const title = toc.querySelector("#toc-title");
    if (title) title.textContent = tocTitleText();
    applyTocDirection(toc);
    updateTocToggleButton(toc);
  }

  function ensureTocHeader(toc) {
    if (!toc || toc.querySelector(".pb-toc-header")) return;

    const title = toc.querySelector("#toc-title");
    const header = document.createElement("div");
    header.className = "pb-toc-header";

    if (title) {
      title.textContent = tocTitleText();
      header.appendChild(title);
    } else {
      header.innerHTML = '<h2 id="toc-title">' + tocTitleText() + "</h2>";
    }

    const toggleBtn = document.createElement("button");
    toggleBtn.type = "button";
    toggleBtn.className = "pb-toc-toggle-btn";
    toggleBtn.setAttribute("aria-controls", "toc");
    toggleBtn.addEventListener("click", function (event) {
      event.preventDefault();
      event.stopPropagation();
      toggleTocCollapsed(true);
    });
    header.appendChild(toggleBtn);
    toc.insertBefore(header, toc.firstChild);
  }

  function updateTocToggleButton(toc) {
    const btn = toc.querySelector(".pb-toc-toggle-btn");
    if (!btn) return;
    const collapsed = toc.classList.contains("pb-report-toc-collapsed");
    btn.setAttribute("aria-expanded", collapsed ? "false" : "true");
    btn.setAttribute(
      "aria-label",
      collapsed ? tocExpandLabel() : tocCollapseLabel()
    );
    btn.title = btn.getAttribute("aria-label");
    if (collapsed) {
      btn.innerHTML =
        '<span class="pb-toc-toggle-label">' +
        tocTitleText() +
        '</span><span class="pb-toc-toggle-chevron" aria-hidden="true"></span>';
    } else {
      btn.innerHTML =
        '<span class="pb-toc-toggle-chevron pb-toc-toggle-chevron-up" aria-hidden="true"></span>';
    }
  }

  function setTocCollapsed(collapsed, userInitiated) {
    const toc = document.getElementById("toc");
    if (!toc) return;
    ensureTocHeader(toc);
    toc.classList.toggle("pb-report-toc-collapsed", collapsed);
    if (userInitiated) {
      sessionStorage.setItem(TOC_STATE_KEY, collapsed ? "collapsed" : "expanded");
    }
    updateTocToggleButton(toc);
  }

  function toggleTocCollapsed(userInitiated) {
    const toc = document.getElementById("toc");
    if (!toc) return;
    setTocCollapsed(!toc.classList.contains("pb-report-toc-collapsed"), userInitiated);
  }

  function applyTocResponsiveState() {
    const toc = document.getElementById("toc");
    if (!toc) return;
    ensureTocHeader(toc);
    const pref = sessionStorage.getItem(TOC_STATE_KEY);
    let collapsed;
    if (pref === "expanded" && !shouldAutoCollapseToc()) {
      collapsed = false;
    } else if (pref === "collapsed") {
      collapsed = true;
    } else {
      collapsed = shouldAutoCollapseToc();
    }
    toc.classList.toggle("pb-report-toc-collapsed", collapsed);
    updateTocToggleButton(toc);
  }

  function scrollToReportAnchor(anchorId) {
    const target = document.getElementById(anchorId);
    if (!target) {
      tocWarn("scroll skipped — anchor not found", { anchorId: anchorId });
      return;
    }

    if (isEmbedded) {
      let top = 0;
      let node = target;
      while (node) {
        top += node.offsetTop;
        node = node.offsetParent;
      }
      try {
        window.parent.postMessage(
          { type: "pb-report-scroll-to", top: top },
          window.location.origin
        );
      } catch (e) {}
      if (shouldAutoCollapseToc() && sessionStorage.getItem(TOC_STATE_KEY) !== "expanded") {
        setTocCollapsed(true, false);
      }
      return;
    }

    target.scrollIntoView({ behavior: "smooth", block: "start" });
    history.replaceState(null, "", "#" + anchorId);

    if (shouldAutoCollapseToc() && sessionStorage.getItem(TOC_STATE_KEY) !== "expanded") {
      setTocCollapsed(true, false);
    }
  }

  function createTocLink(headingEl) {
    const anchorId = headingEl.dataset.anchor;
    const link = document.createElement("a");
    link.className = "nav-link pb-toc-link";
    link.href = "#" + anchorId;
    link.textContent = headingEl.textContent.trim();
    link.addEventListener("click", function (event) {
      event.preventDefault();
      scrollToReportAnchor(anchorId);
    });
    return link;
  }

  function bindTocNavigation(toc) {
    if (!toc || toc.dataset.pbTocBound === "1") return;
    toc.dataset.pbTocBound = "1";
    toc.addEventListener("click", function (event) {
      const link = event.target.closest("a.pb-toc-link");
      if (!link) return;
      event.preventDefault();
      const anchorId = (link.getAttribute("href") || "").replace(/^#/, "");
      if (anchorId) scrollToReportAnchor(anchorId);
    });
  }

  function sanitizeTocChrome(toc) {
    toc.classList.remove("toc-active");
    toc.querySelectorAll("ul.collapse").forEach(function (ul) {
      ul.classList.remove("collapse");
    });
    toc.querySelectorAll(".nav-link.active").forEach(function (node) {
      node.classList.remove("active");
    });
  }

  function syncToolbarBottomOffset() {
    const toolbar = document.getElementById("pb-report-toolbar");
    if (!toolbar) {
      document.documentElement.style.setProperty("--pb-report-toolbar-bottom", "0px");
      return;
    }
    const bottom = Math.ceil(toolbar.getBoundingClientRect().bottom);
    document.documentElement.style.setProperty("--pb-report-toolbar-bottom", bottom + "px");
  }

  function pinTocBelowToolbar() {
    const toc = document.getElementById("toc");
    if (!toc) {
      tocWarn("pin skipped — #toc not found");
      return;
    }

    document.querySelectorAll("#pb-toc-sidebar-spacer").forEach(function (node) {
      node.remove();
    });
    document.querySelectorAll("#quarto-margin-sidebar.pb-report-toc-pinned, #quarto-sidebar.pb-report-toc-pinned").forEach(function (node) {
      node.classList.remove("pb-report-toc-pinned");
    });

    sanitizeTocChrome(toc);
    syncToolbarBottomOffset();
    toc.classList.add("pb-report-toc-pinned");
    toc.style.removeProperty("--pb-toc-right");
    toc.style.removeProperty("--pb-toc-width");

    const bottom = getComputedStyle(document.documentElement)
      .getPropertyValue("--pb-report-toolbar-bottom")
      .trim();
    tocLog("pinned toc", { toolbarBottom: bottom });
    applyTocResponsiveState();
  }

  function rebuildToc(panel) {
    const host = tocHostElement();
    if (!host) {
      tocWarn("rebuild aborted — no toc host");
      return;
    }

    let toc = host.querySelector("#toc") || document.getElementById("toc");
    if (!toc) {
      const tocNav = document.createElement("nav");
      tocNav.id = "toc";
      tocNav.setAttribute("role", "doc-toc");
      tocNav.className = "pb-report-toc";
      tocNav.innerHTML =
        '<div class="pb-toc-header">' +
        '<h2 id="toc-title">' + tocTitleText() + "</h2>" +
        '<button type="button" class="pb-toc-toggle-btn" aria-controls="toc" aria-expanded="true" aria-label="' +
        tocCollapseLabel().replace(/"/g, "&quot;") +
        '" title="' +
        tocCollapseLabel().replace(/"/g, "&quot;") +
        '"><span class="pb-toc-toggle-chevron pb-toc-toggle-chevron-up" aria-hidden="true"></span></button>' +
        "</div>" +
        '<ul class="toc-list"></ul>';

      const anchor = host.firstChild;
      if (anchor) {
        host.insertBefore(tocNav, anchor);
      } else {
        host.appendChild(tocNav);
      }
      toc = tocNav;
      tocLog("created toc nav", { hostId: host.id || host.tagName });
    }
    bindTocNavigation(toc);
    ensureTocHeader(toc);
    const toggleBtn = toc.querySelector(".pb-toc-toggle-btn");
    if (toggleBtn && toggleBtn.dataset.pbTocToggleBound !== "1") {
      toggleBtn.dataset.pbTocToggleBound = "1";
      toggleBtn.addEventListener("click", function (event) {
        event.preventDefault();
        event.stopPropagation();
        toggleTocCollapsed(true);
      });
    }

    const list = toc.querySelector(".toc-list") || toc.querySelector("ul");
    if (!list) {
      tocWarn("rebuild aborted — toc list element missing");
      return;
    }
    list.innerHTML = "";

    let partCount = 0;
    let sectionCount = 0;
    panel.querySelectorAll(".report-part").forEach((partEl) => {
      const h2 = partEl.querySelector("h2[data-anchor]");
      if (!h2) return;
      partCount += 1;

      const partItem = document.createElement("li");
      partItem.appendChild(createTocLink(h2));

      const childList = document.createElement("ul");
      partEl.querySelectorAll(".report-section-title[data-anchor]").forEach((h3) => {
        sectionCount += 1;
        const childItem = document.createElement("li");
        childItem.appendChild(createTocLink(h3));
        childList.appendChild(childItem);
      });
      if (childList.children.length) partItem.appendChild(childList);
      list.appendChild(partItem);
    });
    tocLog("rebuilt toc", { parts: partCount, sections: sectionCount, items: list.children.length });
    if (!partCount) {
      tocWarn("toc is empty — no .report-part h2[data-anchor] in active panel");
    }
    sanitizeTocChrome(toc);
    refreshTocChrome(toc);
    pinTocBelowToolbar();
  }

  function updateWordLink(lang) {
    const href = wordHref(lang);
    const link = document.getElementById("pb-download-word");
    if (link) link.setAttribute("href", href);
  }

  function updateReportHeader(lang) {
    const blob = document.getElementById("pb-report-header-i18n");
    const header = document.getElementById("title-block-header");
    if (!blob || !header) return;

    let meta;
    try {
      meta = JSON.parse(blob.textContent || "{}")[lang];
    } catch (error) {
      tocWarn("header i18n parse failed", { lang: lang, error: String(error) });
      return;
    }
    if (!meta) return;

    const titleEl = header.querySelector("h1.title");
    if (titleEl && meta.title) titleEl.textContent = meta.title;

    const metaBlocks = header.querySelectorAll(".quarto-title-meta > div");
    if (metaBlocks[0]) {
      const authorHeading = metaBlocks[0].querySelector(".quarto-title-meta-heading");
      const authorValue = metaBlocks[0].querySelector(".quarto-title-meta-contents p");
      if (authorHeading && meta.authorLabel) authorHeading.textContent = meta.authorLabel;
      if (authorValue && meta.author) authorValue.textContent = meta.author;
    }
    if (metaBlocks[1]) {
      const publishedHeading = metaBlocks[1].querySelector(".quarto-title-meta-heading");
      const publishedValue = metaBlocks[1].querySelector(".quarto-title-meta-contents p.date");
      if (publishedHeading && meta.publishedLabel) publishedHeading.textContent = meta.publishedLabel;
      if (publishedValue && meta.date) publishedValue.textContent = meta.date;
    }

    if (meta.title) document.title = meta.title;
  }

  function setLanguage(lang) {
    activeLang = lang;
    localStorage.setItem(storageKey, lang);

    clearAnchors();
    panels.forEach((panel) => {
      const show = panel.dataset.lang === lang;
      panel.hidden = !show;
    });

    const activePanel = panels.find((p) => p.dataset.lang === lang);
    if (!activePanel) return;

    applyAnchors(activePanel);
    rebuildToc(activePanel);
    updateWordLink(lang);
    updateReportHeader(lang);

    const dir = activePanel.dataset.dir || "ltr";
    if (main) main.setAttribute("dir", dir);
    const titleHeader = document.getElementById("title-block-header");
    if (titleHeader) titleHeader.setAttribute("dir", dir);
    document.documentElement.setAttribute("lang", slug(lang).slice(0, 2));
    document.documentElement.classList.toggle("pb-report-arabic", lang === "Arabic");

    const meta = document.getElementById("pb-active-language");
    if (meta) meta.textContent = lang;

    document.dispatchEvent(new CustomEvent("pb-language-changed", { detail: { lang } }));

    if (isEmbedded) {
      try {
        window.parent.postMessage({ type: "pb-report-language", lang: lang }, window.location.origin);
      } catch (e) {}
    }

    if (typeof window.updatePbReportToolbarOffset === "function") {
      window.updatePbReportToolbarOffset();
    }

    pinTocBelowToolbar();
    postHeightToParent();
  }

  window.addEventListener("pb-report-toolbar-resize", pinTocBelowToolbar);
  window.addEventListener("scroll", pinTocBelowToolbar, { passive: true });
  window.addEventListener("resize", applyTocResponsiveState);

  select.addEventListener("change", function () {
    setLanguage(select.value);
  });

  window.addEventListener("message", function (event) {
    if (event.origin !== window.location.origin) return;
    if (!event.data || event.data.type !== "pb-report-set-language") return;
    const lang = event.data.lang;
    if (!languages.includes(lang) || select.value === lang) return;
    select.value = lang;
    setLanguage(lang);
  });

  setLanguage(activeLang);
  tocLog("init complete", {
    embedded: isEmbedded,
    activeLang: activeLang,
    hasMarginSidebar: !!marginSidebar,
    hasQuartoSidebar: !!document.getElementById("quarto-sidebar"),
    hasToc: !!document.getElementById("toc"),
    debug: PB_TOC_DEBUG ? "verbose (?pb_debug_toc=1)" : "warnings only — add ?pb_debug_toc=1 for verbose",
  });
  // Post initial height after paint, and again on any resize.
  postHeightToParent();
  if (isEmbedded) {
    window.addEventListener("resize", postHeightToParent);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(postHeightToParent).observe(document.body);
    }
  }
});
</script>
