<script nonce="{{ csp_nonce() }}">
document.addEventListener('DOMContentLoaded', function () {
  var root = document.getElementById('upr-excel-import-root');
  if (!root) return;
  var csrfToken = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
  var uploadUrl  = {{ url_for('upr_excel_import.upload') | tojson }};
  var analyzeUrl = {{ url_for('upr_excel_import.analyze') | tojson }};
  var planUrl    = {{ url_for('upr_excel_import.plan') | tojson }};
  var previewUrl = {{ url_for('upr_excel_import.preview') | tojson }};
  var runUrl     = {{ url_for('upr_excel_import.run_import') | tojson }};
  var statusUrlTpl = {{ url_for('upr_excel_import.job_status', job_id='__JOB__') | tojson }};

  var step          = 1;
  var analyzeLoaded = false;
  var analyzeData   = null;
  var previewLoading = false;
  var previewLoaded = false;
  var previewStale = false;
  var activeJobId   = null;
  var pollTimer     = null;
  var planData      = null;      // verified plan from /plan
  var planLoading   = false;
  var selectedKeys  = {};        // "24:P26" -> true

  var panels    = document.querySelectorAll('#upr-excel-import-root .upr-excel-wizard-panel');
  var stepEls   = document.querySelectorAll('#upr-excel-wizard-steps .upr-excel-wizard-step');
  var connectors = document.querySelectorAll('#upr-excel-wizard-steps .upr-excel-wizard-connector');
  var btnBack   = document.getElementById('upr-excel-wizard-back');
  var btnNext   = document.getElementById('upr-excel-wizard-next');
  var btnPreview = document.getElementById('upr-excel-wizard-preview');
  var btnRun    = document.getElementById('upr-excel-wizard-run');
  var doneActions = document.getElementById('upr-excel-wizard-done-actions');
  var btnRestart  = document.getElementById('upr-excel-wizard-restart');
  var previewLoadingEl = document.getElementById('upr-excel-preview-loading');
  var previewSummaryEl = document.getElementById('upr-excel-preview-summary');
  var previewStaleHintEl = document.getElementById('upr-excel-preview-stale-hint');
  var planLoadingEl = document.getElementById('upr-excel-plan-loading');
  var planErrorEl = document.getElementById('upr-excel-plan-error');
  var planRootEl = document.getElementById('upr-excel-plan-root');
  var planSummaryEl = document.getElementById('upr-excel-plan-summary');
  var planGroupsEl = document.getElementById('upr-excel-plan-groups');
  var planNotesEl = document.getElementById('upr-excel-plan-notes');
  var selectionSummaryEl = document.getElementById('upr-excel-selection-summary');
  var ackWrapEl = document.getElementById('upr-excel-ack-wrap');
  var ackInput = document.getElementById('upr-excel-ack');
  var batchSizeInput = document.getElementById('upr-batch-size');
  var dryRunInput = document.getElementById('upr-dry-run');

  // ── Helpers ──────────────────────────────────────────────────────────────

  function escapeHtml(text) {
    return String(text || '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function appendText(parent, text) {
    parent.appendChild(document.createTextNode(text == null ? '' : String(text)));
  }

  function setParagraph(container, className, text) {
    container.replaceChildren(el('p', className, text));
  }

  function isSafeHref(url) {
    if (!url || typeof url !== 'string') return false;
    var u = url.trim();
    return u.startsWith('/') || u.startsWith('https://') || u.startsWith('http://');
  }

  function appendTextLink(parent, href, text, className, attrs) {
    var a = el('a', className || 'text-purple-700 underline', text);
    a.setAttribute('href', isSafeHref(href) ? href : '#');
    if (attrs) {
      Object.keys(attrs).forEach(function (key) { a.setAttribute(key, attrs[key]); });
    }
    parent.appendChild(a);
    return a;
  }

  function postJSON(url, body) {
    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      body: JSON.stringify(body || {})
    }).then(function (r) { return r.json(); });
  }

  // ── Verified targets (template + round -> one assigned form) ─────────────

  function planItems() {
    return (planData && planData.targets) || [];
  }

  function selectedItems() {
    return planItems().filter(function (it) { return selectedKeys[it.key] && it.selectable; });
  }

  function selectedTargets() {
    return selectedItems().map(function (it) {
      return { template_id: it.template_id, round: it.round };
    });
  }

  function selectedHaveWarnings() {
    return selectedItems().some(function (it) { return it.status === 'warning'; });
  }

  function canRunImport() {
    if (planLoading || !planData || !selectedItems().length) return false;
    var dry = document.getElementById('upr-dry-run');
    if (selectedHaveWarnings() && !(dry && dry.checked) && !(ackInput && ackInput.checked)) return false;
    return true;
  }

  function markPreviewStale() {
    if (!previewLoaded || previewLoading) return;
    previewStale = true;
    if (previewStaleHintEl) previewStaleHintEl.classList.remove('hidden');
  }

  function clearPreviewState() {
    previewLoaded = false;
    previewStale = false;
    previewSummaryEl.classList.add('hidden');
    previewSummaryEl.replaceChildren();
    if (previewStaleHintEl) previewStaleHintEl.classList.add('hidden');
  }

  function resetConfigureStep() {
    clearPreviewState();
    previewLoading = false;
    previewLoadingEl.classList.add('hidden');
  }

  // ── Navigation ───────────────────────────────────────────────────────────

  function updateNavButtons() {
    var busy = step === 2 && (previewLoading || planLoading);
    btnBack.disabled = busy;
    btnNext.disabled = !analyzeLoaded;
    if (btnPreview) btnPreview.disabled = busy || !canRunImport();
    btnRun.disabled = busy || !canRunImport();
  }

  function showStep(n) {
    step = n;
    panels.forEach(function (p, i) { p.classList.toggle('hidden', i + 1 !== n); });
    stepEls.forEach(function (el, i) {
      el.classList.remove('active', 'completed', 'text-gray-400', 'border-gray-300');
      if      (i + 1 < n)  el.classList.add('completed');
      else if (i + 1 === n) el.classList.add('active');
      else                  el.classList.add('text-gray-400', 'border-gray-300');
    });
    connectors.forEach(function (c, i) {
      c.classList.remove('completed', 'active');
      if      (i + 1 < n)  c.classList.add('completed');
      else if (i + 1 === n) c.classList.add('active');
    });
    // Back: visible only on configure step (step 2)
    btnBack.classList.toggle('hidden', n !== 2);
    // Next: visible only on upload step (step 1)
    btnNext.classList.toggle('hidden', n !== 1);
    // Run + preview: visible only on configure step (step 2)
    btnRun.classList.toggle('hidden', n !== 2);
    if (btnPreview) btnPreview.classList.toggle('hidden', n !== 2);
    // Done actions: hidden whenever we change step (shown by pollStatus on terminal state)
    doneActions.classList.add('hidden');
    updateNavButtons();
  }

  btnNext.addEventListener('click', function () {
    if (step === 1 && analyzeLoaded) {
      resetConfigureStep();
      showStep(2);
      loadPlan();
    }
  });
  btnBack.addEventListener('click', function () { if (step > 1) showStep(step - 1); });

  function loadPreview() {
    if (previewLoading || planLoading || !selectedItems().length) return;
    previewLoading = true;
    previewSummaryEl.classList.add('hidden');
    previewSummaryEl.replaceChildren();
    if (previewStaleHintEl) previewStaleHintEl.classList.add('hidden');
    previewLoadingEl.classList.remove('hidden');
    updateNavButtons();

    postJSON(previewUrl, { targets: selectedTargets() })
      .then(function (data) {
        previewLoaded = !!data.success;
        previewStale = false;
        previewSummaryEl.classList.remove('hidden');
        if (data.success) {
          renderPreviewSummary(previewSummaryEl, data);
        } else {
          setParagraph(previewSummaryEl, 'text-red-600', data.message || {{ _("Preview failed")|tojson|safe }});
        }
      })
      .catch(function (err) {
        previewLoaded = false;
        previewSummaryEl.classList.remove('hidden');
        setParagraph(previewSummaryEl, 'text-red-600', err.message || {{ _("Preview failed")|tojson|safe }});
      })
      .finally(function () {
        previewLoading = false;
        previewLoadingEl.classList.add('hidden');
        updateNavButtons();
      });
  }

  if (btnPreview) btnPreview.addEventListener('click', loadPreview);

  if (batchSizeInput) batchSizeInput.addEventListener('input', markPreviewStale);
  if (dryRunInput) dryRunInput.addEventListener('change', function () {
    markPreviewStale();
    updateNavButtons();
  });
  if (ackInput) ackInput.addEventListener('change', updateNavButtons);

  // ── Target plan: load, render, select ────────────────────────────────────

  var STATUS_BADGE = {
    ok:      { cls: 'bg-green-100 text-green-800',  label: {{ _("Ready")|tojson|safe }} },
    warning: { cls: 'bg-amber-100 text-amber-800',  label: {{ _("Review")|tojson|safe }} },
    blocked: { cls: 'bg-red-100 text-red-800',      label: {{ _("Blocked")|tojson|safe }} },
    empty:   { cls: 'bg-gray-100 text-gray-600',    label: {{ _("No data")|tojson|safe }} }
  };
  var ISSUE_CLASS = {
    error:   'text-red-700',
    warning: 'text-amber-700',
    info:    'text-gray-500'
  };
  var KIND_ORDER = ['Planning', 'Annual report', 'Mid-year report'];

  function badge(status) {
    var b = STATUS_BADGE[status] || STATUS_BADGE.empty;
    return el('span', 'inline-block px-2 py-0.5 rounded-full text-xs font-medium ' + b.cls, b.label);
  }

  // One row per round; columns: Country template | PNS template.
  var COLUMN_OF_TEMPLATE = { 24: 'country', 33: 'country', 22: 'pns', 23: 'pns' };

  function targetCell(it) {
    var td = el('td', 'px-3 py-2 align-top');
    if (!it) {
      td.appendChild(el('span', 'text-gray-300', '—'));
      return td;
    }
    var line = el('label', 'flex items-center gap-2' + (it.selectable ? ' cursor-pointer' : ' text-gray-400'));
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.className = 'h-4 w-4';
    cb.checked = !!selectedKeys[it.key] && it.selectable;
    cb.disabled = !it.selectable;
    cb.setAttribute('aria-label', it.template_name + ' ' + it.round);
    cb.addEventListener('change', function () {
      if (cb.checked) selectedKeys[it.key] = true; else delete selectedKeys[it.key];
      onSelectionChanged();
    });
    line.appendChild(cb);
    var af = it.assigned_form_id ? '#' + it.assigned_form_id : (it.assigned_forms && it.assigned_forms.length ? '#?' : '—');
    line.appendChild(el('span', 'font-medium', af));
    var b = badge(it.status);
    var firstError = (it.issues || []).filter(function (i) { return i.level === 'error'; })[0];
    if (firstError) b.title = firstError.message;
    line.appendChild(b);
    td.appendChild(line);
    return td;
  }

  function renderPlan() {
    planSummaryEl.replaceChildren();
    planGroupsEl.replaceChildren();
    planNotesEl.replaceChildren();
    if (!planData) return;
    var s = planData.summary || {};
    ['ok', 'warning', 'blocked', 'empty'].forEach(function (key) {
      if (!s[key]) return;
      var chip = badge(key);
      chip.textContent = s[key] + ' ' + STATUS_BADGE[key].label.toLowerCase();
      planSummaryEl.appendChild(chip);
    });

    // round -> { kind, period, country: item, pns: item }
    var rounds = [];
    var byRound = {};
    planItems().forEach(function (it) {
      var row = byRound[it.round];
      if (!row) {
        row = byRound[it.round] = { round: it.round, kind: it.kind, period: it.period };
        rounds.push(row);
      }
      row[COLUMN_OF_TEMPLATE[it.template_id] || 'country'] = it;
    });

    var wrap = el('div', 'overflow-x-auto border border-gray-200 rounded-md');
    var table = el('table', 'min-w-full text-sm');
    var thead = el('thead', 'bg-gray-50 text-xs text-gray-600');
    var hr = el('tr', '');
    [{{ _("Round")|tojson|safe }}, {{ _("Country")|tojson|safe }}, {{ _("PNS")|tojson|safe }}, '']
      .forEach(function (h) { hr.appendChild(el('th', 'px-3 py-2 text-left font-medium', h)); });
    thead.appendChild(hr);
    table.appendChild(thead);
    var tbody = el('tbody', '');

    var lastKind = null;
    rounds.forEach(function (row) {
      if (row.kind !== lastKind) {
        lastKind = row.kind;
        var gh = el('tr', 'bg-gray-50');
        var gtd = el('td', 'px-3 py-1 text-xs font-semibold text-gray-700', row.kind);
        gtd.colSpan = 4;
        gh.appendChild(gtd);
        tbody.appendChild(gh);
      }
      var tr = el('tr', 'border-t border-gray-100');
      tr.appendChild(el('td', 'px-3 py-2 align-top font-medium whitespace-nowrap', row.round + ' → ' + row.period));
      tr.appendChild(targetCell(row.country));
      tr.appendChild(targetCell(row.pns));

      // Warnings / info stay collapsed behind a small toggle.
      var notes = [];
      [['Country', row.country], ['PNS', row.pns]].forEach(function (pair) {
        var it = pair[1];
        if (!it) return;
        (it.issues || []).forEach(function (i) { notes.push({ who: pair[0], issue: i, item: it }); });
      });
      var toggleTd = el('td', 'px-3 py-2 align-top text-right whitespace-nowrap');
      tr.appendChild(toggleTd);
      tbody.appendChild(tr);
      if (!notes.length) return;

      var detailsTr = el('tr', 'hidden');
      var dtd = el('td', 'px-3 pb-2 text-xs');
      dtd.colSpan = 4;
      var ul = el('ul', 'space-y-0.5');
      notes.forEach(function (n) {
        var li = el('li', ISSUE_CLASS[n.issue.level] || '',
          n.who + ' (' + n.item.template_name + ', #' + (n.item.assigned_form_id || '?') + '): ' + n.issue.message);
        if (n.issue.items && n.issue.items.length) li.title = n.issue.items.join(', ');
        ul.appendChild(li);
      });
      dtd.appendChild(ul);
      detailsTr.appendChild(dtd);
      tbody.appendChild(detailsTr);

      var toggle = el('button', 'text-xs text-purple-700 underline', {{ _("Details")|tojson|safe }} + ' (' + notes.length + ')');
      toggle.type = 'button';
      toggle.setAttribute('aria-expanded', 'false');
      toggle.addEventListener('click', function () {
        var open = detailsTr.classList.toggle('hidden') === false;
        toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
      });
      toggleTd.appendChild(toggle);
    });
    table.appendChild(tbody);
    wrap.appendChild(table);
    planGroupsEl.appendChild(wrap);

    // Workbook-level notes, collapsed.
    var lines = [];
    var notImportable = planData.not_importable_rounds || [];
    if (notImportable.length) {
      lines.push({{ _("In the workbook but never imported (live or later rounds): ")|tojson|safe }}
        + notImportable.map(function (r) { return r.round; }).join(', '));
    }
    var unrecognised = planData.unrecognised_rounds || [];
    if (unrecognised.length) {
      lines.push({{ _("Unrecognised round codes ignored: ")|tojson|safe }} + unrecognised.join(', '));
    }
    var missing = planData.allowlisted_rounds_missing || [];
    if (missing.length) {
      lines.push({{ _("Importable rounds absent from this workbook: ")|tojson|safe }} + missing.join(', '));
    }
    (planData.templates || []).filter(function (t) { return !t.ready; }).forEach(function (t) {
      lines.push({{ _("Template ")|tojson|safe }} + t.template_id + ' (' + (t.name || '') + '): '
        + {{ _("published form items not resolved — ")|tojson|safe }} + (t.missing || []).join(', '));
    });
    if (lines.length) {
      var det = document.createElement('details');
      det.className = 'text-gray-600';
      det.appendChild(el('summary', 'cursor-pointer text-xs text-gray-600', {{ _("Workbook notes")|tojson|safe }} + ' (' + lines.length + ')'));
      var nul = el('ul', 'mt-1 space-y-0.5 list-disc ml-5');
      lines.forEach(function (t) { nul.appendChild(el('li', '', t)); });
      det.appendChild(nul);
      planNotesEl.appendChild(det);
    }
  }
  function onSelectionChanged() {
    var items = selectedItems();
    if (!items.length) {
      selectionSummaryEl.classList.add('hidden');
      selectionSummaryEl.replaceChildren();
    } else {
      var forms = {};
      items.forEach(function (it) { if (it.assigned_form_id) forms[it.assigned_form_id] = true; });
      var rows = items.reduce(function (n, it) { return n + (it.workbook_rows || 0); }, 0);
      var p = el('p', '');
      p.appendChild(el('strong', '', items.length + ' ' + {{ _("target(s)")|tojson|safe }}));
      appendText(p, ' → ' + Object.keys(forms).length + ' ' + {{ _("assigned form(s)")|tojson|safe }}
        + ' (' + Object.keys(forms).map(function (id) { return '#' + id; }).join(', ') + '), '
        + rows + ' ' + {{ _("workbook rows")|tojson|safe }} + ': '
        + items.map(function (it) { return it.key; }).join(', '));
      selectionSummaryEl.replaceChildren(p);
      selectionSummaryEl.classList.remove('hidden');
    }
    var needsAck = selectedHaveWarnings();
    ackWrapEl.classList.toggle('hidden', !needsAck);
    if (!needsAck && ackInput) ackInput.checked = false;
    markPreviewStale();
    updateNavButtons();
  }

  function loadPlan() {
    if (planLoading) return;
    planLoading = true;
    planData = null;
    selectedKeys = {};
    setSelectHint('');
    planErrorEl.classList.add('hidden');
    planRootEl.classList.add('hidden');
    planLoadingEl.classList.remove('hidden');
    onSelectionChanged();
    postJSON(planUrl, {})
      .then(function (data) {
        if (!data || !data.success) {
          planErrorEl.textContent = (data && data.message) || {{ _("Could not verify import targets")|tojson|safe }};
          planErrorEl.classList.remove('hidden');
          return;
        }
        planData = data;
        renderPlan();
        planRootEl.classList.remove('hidden');
      })
      .catch(function (err) {
        planErrorEl.textContent = (err && err.message) || {{ _("Could not verify import targets")|tojson|safe }};
        planErrorEl.classList.remove('hidden');
      })
      .finally(function () {
        planLoading = false;
        planLoadingEl.classList.add('hidden');
        onSelectionChanged();
      });
  }

  var selectHintEl = document.getElementById('upr-excel-select-hint');

  function setSelectHint(text) {
    if (!selectHintEl) return;
    selectHintEl.textContent = text || '';
    selectHintEl.classList.toggle('hidden', !text);
  }

  // Bulk-select every plan item accepted by `predicate`, then redraw the table.
  function bulkSelect(predicate, emptyMessage) {
    var added = 0;
    planItems().forEach(function (it) {
      if (it.selectable && predicate(it)) {
        selectedKeys[it.key] = true;
        added += 1;
      }
    });
    renderPlan();
    onSelectionChanged();
    setSelectHint(added ? '' : emptyMessage);
  }

  var selectReadyBtn = document.getElementById('upr-excel-select-ready');
  if (selectReadyBtn) selectReadyBtn.addEventListener('click', function () {
    bulkSelect(
      function (it) { return it.status === 'ok'; },
      {{ _("No target is fully ready: every importable target carries a warning (existing progress, skipped entities, cleared PNS data…). Use “Select all applicable” and review the warnings.")|tojson|safe }}
    );
  });
  var selectImportableBtn = document.getElementById('upr-excel-select-importable');
  if (selectImportableBtn) selectImportableBtn.addEventListener('click', function () {
    bulkSelect(
      function () { return true; },
      {{ _("No target can be imported: all are blocked or have no workbook data.")|tojson|safe }}
    );
  });
  document.getElementById('upr-excel-select-none').addEventListener('click', function () {
    selectedKeys = {};
    renderPlan();
    onSelectionChanged();
    setSelectHint('');
  });
  document.getElementById('upr-excel-reverify').addEventListener('click', loadPlan);

  // ── Configure preview ────────────────────────────────────────────────────

  function labeledParagraph(label, value, className) {
    var p = el('p', className || '');
    p.appendChild(el('strong', '', label + ':'));
    appendText(p, ' ' + value);
    return p;
  }

  var warningSectionTitle = {
    review: {{ _("Review on the form")|tojson|safe }},
    matched: {{ _("Matched to a GO appeal")|tojson|safe }},
    other: {{ _("Other")|tojson|safe }}
  };
  var warningSectionNote = {
    unlisted_imported: {{ _("Emergency appeals that are not in GO were imported with the Excel name and code.")|tojson|safe }}
  };

  function renderWarningItem(item, className) {
    if (typeof item === 'string') {
      return el('li', className, item);
    }
    var li = el('li', className);
    appendText(li, item.text || '');
    if (item.meta) {
      var meta = el('span', 'font-medium');
      appendText(meta, ' (' + item.meta + ')');
      li.appendChild(meta);
    }
    if (item.lines && item.lines.length) {
      var sub = el('div', 'mt-1 ml-1 text-xs');
      item.lines.forEach(function (line) {
        sub.appendChild(el('div', '', line));
      });
      li.appendChild(sub);
    }
    if (item.detail) {
      li.appendChild(el('div', 'mt-1 text-xs', item.detail));
    }
    return li;
  }

  function renderWarningGroups(wrap, data) {
    var groups = data.warning_groups || [];
    if (!groups.length) {
      var list = el('ul', 'list-disc ml-5 space-y-1 text-amber-900 text-sm');
      (data.warnings || []).forEach(function (w) {
        list.appendChild(el('li', '', w));
      });
      wrap.appendChild(list);
      return;
    }
    groups.forEach(function (group, index) {
      var block = el('div', index ? 'mt-3' : '');
      var title = warningSectionTitle[group.id] || group.id;
      var count = (group.items || []).length;
      var headingClass = group.id === 'matched' ? 'font-medium text-gray-700 mb-1' : 'font-medium text-amber-900 mb-1';
      block.appendChild(el('p', headingClass, title + ' (' + count + ')'));
      if (group.note) {
        block.appendChild(el('p', 'text-xs text-amber-800 mb-1', warningSectionNote[group.note] || group.note));
      }
      var listClass = group.id === 'matched'
        ? 'list-disc ml-5 space-y-1 text-sm text-gray-700'
        : 'list-disc ml-5 space-y-1 text-sm text-amber-900';
      var list = el('ul', listClass);
      (group.items || []).forEach(function (item) {
        list.appendChild(renderWarningItem(item, ''));
      });
      block.appendChild(list);
      wrap.appendChild(block);
    });
  }

  function renderPreviewSummary(container, data) {
    var nodes = [
      labeledParagraph({{ _("Transformed form_data rows")|tojson|safe }}, data.transformed_rows),
      labeledParagraph({{ _("Countries with data")|tojson|safe }}, data.countries)
    ];
    if (data.warning_count) {
      var warnLabel = String(data.warning_count);
      if (data.warning_unique_count && data.warning_unique_count !== data.warning_count) {
        warnLabel += ' (' + data.warning_unique_count + ' ' + {{ _("unique")|tojson|safe }} + ')';
      }
      nodes.push(labeledParagraph({{ _("Warnings")|tojson|safe }}, warnLabel, 'text-amber-700'));
      var wrap = el('div', 'max-h-96 overflow-y-auto mt-2 border border-amber-200 rounded-md bg-amber-50 p-3');
      renderWarningGroups(wrap, data);
      nodes.push(wrap);
    }
    container.replaceChildren.apply(container, nodes);
  }

  // ── Import job polling ───────────────────────────────────────────────────

  btnRun.addEventListener('click', function () {
    if (!canRunImport() || previewLoading) return;
    var chosen = selectedItems();
    var isDry = document.getElementById('upr-dry-run').checked;
    if (!isDry) {
      var forms = {};
      chosen.forEach(function (it) { if (it.assigned_form_id) forms[it.assigned_form_id] = true; });
      var msg = {{ _("Import into the database now?")|tojson|safe }} + '\n\n'
        + chosen.map(function (it) {
            return it.key + ' → ' + {{ _("assigned form")|tojson|safe }} + ' #' + it.assigned_form_id
              + ' (' + it.template_name + ', ' + it.period + ')';
          }).join('\n');
      if (!window.confirm(msg)) return;
    }
    showStep(3);
    document.getElementById('upr-excel-import-progress').classList.remove('hidden');
    postJSON(runUrl, {
      targets:              selectedTargets(),
      dry_run:              isDry,
      batch_size:           parseInt(document.getElementById('upr-batch-size').value, 10) || 1000,
      async:                true
    }).then(function (data) {
      if (!data.success || !data.job_id) {
        setParagraph(
          document.getElementById('upr-excel-import-result'),
          'text-red-700',
          data.message || data.error || 'Import failed'
        );
        doneActions.classList.remove('hidden');
        return;
      }
      activeJobId = data.job_id;
      pollStatus();
    }).catch(function (err) {
      setParagraph(
        document.getElementById('upr-excel-import-result'),
        'text-red-700',
        (err && err.message) || {{ _("Import failed")|tojson|safe }}
      );
      doneActions.classList.remove('hidden');
    });
  });

  if (btnRestart) {
    btnRestart.addEventListener('click', function () { window.location.reload(); });
  }

  function pollStatus() {
    if (!activeJobId) return;
    fetch(statusUrlTpl.replace('__JOB__', encodeURIComponent(activeJobId)))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !data.success || !data.job) {
          setParagraph(
            document.getElementById('upr-excel-import-result'),
            'text-red-700',
            (data && data.message) || {{ _("Import job not found")|tojson|safe }}
          );
          doneActions.classList.remove('hidden');
          return;
        }
        var job  = data.job;
        var pct  = job.percent || 0;
        document.getElementById('upr-excel-import-stage').textContent        = job.message || job.stage || '-';
        document.getElementById('upr-excel-import-progress-bar').style.width = pct + '%';
        document.getElementById('upr-excel-import-progress-text').textContent = Math.round(pct) + '%';

        if (job.status === 'completed') {
          var stats = job.stats || {};
          var resultEl = document.getElementById('upr-excel-import-result');
          var p = el('p', 'text-green-700');
          appendText(p, 'Loaded: ' + (stats.loaded || 0)
            + ', Inserted: ' + (stats.inserted || 0)
            + ', Updated: ' + (stats.updated || 0)
            + ', Skipped: ' + (stats.skipped || 0)
            + ', Errors: ' + (stats.errors || 0)
            + (stats.targets && stats.targets.length ? ' — Targets: ' + stats.targets.join(', ') : ''));
          if (job.download_ready && job.download_url) {
            appendText(p, ' ');
            appendTextLink(p, job.download_url, {{ _("Download preview Excel")|tojson|safe }});
          }
          if (/^[a-fA-F0-9]{32}$/.test(activeJobId || '')) {
            appendText(p, ' ');
            appendTextLink(
              p,
              '/admin/import-logs/' + encodeURIComponent(activeJobId),
              {{ _("View change log")|tojson|safe }},
              'text-purple-700 underline',
              { target: '_blank', rel: 'noopener' }
            );
          }
          resultEl.replaceChildren(p);
          doneActions.classList.remove('hidden');
          return;
        }
        if (job.status === 'failed') {
          setParagraph(document.getElementById('upr-excel-import-result'), 'text-red-700', job.error || 'Failed');
          doneActions.classList.remove('hidden');
          return;
        }
        pollTimer = setTimeout(pollStatus, 1000);
      })
      .catch(function () {
        // Transient network error: keep polling; the job runs server-side regardless.
        pollTimer = setTimeout(pollStatus, 2000);
      });
  }

  // ── Dropzone: upload + analyze pipeline ─────────────────────────────────
  //
  // We use initExcelImportDropzone with a custom onFileSelected callback.
  // After client-side file-type & size checks pass the hook:
  //   1. POSTs the file to /upload (server-side MIME + extension check)
  //   2. On success, POSTs to /analyze (reads the "UPR Data" sheet)
  //   3. Calls renderValidationStatus({ valid, preview }) — which drives the
  //      dropzone status panel AND enables/disables btnNext (passed as submitBtn).
  //
  // The custom buildValidPreviewHtml renders the workbook summary (rows / countries
  // / rounds / sections) in place of the generic template-import summary.

  var DZ = 'excel-io-dropzone'; // CSS class prefix from excel-import-dropzone.js

  var notImportedTitle = {{ _("Not imported")|tojson }};
  var skippedRoundsHint = {{ _("Grey rounds are in the workbook and are not imported.")|tojson }};

  function formatRoundList(codes, excluded) {
    return (codes || []).map(function (code) {
      var skipped = !!excluded[String(code).toUpperCase()];
      if (!skipped) return escapeHtml(code);
      return '<span class="upr-excel-round--skipped" title="' + escapeHtml(notImportedTitle) + '">'
        + escapeHtml(code) + '</span>';
    }).join(', ');
  }

  function buildUprWorkbookPreviewHtml(preview) {
    var lines = [];
    var parts = [];
    if (preview.total_rows != null) parts.push(escapeHtml(String(preview.total_rows)) + ' ' + {{ _("rows")|tojson|safe }});
    if (preview.countries   != null) parts.push(escapeHtml(String(preview.countries)) + ' ' + {{ _("countries")|tojson|safe }});
    if (parts.length) lines.push('<p class="' + DZ + '__preview-line">' + parts.join(' &middot; ') + '</p>');
    var excluded = {};
    (preview.excluded_rounds || []).forEach(function (code) {
      excluded[String(code).toUpperCase()] = true;
    });
    var roundGroups = [
      { label: {{ _("Planning")|tojson|safe }}, key: 'planning_rounds' },
      { label: {{ _("AR")|tojson|safe }},       key: 'ar_rounds' },
      { label: {{ _("UPR Country Reporting")|tojson|safe }}, key: 'myr_rounds' }
    ];
    roundGroups.forEach(function (g) {
      var rr = preview[g.key];
      if (rr && rr.length) {
        lines.push(
          '<p class="' + DZ + '__preview-line">'
          + '<span class="' + DZ + '__preview-meta-label">' + escapeHtml(g.label) + ' ' + {{ _("rounds")|tojson|safe }} + ': </span>'
          + '<span class="' + DZ + '__preview-meta-value">' + formatRoundList(rr, excluded) + '</span>'
          + '</p>'
        );
      }
    });
    if (preview.excluded_rounds && preview.excluded_rounds.length) {
      lines.push(
        '<p class="' + DZ + '__preview-line upr-excel-round-legend">'
        + escapeHtml(skippedRoundsHint)
        + '</p>'
      );
    }
    if (preview.sections && preview.sections.length) {
      lines.push(
        '<p class="' + DZ + '__preview-line">'
        + '<span class="' + DZ + '__preview-meta-label">' + {{ _("Sections")|tojson|safe }} + ': </span>'
        + '<span class="' + DZ + '__preview-meta-value">' + escapeHtml(preview.sections.join(', ')) + '</span>'
        + '</p>'
      );
    }
    return '<div class="' + DZ + '__preview">'
         + '<p class="' + DZ + '__preview-line ' + DZ + '__preview-line--success">'
         + '<i class="fas fa-check-circle" aria-hidden="true"></i>'
         + '<span>' + {{ _("Valid UPR workbook")|tojson|safe }} + '</span></p>'
         + lines.join('')
         + '</div>';
  }

  import({{ static_url('js/components/excel-import-dropzone.js') | tojson }})
    .then(function (mod) {
      mod.initExcelImportDropzone('#upr-excel-dropzone', {
        requireValidation:     true,
        submitBtn:             btnNext,      // managed by renderValidationStatus
        csrfToken:             csrfToken,
        maxSizeBytes:          80 * 1024 * 1024,
        buildValidPreviewHtml: buildUprWorkbookPreviewHtml,
        invalidFileTypeLabel:  {{ _("Please upload a valid Excel file (.xlsx or .xls)")|tojson|safe }},
        maxSizeLabel:          {{ _("File is too large (max 80 MB)")|tojson|safe }},
        validationFailedLabel: {{ _("Validation failed. Please choose a different file.")|tojson|safe }},
        networkErrorLabel:     {{ _("Could not reach the server. Please try again.")|tojson|safe }},

        onReset: function () {
          analyzeLoaded = false;
          analyzeData   = null;
          updateNavButtons();
        },

        onFileSelected: function (file, ctx) {
          var renderValidationStatus = ctx.renderValidationStatus;
          var dropzone               = ctx.dropzone;
          var statusEl               = dropzone.querySelector('.' + DZ + '__status');

          analyzeLoaded = false;
          analyzeData   = null;
          updateNavButtons();

          function setPending(msg) {
            if (!statusEl) return;
            statusEl.className = DZ + '__status ' + DZ + '__status--pending';
            var preview = el('div', DZ + '__preview');
            var line = el('p', DZ + '__preview-line ' + DZ + '__preview-line--pending');
            var spinner = document.createElement('i');
            spinner.className = 'fas fa-spinner fa-spin';
            spinner.setAttribute('aria-hidden', 'true');
            line.appendChild(spinner);
            line.appendChild(el('span', '', msg));
            preview.appendChild(line);
            statusEl.replaceChildren(preview);
          }

          // Step A: upload
          setPending({{ _("Uploading…")|tojson|safe }});
          var fd = new FormData();
          fd.append('file', file);

          fetch(uploadUrl, { method: 'POST', headers: { 'X-CSRFToken': csrfToken }, body: fd })
            .then(function (r) { return r.json(); })
            .then(function (uploadData) {
              if (!uploadData.success) {
                renderValidationStatus({
                  valid: false,
                  message: uploadData.message || {{ _("Upload failed")|tojson|safe }}
                });
                return;
              }

              // Step B: analyze (polls while the workbook parses in the background)
              setPending({{ _("Analyzing workbook\u2026 this can take a minute on first upload")|tojson|safe }});
              var analyzeDeadline = Date.now() + 5 * 60 * 1000;
              function pollAnalyze() {
                return postJSON(analyzeUrl, {}).then(function (aData) {
                  if (aData && aData.pending) {
                    if (Date.now() > analyzeDeadline) {
                      renderValidationStatus({
                        valid: false,
                        message: {{ _("Workbook analysis timed out. Please try uploading again.")|tojson|safe }}
                      });
                      return;
                    }
                    return new Promise(function (resolve) {
                      setTimeout(function () { resolve(pollAnalyze()); }, 1000);
                    });
                  }
                  if (!aData || !aData.success) {
                    renderValidationStatus({
                      valid: false,
                      message: (aData && aData.message) || {{ _("Analysis failed. Check that the file contains the UPR Data sheet.")|tojson|safe }}
                    });
                    return;
                  }
                  analyzeLoaded = true;
                  analyzeData   = aData;
                  renderValidationStatus({ valid: true, preview: aData });
                });
              }
              return pollAnalyze();
            })
            .catch(function (err) {
              renderValidationStatus({
                valid: false,
                message: err.message || {{ _("Upload failed")|tojson|safe }}
              });
            });
        }
      });
    })
    .catch(function (err) {
      // If the module fails to load, fall back to plain upload so the wizard
      // is not completely broken.
      console.error('Failed to load excel-import-dropzone module:', err);
      var fileInput = document.getElementById('upr_excel_file');
      if (fileInput) {
        fileInput.addEventListener('change', function () {
          var file = fileInput.files[0];
          if (!file) return;
          var fd = new FormData();
          fd.append('file', file);
          btnNext.disabled = true;
          fetch(uploadUrl, { method: 'POST', headers: { 'X-CSRFToken': csrfToken }, body: fd })
            .then(function (r) { return r.json(); })
            .then(function (d) {
              if (!d.success) return;
              return postJSON(analyzeUrl, {}).then(function (a) {
                if (!a.success) return;
                analyzeLoaded = true;
                analyzeData   = a;
                updateNavButtons();
              });
            });
        });
      }
    });

  showStep(1);
});
</script>
