name: Humanitarian Databank
paths:
  - Backoffice
  - Website
paths-ignore:
  - "**/node_modules/**"
  - "**/.next/**"
  - "**/dist/**"
  - "**/build/**"
  - Backoffice/app/static/libs
query-filters:
  # API key fingerprints are SHA-256 over 384-bit random tokens (not passwords).
  # Match both repo-root and package-relative paths CodeQL may emit.
  - exclude:
      id: py/weak-sensitive-data-hashing
      paths:
        - Backoffice/app/models/api_key_management.py
        - app/models/api_key_management.py
        - "**/api_key_management.py"
  # Central JSON helper is a sink; callers must pass stable strings (enforced in code).
  - exclude:
      id: py/stack-trace-exposure
      paths:
        - Backoffice/app/utils/api_responses.py
        - app/utils/api_responses.py
        - "**/api_responses.py"
