<script>
document.addEventListener("DOMContentLoaded", function () {
  const panelsRoot = document.getElementById("pb-language-panels");
  const main = document.getElementById("quarto-document-content");
  if (!panelsRoot) return;

  const panels = Array.from(panelsRoot.querySelectorAll(".pb-lang-panel"));
  if (!panels.length) return;

  // ── Embedded-mode helpers ────────────────────────────────────────────────
  const isEmbedded = window.self !== window.top;
  if (isEmbedded) {
    // Hide the iframe's own scrollbar — the parent page handles all scrolling.
    document.documentElement.classList.add("pb-report-embedded");
    document.documentElement.style.overflow = "hidden";
    document.body.style.overflow = "hidden";
  }

  function postHeightToParent() {
    if (!isEmbedded) return;
    requestAnimationFrame(function () {
      try {
        const h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight);
        window.parent.postMessage({ type: "pb-report-height", height: h }, window.location.origin);
      } catch (e) {}
    });
  }
  // ────────────────────────────────────────────────────────────────────────

  const languages = panels.map((p) => p.dataset.lang).filter(Boolean);
  const storageKey = "pb-report-language";
  const defaultLang = panelsRoot.dataset.default || languages[0];
  // Honour an explicit ?lang= query-string param (e.g. set by the backoffice iframe src).
  const urlLang = new URLSearchParams(window.location.search).get("lang");
  let activeLang = (urlLang && languages.includes(urlLang))
    ? urlLang
    : (localStorage.getItem(storageKey) || defaultLang);
  if (!languages.includes(activeLang)) activeLang = defaultLang;

  const marginSidebar = document.querySelector("#quarto-margin-sidebar");
  const leftNav = document.querySelector("#quarto-sidebar nav");
  const chromeHost = marginSidebar || leftNav;
  const toolbarLangHost = document.getElementById("pb-report-toolbar-language");

  const selector = document.createElement("div");
  selector.className = "pb-language-selector";
  selector.innerHTML =
    '<label for="pb-language-select">Language</label>' +
    '<select id="pb-language-select" aria-label="Report language"></select>';

  if (isEmbedded) {
    selector.classList.add("pb-language-selector--embedded-hidden");
    document.body.appendChild(selector);
  } else if (toolbarLangHost) {
    selector.classList.add("pb-language-selector--toolbar");
    toolbarLangHost.appendChild(selector);
  } else if (chromeHost) {
    chromeHost.insertBefore(selector, chromeHost.firstChild);
  } else {
    panelsRoot.parentElement.insertBefore(selector, panelsRoot);
  }

  const select = selector.querySelector("#pb-language-select");
  languages.forEach((lang) => {
    const opt = document.createElement("option");
    opt.value = lang;
    opt.textContent = lang;
    select.appendChild(opt);
  });
  select.value = activeLang;

  function elementDocumentTop(el) {
    let top = 0;
    let node = el;
    while (node) {
      top += node.offsetTop || 0;
      node = node.offsetParent;
    }
    return top;
  }

  function scrollToReportAnchor(hash) {
    const id = (hash || "").replace(/^#/, "");
    if (!id) return;
    const target = document.getElementById(id);
    if (!target) return;

    if (isEmbedded) {
      const stickyBarH = parseInt(
        getComputedStyle(document.documentElement).getPropertyValue("--pb-sticky-bar-height"),
        10
      ) || 0;
      try {
        window.parent.postMessage(
          {
            type: "pb-report-scroll",
            offset: elementDocumentTop(target),
            padding: stickyBarH + 16,
          },
          window.location.origin
        );
      } catch (e) {}
      return;
    }

    target.scrollIntoView({ behavior: "smooth", block: "start" });
  }

  function bindEmbeddedTocScroll() {
    if (!isEmbedded) return;
    document.addEventListener("click", function (event) {
      const link = event.target.closest(
        "#toc a[href^='#'], #quarto-sidebar a[href^='#'], #quarto-margin-sidebar a[href^='#']"
      );
      if (!link) return;
      const href = link.getAttribute("href");
      if (!href || href === "#") return;
      event.preventDefault();
      scrollToReportAnchor(href);
    });
  }

  bindEmbeddedTocScroll();

  function slug(lang) {
    return lang.toLowerCase().replace(/\s+/g, "-");
  }

  function wordHref(lang) {
    return "pb-report-" + slug(lang) + ".docx";
  }

  function clearAnchors() {
    panels.forEach((panel) => {
      panel.querySelectorAll("[data-anchor]").forEach((el) => el.removeAttribute("id"));
    });
  }

  function applyAnchors(panel) {
    panel.querySelectorAll("[data-anchor]").forEach((el) => {
      el.id = el.dataset.anchor;
    });
  }

  function rebuildToc(panel) {
    const host = leftNav || marginSidebar;
    if (!host) return;

    let toc = host.querySelector("#toc");
    if (!toc) {
      const tocNav = document.createElement("nav");
      tocNav.id = "toc";
      tocNav.setAttribute("role", "doc-toc");
      tocNav.className = "toc-active";
      tocNav.innerHTML =
        '<h2 id="toc-title">Table of contents</h2><ul class="toc-list"></ul>';

      const anchor = host.firstChild;
      if (anchor) {
        host.insertBefore(tocNav, anchor);
      } else {
        host.appendChild(tocNav);
      }
      toc = tocNav;
    }

    const list = toc.querySelector(".toc-list") || toc.querySelector("ul");
    if (!list) return;
    list.innerHTML = "";

    panel.querySelectorAll(".report-part").forEach((partEl) => {
      const h2 = partEl.querySelector("h2[data-anchor]");
      if (!h2) return;

      const partItem = document.createElement("li");
      const partLink = document.createElement("a");
      partLink.href = "#" + h2.dataset.anchor;
      partLink.textContent = h2.textContent.trim();
      partLink.className = "nav-link";
      partLink.dataset.scrollTarget = "#" + h2.dataset.anchor;
      partItem.appendChild(partLink);

      const childList = document.createElement("ul");
      partEl.querySelectorAll(".report-section-title[data-anchor]").forEach((h3) => {
        const childItem = document.createElement("li");
        const childLink = document.createElement("a");
        childLink.href = "#" + h3.dataset.anchor;
        childLink.textContent = h3.textContent.trim();
        childLink.className = "nav-link";
        childLink.dataset.scrollTarget = "#" + h3.dataset.anchor;
        childItem.appendChild(childLink);
        childList.appendChild(childItem);
      });
      if (childList.children.length) partItem.appendChild(childList);
      list.appendChild(partItem);
    });
  }

  function updateWordLink(lang) {
    const href = wordHref(lang);
    const link = document.getElementById("pb-download-word");
    if (link) link.setAttribute("href", href);
  }

  let scrollHeaderBar = document.getElementById("pb-scroll-headers");
  if (!scrollHeaderBar) {
    scrollHeaderBar = document.createElement("div");
    scrollHeaderBar.id = "pb-scroll-headers";
    scrollHeaderBar.innerHTML =
      '<div class="pb-sticky-bar-part"></div>' +
      '<div class="pb-sticky-bar-section"></div>';
    document.body.appendChild(scrollHeaderBar);
  }
  const scrollHeaderPart = scrollHeaderBar.querySelector(".pb-sticky-bar-part");
  const scrollHeaderSection = scrollHeaderBar.querySelector(".pb-sticky-bar-section");

  function updateScrollHeaderOffset() {
    const height = scrollHeaderBar.classList.contains("is-visible")
      ? Math.ceil(scrollHeaderBar.getBoundingClientRect().height)
      : 0;
    document.documentElement.style.setProperty("--pb-sticky-bar-height", height + "px");
  }

  function findActiveSection(panel) {
    const sections = Array.from(panel.querySelectorAll(".report-section"));
    if (!sections.length) return null;

    const anchorY = (scrollHeaderBar.offsetHeight || 96) + 24;
    let best = null;
    let bestOverlap = 0;

    sections.forEach((section) => {
      const rect = section.getBoundingClientRect();
      const overlapTop = Math.max(rect.top, anchorY);
      const overlapBottom = Math.min(rect.bottom, window.innerHeight);
      const overlap = Math.max(0, overlapBottom - overlapTop);
      if (overlap > bestOverlap) {
        bestOverlap = overlap;
        best = section;
      }
    });

    if (best) return best;

    for (let i = sections.length - 1; i >= 0; i -= 1) {
      if (sections[i].getBoundingClientRect().top <= anchorY) {
        return sections[i];
      }
    }

    return sections[0];
  }

  function updateScrollHeaders() {
    const activePanel = panels.find((p) => !p.hidden);
    if (!activePanel || !scrollHeaderPart || !scrollHeaderSection) return;

    const panelsTop = panelsRoot.getBoundingClientRect().top;
    const activeSection = findActiveSection(activePanel);
    if (!activeSection || panelsTop > 8) {
      scrollHeaderBar.classList.remove("is-visible");
      updateScrollHeaderOffset();
      return;
    }

    const partTitle = activeSection
      .closest(".report-part")
      ?.querySelector(".report-part-title");
    const sectionTitle = activeSection.querySelector(".report-section-title");
    if (!partTitle || !sectionTitle) {
      scrollHeaderBar.classList.remove("is-visible");
      updateScrollHeaderOffset();
      return;
    }

    const partTop = partTitle.getBoundingClientRect().top;
    const showBar = partTop <= 0;
    if (!showBar) {
      scrollHeaderBar.classList.remove("is-visible");
      updateScrollHeaderOffset();
      return;
    }

    scrollHeaderPart.textContent = partTitle.textContent.trim();
    scrollHeaderSection.textContent = sectionTitle.textContent.trim();
    scrollHeaderBar.setAttribute("dir", activePanel.dataset.dir || "ltr");
    scrollHeaderBar.classList.add("is-visible");
    updateScrollHeaderOffset();
  }

  function setLanguage(lang) {
    activeLang = lang;
    localStorage.setItem(storageKey, lang);

    clearAnchors();
    panels.forEach((panel) => {
      const show = panel.dataset.lang === lang;
      panel.hidden = !show;
    });

    const activePanel = panels.find((p) => p.dataset.lang === lang);
    if (!activePanel) return;

    applyAnchors(activePanel);
    rebuildToc(activePanel);
    updateWordLink(lang);

    const dir = activePanel.dataset.dir || "ltr";
    if (main) main.setAttribute("dir", dir);
    document.documentElement.setAttribute("lang", slug(lang).slice(0, 2));
    document.documentElement.classList.toggle("pb-report-arabic", lang === "Arabic");

    const meta = document.getElementById("pb-active-language");
    if (meta) meta.textContent = lang;

    document.dispatchEvent(new CustomEvent("pb-language-changed", { detail: { lang } }));

    if (isEmbedded) {
      try {
        window.parent.postMessage({ type: "pb-report-language", lang: lang }, window.location.origin);
      } catch (e) {}
    }

    if (typeof window.updatePbReportToolbarOffset === "function") {
      window.updatePbReportToolbarOffset();
    }

    updateScrollHeaders();
    postHeightToParent();
  }

  window.addEventListener("scroll", updateScrollHeaders, { passive: true });
  window.addEventListener("resize", updateScrollHeaders);

  select.addEventListener("change", function () {
    setLanguage(select.value);
  });

  window.addEventListener("message", function (event) {
    if (event.origin !== window.location.origin) return;
    if (!event.data || event.data.type !== "pb-report-set-language") return;
    const lang = event.data.lang;
    if (!languages.includes(lang) || select.value === lang) return;
    select.value = lang;
    setLanguage(lang);
  });

  setLanguage(activeLang);
  // Post initial height after paint, and again on any resize.
  postHeightToParent();
  if (isEmbedded) {
    window.addEventListener("resize", postHeightToParent);
    if (typeof ResizeObserver !== "undefined") {
      new ResizeObserver(postHeightToParent).observe(document.body);
    }
  }
});
</script>
