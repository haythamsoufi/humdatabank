{# Bulk PNG export — Data Explorer UPR visuals tab. #}
<div id="upr-visuals-admin" class="space-y-5">
    <div class="upr-vis-toolbar">
        <div class="upr-vis-toolbar__assignment">
            <label for="upr-vis-assignment" class="upr-vis-toolbar__label">{{ _('Assignment') }}</label>
            <select id="upr-vis-assignment"
                    class="upr-vis-toolbar__select"
                    title="{{ _('Only Unified Plan (24) and Report (33) assignments are listed.')|forceescape }}">
                <option value="">{{ _('Select an assignment') }}</option>
            </select>
        </div>
        <nav id="upr-vis-mode-tabs" class="upr-vis-toolbar__tabs" role="tablist" aria-label="{{ _('UPR visuals tools') }}">
            <button type="button"
                    role="tab"
                    id="upr-vis-tab-preview"
                    data-upr-mode="preview"
                    aria-selected="true"
                    aria-controls="upr-vis-pane-preview"
                    class="upr-vis-mode-tab is-active">
                <i class="fas fa-eye" aria-hidden="true"></i>{{ _('Preview') }}
            </button>
            <button type="button"
                    role="tab"
                    id="upr-vis-tab-generate"
                    data-upr-mode="generate"
                    aria-selected="false"
                    aria-controls="upr-vis-pane-generate"
                    class="upr-vis-mode-tab">
                <i class="fas fa-images" aria-hidden="true"></i>{{ _('Generate') }}
            </button>
        </nav>
    </div>

    <div id="upr-vis-pane-generate" class="space-y-5" role="tabpanel" aria-labelledby="upr-vis-tab-generate" hidden>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <section class="upr-vis-card" aria-labelledby="upr-vis-dashboards-heading">
                <div class="upr-vis-card__header">
                    <h4 id="upr-vis-dashboards-heading" class="text-sm font-semibold text-gray-900">{{ _('Dashboards') }}</h4>
                    <span id="upr-vis-dash-count" class="text-xs text-gray-500"></span>
                </div>
                <div class="upr-vis-card__toolbar">
                    <div class="upr-vis-card__links">
                        <button type="button" id="upr-vis-dash-select-all" class="upr-vis-link" disabled>{{ _('Select all') }}</button>
                        <span class="text-gray-300" aria-hidden="true">·</span>
                        <button type="button" id="upr-vis-dash-select-none" class="upr-vis-link" disabled>{{ _('Clear') }}</button>
                    </div>
                </div>
                <div id="upr-vis-dashboards" class="upr-vis-card__body upr-vis-dashboards"></div>
            </section>

            <section class="upr-vis-card" aria-labelledby="upr-vis-countries-heading">
                <div class="upr-vis-card__header">
                    <h4 id="upr-vis-countries-heading" class="text-sm font-semibold text-gray-900">{{ _('Countries') }}</h4>
                    <span id="upr-vis-country-count" class="text-xs text-gray-500"></span>
                </div>
                <div class="upr-vis-card__toolbar">
                    <label class="sr-only" for="upr-vis-country-search">{{ _('Search countries') }}</label>
                    <input id="upr-vis-country-search"
                           type="search"
                           class="upr-vis-search"
                           placeholder="{{ _('Search countries') }}"
                           autocomplete="off"
                           disabled>
                    <div class="upr-vis-card__links">
                        <button type="button" id="upr-vis-select-all" class="upr-vis-link" disabled>{{ _('Select all') }}</button>
                        <span class="text-gray-300" aria-hidden="true">·</span>
                        <button type="button" id="upr-vis-select-none" class="upr-vis-link" disabled>{{ _('Clear') }}</button>
                    </div>
                </div>
                <div id="upr-vis-countries" class="upr-vis-card__list"></div>
            </section>
        </div>

        <div class="flex flex-wrap items-center gap-2 pt-1">
            <button type="button" id="upr-vis-generate" class="btn btn-primary btn-sm" disabled>
                <i class="fas fa-play mr-1"></i>{{ _('Generate PNGs') }}
            </button>
            <button type="button" id="upr-vis-cancel" class="btn btn-secondary btn-sm hidden">
                <i class="fas fa-stop mr-1"></i>{{ _('Cancel') }}
            </button>
            <a id="upr-vis-download" class="btn btn-primary btn-sm hidden" href="#">
                <i class="fas fa-download mr-1"></i>{{ _('Download ZIP') }}
            </a>
        </div>

        <div id="upr-vis-progress" class="upr-vis-progress hidden" role="status" aria-live="polite">
            <div class="flex items-start justify-between gap-3">
                <p id="upr-vis-status" class="text-sm text-gray-700 min-w-0"></p>
                <span id="upr-vis-pct" class="text-xs font-medium text-gray-500 tabular-nums shrink-0"></span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2 mt-2 overflow-hidden">
                <div id="upr-vis-progress-bar" class="bg-blue-600 h-2 rounded-full" style="width: 0%"></div>
            </div>
        </div>
    </div>

    <div id="upr-vis-pane-preview" class="upr-vis-preview-pane" role="tabpanel" aria-labelledby="upr-vis-tab-preview">
        <div class="upr-vis-preview__controls">
            <label for="upr-vis-preview-country" class="block text-sm font-medium text-gray-700 mb-1">{{ _('Country') }}</label>
            <select id="upr-vis-preview-country"
                    class="w-full max-w-xl pl-3 pr-8 py-2 border border-gray-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500"
                    disabled>
                <option value="">{{ _('Select a country') }}</option>
            </select>
        </div>
        <div class="upr-visuals-embed__toolbar">
            <div id="upr-vis-preview-tabs" class="upr-visuals-embed__tabs" role="tablist" aria-label="{{ _('Dashboards')|forceescape }}"></div>
            <div class="upr-visuals-download">
                <button type="button" id="upr-vis-preview-download" class="btn btn-icon btn-sm btn-secondary"
                        title="{{ _('Download')|forceescape }}"
                        aria-label="{{ _('Download')|forceescape }}"
                        aria-haspopup="menu"
                        aria-expanded="false"
                        aria-controls="upr-vis-preview-download-menu"
                        disabled>
                    <i class="fas fa-download" aria-hidden="true"></i>
                </button>
                <div id="upr-vis-preview-download-menu" class="upr-visuals-download__menu" role="menu">
                    <button type="button" role="menuitem" data-format="png">{{ _('PNG') }}</button>
                    <button type="button" role="menuitem" data-format="pdf">{{ _('PDF') }}</button>
                </div>
            </div>
        </div>
        <p id="upr-vis-preview-status" class="text-sm text-gray-500"></p>
        <div class="upr-vis-preview__stage">
            <div id="upr-vis-preview-body" class="upr-visual-report__body upr-vis-page"></div>
        </div>
    </div>
</div>
