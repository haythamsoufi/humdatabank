# Backoffice CI
# Runs on pull requests touching Backoffice/**, and on direct pushes to main/develop
# (a direct push skips PR review, so this is the only safety net catching regressions
# for that path — see the 2026-08-07 incident where a same-day push straight to main
# shipped an UnboundLocalError that an existing test would have caught).
# Jobs: fast code guards, Bandit, a cheap pytest-target selector, then pytest
# only for files in the diff (full suite was timing out at GitHub's 6h cap).

name: Backoffice CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'Backoffice/**'
      - '.github/workflows/backoffice-ci.yml'
  push:
    branches: [main, develop]
    paths:
      - 'Backoffice/**'
      - '.github/workflows/backoffice-ci.yml'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:

  # ── Fast code guards ────────────────────────────────────────────────────────
  # Runs in seconds; catches template and JS safety regressions before anything
  # heavier spins up.
  guards:
    name: Code guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Full history required so git diff can compare against base commit.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Block stale flat script paths in app/tests wiring
        working-directory: Backoffice
        run: python scripts/ci/check_script_references.py

      - name: Block one-level-short Backoffice root in scripts
        working-directory: Backoffice
        run: python scripts/ci/check_script_bootstrap.py

      - name: Block __consoleSaved.* in Jinja templates
        run: python Backoffice/scripts/ci/check_no_console_saved_bypass.py

      - name: No inline JS / CSP-risk patterns in diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::No base SHA available (first push to branch?) — skipping diff check"
          else
            python Backoffice/scripts/ci/check_no_inline_js_in_diff.py --base-ref "$BASE"
          fi

      - name: No unsafe gettext embedding in template diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "::warning::No base SHA available (first push to branch?) — skipping gettext embed check"
          else
            python Backoffice/scripts/ci/check_unsafe_gettext_embedding.py --base-ref "$BASE"
          fi

  # ── Bandit static security analysis ────────────────────────────────────────
  bandit:
    name: Bandit (Python security)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit
        run: pip install bandit[toml]

      - name: Run Bandit
        run: |
          # pyproject.toml at repo root holds [tool.bandit] config (exclude_dirs etc.)
          if [ -f pyproject.toml ]; then
            CFG="-c pyproject.toml"
          else
            echo "::warning::pyproject.toml not found — running Bandit without config"
            CFG=""
          fi
          # shellcheck disable=SC2086
          bandit $CFG -r Backoffice/app -ll --exit-zero

  # ── Map the diff to pytest paths (no Postgres, no pip) ──────────────────────
  select_tests:
    name: Select pytest targets
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.select.outputs.skip }}
      mode: ${{ steps.select.outputs.mode }}
      targets: ${{ steps.select.outputs.targets }}
      needs_render_libs: ${{ steps.select.outputs.needs_render_libs }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Select pytest targets
        id: select
        working-directory: Backoffice
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          python scripts/ci/select_pytest_targets.py --base-ref "$BASE" --github-output

  # ── pytest (changed files only; "fast" fallback for shared infra) ───────────
  tests:
    name: pytest
    needs: select_tests
    if: needs.select_tests.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        # pgvector required: tests and migrations use CREATE EXTENSION vector (see conftest.py).
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: Backoffice/requirements.txt

      - name: Install dependencies
        working-directory: Backoffice
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Install P&B render system libraries
        if: needs.select_tests.outputs.needs_render_libs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libffi-dev shared-mime-info

      - name: Translation catalog is current and compiles
        working-directory: Backoffice
        run: python scripts/ci/check_translations_current.py

      - name: Run tests
        working-directory: Backoffice
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
          FLASK_CONFIG: testing
          SECRET_KEY: test-secret-key-for-ci
          WTF_CSRF_ENABLED: 'false'
        run: |
          echo "mode=${{ needs.select_tests.outputs.mode }}"
          echo "reason=${{ needs.select_tests.outputs.reason }}"
          if [ "${{ needs.select_tests.outputs.mode }}" = "fast" ]; then
            pytest -m "not slow" --no-cov -n auto
          else
            pytest --no-cov -n auto ${{ needs.select_tests.outputs.targets }}
          fi

      - name: Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results
          path: Backoffice/test_results.xml
          retention-days: 14
          if-no-files-found: ignore
