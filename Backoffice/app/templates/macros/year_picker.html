{# Compact year stepper: calendar icon, prev/next, direct year entry. #}
{% macro year_picker(input_id, min=2000, max=2100, label=None, label_class='block text-gray-700 text-sm font-semibold mb-2') %}
{% if label %}
<label for="{{ input_id }}" class="{{ label_class }}">{{ label }}</label>
{% endif %}
<div class="year-picker" data-year-picker data-year-min="{{ min }}" data-year-max="{{ max }}">
    <button type="button" class="year-picker-btn" data-year-picker-decrement aria-label="{{ _('Previous year')|forceescape }}">
        <i class="fas fa-chevron-left" aria-hidden="true"></i>
    </button>
    <div class="year-picker-input-wrap">
        <button type="button" class="year-picker-calendar-toggle" data-year-picker-calendar
                aria-label="{{ _('Open year calendar')|forceescape }}" aria-haspopup="listbox" aria-expanded="false">
            <i class="fas fa-calendar-alt" aria-hidden="true"></i>
        </button>
        <input type="text"
               id="{{ input_id }}"
               class="year-picker-input"
               maxlength="4"
               inputmode="numeric"
               pattern="[0-9]{4}"
               autocomplete="off"
               data-year-min="{{ min }}"
               data-year-max="{{ max }}"
               aria-label="{{ label or _('Year')|forceescape }}">
    </div>
    <button type="button" class="year-picker-btn" data-year-picker-increment aria-label="{{ _('Next year')|forceescape }}">
        <i class="fas fa-chevron-right" aria-hidden="true"></i>
    </button>
</div>
{% endmacro %}
