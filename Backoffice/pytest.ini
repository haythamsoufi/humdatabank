[pytest]
# Pytest configuration for Humanitarian Databank Backoffice

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options (coverage is opt-in — use tests\run_tests.bat or --cov=app)
# Pytest 9 progress style (count or progress). conftest.py patches the terminal reporter
# to show both: [782/13047  6%] instead of count-only or %-only.
console_output_style = count
addopts =
    -v
    --capture=sys
    --strict-markers
    --tb=short
    --disable-warnings
    --junitxml=test_results.xml

# Test results are saved to test_results.log automatically via conftest.py hook
# Coverage examples:
#   Full refresh:  coverage erase && pytest --cov=app --cov-report=html:htmlcov --cov-report=xml:coverage.xml
#   Partial merge: pytest <path> --cov=app --cov-append --cov-report=html:htmlcov
#   Fast parallel: pytest -m "not slow" --no-cov -n auto

# Markers for test categorization
markers =
    unit: Unit tests (fast, no database)
    integration: Integration tests (require database)
    api: API endpoint tests
    critical: Critical production route smoke tests
    slow: Slow running tests
    db: Tests that require database connection
    email: Email functionality tests
    static: Static file tests
    transaction: Transaction middleware tests
    auth_security: Tests covering auth routes, authorization service, form/mobile auth utilities, and auth forms

# Coverage options
[coverage:run]
source = app
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */env/*
    */site-packages/*
    */plugins/*
    */scripts/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
