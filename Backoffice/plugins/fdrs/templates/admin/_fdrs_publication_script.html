<script nonce="{{ csp_nonce() }}">
document.addEventListener('DOMContentLoaded', function () {
  var select = document.getElementById('fdrs-assignment-select');
  if (!select) return; // no assignments — nothing to wire up

  var csrfToken = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
  var refreshBtn = document.getElementById('fdrs-pub-refresh');
  var loadingEl = document.getElementById('fdrs-pub-loading');
  var cardsEl = document.getElementById('fdrs-pub-summary-cards');
  var secondaryCountsEl = document.getElementById('fdrs-pub-secondary-counts');
  var allClearEl = document.getElementById('fdrs-pub-all-clear');
  var tbody = document.getElementById('fdrs-pub-tbody');
  var selectVisibleBtn = document.getElementById('fdrs-pub-select-visible');
  var clearSelectionBtn = document.getElementById('fdrs-pub-clear-selection');
  var publishBtn = document.getElementById('fdrs-pub-publish-btn');
  var publishCountEl = document.getElementById('fdrs-pub-publish-count');
  var confirmBox = document.getElementById('fdrs-pub-confirm');
  var confirmText = document.getElementById('fdrs-pub-confirm-text');
  var confirmYesBtn = document.getElementById('fdrs-pub-confirm-yes');
  var confirmNoBtn = document.getElementById('fdrs-pub-confirm-no');
  var resultEl = document.getElementById('fdrs-pub-result');
  var progressEl = document.getElementById('fdrs-pub-progress');
  var progressTitleEl = document.getElementById('fdrs-pub-progress-title');
  var progressStageEl = document.getElementById('fdrs-pub-progress-stage');
  var progressBarEl = document.getElementById('fdrs-pub-progress-bar');
  var progressTextEl = document.getElementById('fdrs-pub-progress-text');
  var progressCountEl = document.getElementById('fdrs-pub-progress-count');
  var progressSpinnerEl = document.getElementById('fdrs-pub-progress-spinner');
  var cancelBtn = document.getElementById('fdrs-pub-cancel-btn');
  var cancelBtnText = document.getElementById('fdrs-pub-cancel-btn-text');
  var queueFiltersEl = document.getElementById('fdrs-pub-queue-filters');
  var searchInput = document.getElementById('fdrs-pub-country-search');
  var listFilterNoteEl = document.getElementById('fdrs-pub-list-filter-note');
  var listViewBtns = document.querySelectorAll('.fdrs-pub-list-view');
  var queueTitleEl = document.getElementById('fdrs-pub-queue-title');
  var tableEl = document.getElementById('fdrs-pub-table');
  var theadEl = document.getElementById('fdrs-pub-thead');
  var actionBar = document.getElementById('fdrs-pub-action-bar');
  var actionSummaryEl = document.getElementById('fdrs-pub-action-summary');
  var actionFlagsEl = document.getElementById('fdrs-pub-action-flags');

  // Built with placeholder id 0, then string-swapped for the real id (avoids
  // relying on url_for accepting non-numeric placeholders for <int:> routes).
  var summaryUrlTpl = {{ url_for('fdrs.publication_summary', assigned_form_id=0) | tojson }};
  var detailUrlTpl  = {{ url_for('fdrs.publication_country_detail', assigned_form_id=0, assignment_entity_status_id=0) | tojson }};
  var publishUrlTpl = {{ url_for('fdrs.publication_publish', assigned_form_id=0) | tojson }};
  var statusUrlTpl  = {{ url_for('fdrs.publication_status', assigned_form_id=0, job_id='__JOB_ID__') | tojson }};
  var cancelUrlTpl  = {{ url_for('fdrs.publication_cancel', assigned_form_id=0, job_id='__JOB_ID__') | tojson }};

  function summaryUrl(id) { return summaryUrlTpl.replace('/0/summary', '/' + id + '/summary'); }
  function detailUrl(id, aesId) {
    return detailUrlTpl.replace('/0/countries/0/detail', '/' + id + '/countries/' + aesId + '/detail');
  }
  function publishUrl(id) { return publishUrlTpl.replace('/0/publish', '/' + id + '/publish'); }
  function statusUrl(id, jobId) {
    return statusUrlTpl.replace('/0/publish/', '/' + id + '/publish/').replace('__JOB_ID__', encodeURIComponent(jobId));
  }
  function cancelUrl(id, jobId) {
    return cancelUrlTpl.replace('/0/publish/', '/' + id + '/publish/').replace('__JOB_ID__', encodeURIComponent(jobId));
  }

  var QUEUE_FILTERS = [
    { id: 'attention', label: 'Needs attention' },
    { id: 'global', label: 'Global impact' },
    { id: 'variation', label: 'Large variation' },
    { id: 'removed', label: 'Values removed' },
    { id: 'all', label: 'All changed' }
  ];

  var currentAssignmentId = null;
  var currentSummary = null;
  var currentCountries = [];
  var currentFlags = [];
  var reviewsByAes = {};
  var flaggedItemByAes = {};
  var selected = new Set();
  var detailCache = {};
  var summaryLoaded = false;
  var queueFilter = 'attention';
  var listMode = 'country';
  var searchQuery = '';
  var openDetailAesId = null;
  var analysisPriorPeriodName = '';
  var summaryRequestId = 0;
  var activeJobId = null;
  var pollTimer = null;
  var pollDelayMs = 1000;
  var lastPercent = 0;
  var cancelRequested = false;
  var POLL_INITIAL_MS = 1000;
  var POLL_MAX_MS = 4000;
  var POLL_BACKOFF = 1.5;

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text != null) node.textContent = text;
    return node;
  }

  function appendText(parent, text) {
    parent.appendChild(document.createTextNode(text == null ? '' : String(text)));
  }

  function setResultMessage(container, className, text, iconClass) {
    if (!container) return;
    container.replaceChildren();
    if (!text && !iconClass) return;
    var p = el('p', className);
    if (iconClass) {
      var icon = document.createElement('i');
      icon.className = iconClass;
      icon.setAttribute('aria-hidden', 'true');
      p.appendChild(icon);
      appendText(p, ' ');
    }
    appendText(p, text);
    container.appendChild(p);
  }

  function setTbodyMessage(message, extraClass) {
    tbody.replaceChildren();
    var tr = document.createElement('tr');
    var td = el('td', 'px-4 py-6 text-center text-sm ' + (extraClass || 'text-gray-500'), message);
    td.colSpan = listMode === 'issue' ? 7 : 6;
    tr.appendChild(td);
    tbody.appendChild(tr);
  }

  function formatDate(iso) {
    try {
      var d = new Date(iso);
      return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }) +
        ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return iso; }
  }

  function formatPct(pct) {
    if (pct === null || pct === undefined || !isFinite(pct)) return '';
    return (pct > 0 ? '+' : '') + Math.round(pct * 100) + '%';
  }

  function formatAnalysisNumber(value) {
    if (value === null || value === undefined || value === '') return '—';
    var n = typeof value === 'number' ? value : Number(String(value).trim().replace(/,/g, ''));
    if (!isFinite(n)) return String(value);
    return n.toLocaleString(undefined, { maximumFractionDigits: 2, useGrouping: true });
  }

  function formatShare(pct) {
    if (pct === null || pct === undefined || !isFinite(pct)) return '';
    return Math.round(Math.abs(pct) * 100) + '%';
  }

  function emptyReview() {
    return {
      flags: [],
      flagCount: 0,
      maxSeverity: null,
      maxGlobalShare: 0,
      hasGlobal: false,
      hasVariation: false,
      hasRemoved: false,
      chips: { global: 0, variation: 0, removed: 0 }
    };
  }

  function reviewFor(aesId) {
    return reviewsByAes[aesId] || emptyReview();
  }

  function reasonGroup(code) {
    if (code === 'global_share' || code === 'global_impact') return 'global';
    if (code === 'cleared') return 'removed';
    if (code === 'large_variation' || code === 'from_zero' || code === 'outlier') return 'variation';
    return null;
  }

  function reasonLabel(reason) {
    var vs = reason.vs === 'prior' ? 'previous period' : 'last published';
    if (reason.code === 'cleared') return 'Will be cleared from the public site';
    if (reason.code === 'from_zero') return 'Was 0 ' + (reason.vs === 'prior' ? 'in the previous period' : 'when last published');
    if (reason.code === 'outlier') return 'Outlier vs other countries';
    if (reason.code === 'global_share') {
      var share = formatShare(reason.share != null ? reason.share : reason.pct);
      return share ? (share + ' of the global total') : 'Large share of the global total';
    }
    if (reason.code === 'global_impact') {
      var impact = formatShare(reason.pct);
      return impact ? ('Change is ' + impact + ' of the global total') : 'Change moves the global total';
    }
    if (reason.code === 'large_variation') {
      var pct = formatPct(reason.pct);
      return (pct ? pct + ' ' : 'Large change ') + 'vs ' + vs;
    }
    return reason.code || 'Review';
  }

  function buildReviews() {
    reviewsByAes = {};
    flaggedItemByAes = {};
    currentFlags.forEach(function (flag) {
      var aesId = flag.assignment_entity_status_id;
      if (aesId == null) return;
      if (!reviewsByAes[aesId]) reviewsByAes[aesId] = emptyReview();
      var review = reviewsByAes[aesId];
      review.flags.push(flag);
      review.flagCount += 1;
      if (flag.severity === 'high') review.maxSeverity = 'high';
      else if (flag.severity === 'medium' && review.maxSeverity !== 'high') review.maxSeverity = 'medium';
      if (!flaggedItemByAes[aesId]) flaggedItemByAes[aesId] = {};
      flaggedItemByAes[aesId][flag.form_item_id] = flag;
      var seen = {};
      (flag.reasons || []).forEach(function (reason) {
        var group = reasonGroup(reason.code);
        if (!group || seen[group]) return;
        seen[group] = true;
        review.chips[group] += 1;
        if (group === 'global') {
          review.hasGlobal = true;
          var share = reason.share != null ? reason.share : reason.pct;
          if (share != null && isFinite(share) && share > review.maxGlobalShare) {
            review.maxGlobalShare = share;
          }
        }
        if (group === 'variation') review.hasVariation = true;
        if (group === 'removed') review.hasRemoved = true;
      });
    });
  }

  function countryMatchesFilter(country) {
    var review = reviewFor(country.assignment_entity_status_id);
    if (queueFilter === 'attention') return review.flagCount > 0;
    if (queueFilter === 'global') return review.hasGlobal;
    if (queueFilter === 'variation') return review.hasVariation;
    if (queueFilter === 'removed') return review.hasRemoved;
    return !!country.has_pending_changes;
  }

  function countryMatchesSearch(country) {
    if (!searchQuery) return true;
    var q = searchQuery.toLowerCase();
    return (country.country_name || '').toLowerCase().indexOf(q) !== -1 ||
      (country.country_iso3 || '').toLowerCase().indexOf(q) !== -1;
  }

  function compareCountries(a, b) {
    var ra = reviewFor(a.assignment_entity_status_id);
    var rb = reviewFor(b.assignment_entity_status_id);
    var sevA = ra.maxSeverity === 'high' ? 2 : (ra.maxSeverity === 'medium' ? 1 : 0);
    var sevB = rb.maxSeverity === 'high' ? 2 : (rb.maxSeverity === 'medium' ? 1 : 0);
    if (sevB !== sevA) return sevB - sevA;
    if (rb.maxGlobalShare !== ra.maxGlobalShare) return rb.maxGlobalShare - ra.maxGlobalShare;
    if (rb.flagCount !== ra.flagCount) return rb.flagCount - ra.flagCount;
    if ((b.pending_count || 0) !== (a.pending_count || 0)) return (b.pending_count || 0) - (a.pending_count || 0);
    return (a.country_name || '').localeCompare(b.country_name || '');
  }

  function visibleCountries() {
    return currentCountries.filter(function (country) {
      return countryMatchesFilter(country) && countryMatchesSearch(country);
    }).sort(compareCountries);
  }

  function flagReasonGroups(flag) {
    var groups = { global: false, variation: false, removed: false };
    (flag.reasons || []).forEach(function (reason) {
      var group = reasonGroup(reason.code);
      if (group) groups[group] = true;
    });
    return groups;
  }

  function flagMatchesFilter(flag) {
    var groups = flagReasonGroups(flag);
    if (queueFilter === 'global') return groups.global;
    if (queueFilter === 'variation') return groups.variation;
    if (queueFilter === 'removed') return groups.removed;
    return true;
  }

  function flagMatchesSearch(flag) {
    if (!searchQuery) return true;
    var q = searchQuery.toLowerCase();
    return (flag.country_name || '').toLowerCase().indexOf(q) !== -1 ||
      (flag.country_iso3 || '').toLowerCase().indexOf(q) !== -1 ||
      (flag.label || '').toLowerCase().indexOf(q) !== -1;
  }

  function compareFlags(a, b) {
    var sevA = a.severity === 'high' ? 2 : (a.severity === 'medium' ? 1 : 0);
    var sevB = b.severity === 'high' ? 2 : (b.severity === 'medium' ? 1 : 0);
    if (sevB !== sevA) return sevB - sevA;
    var shareA = 0;
    var shareB = 0;
    (a.reasons || []).forEach(function (r) {
      if ((r.code === 'global_share' || r.code === 'global_impact') && r.share != null && r.share > shareA) shareA = r.share;
      else if ((r.code === 'global_share' || r.code === 'global_impact') && r.pct != null && r.pct > shareA) shareA = r.pct;
    });
    (b.reasons || []).forEach(function (r) {
      if ((r.code === 'global_share' || r.code === 'global_impact') && r.share != null && r.share > shareB) shareB = r.share;
      else if ((r.code === 'global_share' || r.code === 'global_impact') && r.pct != null && r.pct > shareB) shareB = r.pct;
    });
    if (shareB !== shareA) return shareB - shareA;
    return (a.country_name || '').localeCompare(b.country_name || '') ||
      (a.label || '').localeCompare(b.label || '');
  }

  function visibleFlags() {
    return currentFlags.filter(function (flag) {
      return flagMatchesFilter(flag) && flagMatchesSearch(flag);
    }).sort(compareFlags);
  }

  function visibleAesIds() {
    var ids = [];
    var seen = {};
    if (listMode === 'issue') {
      visibleFlags().forEach(function (flag) {
        var id = parseInt(flag.assignment_entity_status_id, 10);
        if (!id || seen[id]) return;
        seen[id] = true;
        ids.push(id);
      });
      return ids;
    }
    visibleCountries().forEach(function (country) {
      var id = parseInt(country.assignment_entity_status_id, 10);
      if (!id || seen[id]) return;
      seen[id] = true;
      ids.push(id);
    });
    return ids;
  }

  function filterCounts() {
    var counts = { attention: 0, global: 0, variation: 0, removed: 0, all: 0 };
    if (listMode === 'issue') {
      currentFlags.forEach(function (flag) {
        counts.attention += 1;
        counts.all += 1;
        var groups = flagReasonGroups(flag);
        if (groups.global) counts.global += 1;
        if (groups.variation) counts.variation += 1;
        if (groups.removed) counts.removed += 1;
      });
      return counts;
    }
    currentCountries.forEach(function (country) {
      var review = reviewFor(country.assignment_entity_status_id);
      if (review.flagCount > 0) counts.attention += 1;
      if (review.hasGlobal) counts.global += 1;
      if (review.hasVariation) counts.variation += 1;
      if (review.hasRemoved) counts.removed += 1;
      if (country.has_pending_changes) counts.all += 1;
    });
    return counts;
  }

  function selectedFlaggedCountryCount() {
    var n = 0;
    selected.forEach(function (aesId) {
      if (reviewFor(aesId).flagCount > 0) n += 1;
    });
    return n;
  }

  function card(label, value, colorClasses, hint) {
    var wrap = el('div', 'bg-white rounded-lg border border-gray-200 p-4');
    wrap.appendChild(el('p', 'text-xs font-medium text-gray-500 uppercase tracking-wide', label));
    wrap.appendChild(el('p', 'text-2xl font-semibold mt-1 ' + colorClasses, String(value)));
    if (hint) wrap.appendChild(el('p', 'text-xs text-gray-500 mt-1', hint));
    return wrap;
  }

  function renderCards() {
    var data = currentSummary || {};
    var attention = (data.analysis && data.analysis.country_count) || 0;
    var changed = data.countries_with_pending_changes || 0;
    cardsEl.replaceChildren(
      card('Countries changed', changed, changed ? 'text-amber-600' : 'text-gray-900', 'Have pending public updates'),
      card('Need attention', attention, attention ? 'text-red-700' : 'text-gray-900', 'Advisory review flags'),
      card('Selected to publish', selected.size, selected.size ? 'text-blue-700' : 'text-gray-900', 'Filtering does not change this')
    );
    var totals = data.totals || {};
    if (secondaryCountsEl) {
      secondaryCountsEl.textContent = '+' + (totals.new || 0) + ' new  ·  ~' +
        (totals.changed || 0) + ' changed  ·  −' + (totals.removed || 0) + ' removed';
      secondaryCountsEl.classList.toggle('hidden', !summaryLoaded);
    }
  }

  function renderAllClear() {
    if (!allClearEl) return;
    if (!summaryLoaded) {
      allClearEl.classList.add('hidden');
      allClearEl.textContent = '';
      return;
    }
    if (currentFlags.length) {
      allClearEl.classList.add('hidden');
      allClearEl.textContent = '';
      return;
    }
    allClearEl.textContent = 'No large variations, outliers, or major global contributors versus the previous period or last published snapshot.';
    allClearEl.classList.remove('hidden');
  }

  function renderQueueFilters() {
    if (!queueFiltersEl) return;
    var counts = filterCounts();
    queueFiltersEl.replaceChildren();
    QUEUE_FILTERS.forEach(function (spec) {
      var on = queueFilter === spec.id;
      var btn = el(
        'button',
        'fdrs-pub-queue-filter btn text-sm ' + (on ? 'btn-primary' : 'btn-secondary'),
        spec.label + ' (' + counts[spec.id] + ')'
      );
      btn.type = 'button';
      btn.setAttribute('data-queue-filter', spec.id);
      btn.setAttribute('role', 'radio');
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
      btn.disabled = isPublishing();
      btn.addEventListener('click', function () { setQueueFilter(spec.id); });
      queueFiltersEl.appendChild(btn);
    });
  }

  function updateListFilterNote() {
    if (!listFilterNoteEl) return;
    var counts = filterCounts();
    var focusLabel = (QUEUE_FILTERS.find(function (spec) { return spec.id === queueFilter; }) || {}).label || 'All changed';
    var suffix = searchQuery ? ' matching “' + searchQuery + '”' : '';
    if (listMode === 'issue') {
      var flags = visibleFlags();
      var countries = {};
      flags.forEach(function (flag) { countries[flag.assignment_entity_status_id] = true; });
      var countryN = Object.keys(countries).length;
      listFilterNoteEl.textContent = 'Showing ' + flags.length + ' of ' +
        counts[queueFilter] + ' issues across ' + countryN +
        ' countr' + (countryN === 1 ? 'y' : 'ies') + ' · ' + focusLabel + suffix;
      return;
    }
    var visible = visibleCountries();
    listFilterNoteEl.textContent = 'Showing ' + visible.length + ' of ' +
      counts[queueFilter] + ' countries · ' + focusLabel + suffix;
  }

  function renderListViewToggle() {
    listViewBtns.forEach(function (btn) {
      var on = btn.getAttribute('data-list-view') === listMode;
      btn.className = 'fdrs-pub-list-view px-2.5 py-1 text-xs font-medium ' +
        (on ? 'btn-primary' : 'bg-white text-gray-700 hover:bg-gray-50');
      btn.setAttribute('aria-checked', on ? 'true' : 'false');
      btn.disabled = isPublishing();
    });
    if (queueTitleEl) queueTitleEl.textContent = listMode === 'issue' ? 'Issues' : 'Countries';
    if (tableEl) {
      tableEl.setAttribute('aria-label', listMode === 'issue'
        ? 'Flagged issues to review or publish'
        : 'Countries to review or publish');
    }
    if (searchInput) {
      searchInput.placeholder = listMode === 'issue'
        ? 'Search countries or indicators'
        : 'Search countries';
    }
  }

  function setQueueFilter(mode) {
    var valid = QUEUE_FILTERS.some(function (spec) { return spec.id === mode; });
    queueFilter = valid ? mode : 'all';
    renderQueue();
  }

  function setListMode(mode) {
    listMode = mode === 'issue' ? 'issue' : 'country';
    renderQueue();
  }

  var DELTA_TOOLTIP = 'Percentage change versus last published, or the previous period if this value was never published.';

  function deltaHeader(className) {
    var th = el('th', className || 'px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase');
    th.scope = 'col';
    var abbr = document.createElement('abbr');
    abbr.className = 'cursor-help no-underline border-b border-dotted border-gray-400';
    abbr.title = DELTA_TOOLTIP;
    abbr.setAttribute('aria-label', DELTA_TOOLTIP);
    abbr.textContent = 'Δ';
    th.appendChild(abbr);
    return th;
  }

  function renderTableHeaders() {
    if (!theadEl) return;
    var labels = listMode === 'issue'
      ? ['', 'Country', 'Indicator', 'Why', 'Compared to', 'Current', 'Δ']
      : ['', 'Country', 'Review', 'Changes', 'Last published', ''];
    var tr = el('tr', '');
    labels.forEach(function (label, i) {
      var className = (i === labels.length - 1 && listMode === 'country'
        ? 'px-3 py-2 text-right text-xs font-medium text-gray-500 uppercase'
        : 'px-3 py-2 text-left text-xs font-medium text-gray-500 uppercase');
      if (label === 'Δ') {
        tr.appendChild(deltaHeader(className));
        return;
      }
      var th = el('th', className, label);
      th.scope = 'col';
      if (!label) {
        var sr = el('span', 'sr-only', i === 0 ? 'Select' : '');
        th.textContent = '';
        th.appendChild(sr);
      }
      tr.appendChild(th);
    });
    theadEl.replaceChildren(tr);
  }

  function renderQueue() {
    renderListViewToggle();
    renderQueueFilters();
    updateListFilterNote();
    renderTableHeaders();
    renderTable();
    updatePublishButton();
  }

  function reviewChips(review) {
    var wrap = el('div', 'flex flex-wrap gap-1');
    if (!review.flagCount) {
      wrap.appendChild(el('span', 'text-gray-300', '—'));
      return wrap;
    }
    var chipClass = review.maxSeverity === 'high'
      ? 'bg-red-100 text-red-800'
      : 'bg-amber-100 text-amber-800';
    [
      { key: 'global', label: 'Global impact' },
      { key: 'variation', label: 'Large variation' },
      { key: 'removed', label: 'Values removed' }
    ].forEach(function (chip) {
      var n = review.chips[chip.key];
      if (!n) return;
      wrap.appendChild(el(
        'span',
        'inline-flex items-center px-1.5 py-0.5 rounded text-xs font-semibold ' + chipClass,
        chip.label + ' ' + n
      ));
    });
    if (!wrap.childNodes.length) {
      wrap.appendChild(el(
        'span',
        'inline-flex items-center px-1.5 py-0.5 rounded text-xs font-semibold ' + chipClass,
        review.flagCount === 1 ? '1 flag' : (review.flagCount + ' flags')
      ));
    }
    return wrap;
  }

  function changesCell(country) {
    var counts = country.counts || {};
    var wrap = el('div', 'flex flex-wrap gap-1 text-xs');
    if (counts.new) wrap.appendChild(el('span', 'text-green-700 font-semibold', '+' + counts.new));
    if (counts.changed) wrap.appendChild(el('span', 'text-amber-800 font-semibold', '~' + counts.changed));
    if (counts.removed) wrap.appendChild(el('span', 'text-red-700 font-semibold', '−' + counts.removed));
    if (counts.source) wrap.appendChild(el('span', 'text-gray-500', String(counts.source) + ' source'));
    if (!wrap.childNodes.length) wrap.appendChild(el('span', 'text-gray-300', '—'));
    return wrap;
  }

  function renderIssueTable() {
    var flags = visibleFlags();
    if (!flags.length) {
      var empty = 'No issues match this focus.';
      if (!currentFlags.length) {
        empty = 'No flagged issues in this preview. Switch to By country to publish pending countries.';
      } else if (searchQuery) {
        empty = 'No issues match this search.';
      }
      setTbodyMessage(empty);
      return;
    }
    tbody.replaceChildren();
    flags.forEach(function (flag) {
      var aesId = flag.assignment_entity_status_id;
      var tr = el('tr', 'border-b border-gray-100');
      var checkTd = el('td', 'px-3 py-2');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'fdrs-pub-row-checkbox h-4 w-4';
      cb.setAttribute('data-aes-id', String(aesId));
      cb.setAttribute('aria-label', 'Select ' + (flag.country_name || 'country'));
      checkTd.appendChild(cb);
      tr.appendChild(checkTd);

      var nameTd = el('td', 'px-3 py-2 text-sm font-medium text-gray-900');

      (flag.reasons || []).forEach(function (reason) {

        ));

      ));
      var changePct = flag.pct_vs_published != null ? flag.pct_vs_published : flag.pct_vs_prior;
      var changeClass = 'px-3 py-2 text-sm font-semibold ' + (flag.severity === 'high' ? 'text-red-700' : 'text-amber-800');
      tr.appendChild(el('td', changeClass, flag.kind === 'removed' ? 'Cleared' : (formatPct(changePct) || '—')));
      tbody.appendChild(tr);
    });

    tbody.querySelectorAll('.fdrs-pub-row-checkbox').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = parseInt(cb.getAttribute('data-aes-id'), 10);
        if (cb.checked) selected.add(id); else selected.delete(id);
        syncCheckboxesFromSelection();
        updatePublishButton();
      });
    });
    syncCheckboxesFromSelection();
    if (isPublishing()) setPublishControlsDisabled(true);
  }

  function renderTable() {
    if (listMode === 'issue') {
      renderIssueTable();
      return;
    }
    var rows = visibleCountries();
    if (!rows.length) {
      var empty = 'No countries match this focus.';
      if (queueFilter === 'attention' && !currentFlags.length) {
        empty = 'Nothing needs extra attention. Switch to All changed to publish pending countries.';
      } else if (searchQuery) {
        empty = 'No countries match this search.';
      } else if (!currentCountries.length) {
        empty = 'No countries in this assignment.';
      } else if (!currentCountries.some(function (c) { return c.has_pending_changes; })) {
        empty = 'No pending changes in this reporting period.';
      }
      setTbodyMessage(empty);
      return;
    }
    tbody.replaceChildren();
    rows.forEach(function (c) {
      var aesId = c.assignment_entity_status_id;
      var review = reviewFor(aesId);
      var lastPublished = c.published_at
        ? formatDate(c.published_at) + (c.published_by_name ? ' by ' + c.published_by_name : '')
        : 'Never';

      var tr = el('tr', 'border-b border-gray-100');
      var checkTd = el('td', 'px-3 py-2');
      var cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.className = 'fdrs-pub-row-checkbox h-4 w-4';
      cb.setAttribute('data-aes-id', String(aesId));
      cb.setAttribute('aria-label', 'Select ' + (c.country_name || 'country'));
      checkTd.appendChild(cb);
      tr.appendChild(checkTd);

      var nameTd = el('td', 'px-3 py-2 text-sm font-medium text-gray-900');
      appendText(nameTd, c.country_name || '');
      if (c.country_iso3) {
        appendText(nameTd, ' ');
        nameTd.appendChild(el('span', 'text-gray-400', '(' + c.country_iso3 + ')'));
      }
      tr.appendChild(nameTd);

      var reviewTd = el('td', 'px-3 py-2');
      reviewTd.appendChild(reviewChips(review));
      tr.appendChild(reviewTd);

      var changesTd = el('td', 'px-3 py-2');
      changesTd.appendChild(changesCell(c));
      tr.appendChild(changesTd);

      tr.appendChild(el('td', 'px-3 py-2 text-xs text-gray-500', lastPublished));

      var actionTd = el('td', 'px-3 py-2 text-right');
      var viewBtn = el(
        'button',
        'fdrs-pub-view-btn text-xs text-blue-600 hover:underline disabled:text-gray-300 disabled:no-underline',
        review.flagCount ? 'Review' : 'View changes'
      );
      viewBtn.type = 'button';
      viewBtn.setAttribute('data-aes-id', String(aesId));
      viewBtn.setAttribute('aria-expanded', openDetailAesId === aesId ? 'true' : 'false');
      if (!c.total_public_items) viewBtn.disabled = true;
      actionTd.appendChild(viewBtn);
      tr.appendChild(actionTd);

      var detailTr = el('tr', 'fdrs-pub-detail-row' + (openDetailAesId === aesId ? '' : ' hidden'));
      detailTr.setAttribute('data-detail-for', String(aesId));
      var detailTd = el('td', 'px-3 py-3 bg-gray-50');
      detailTd.colSpan = 6;
      detailTd.appendChild(el('div', 'fdrs-pub-detail-body text-sm text-gray-600', 'Loading…'));
      detailTr.appendChild(detailTd);

      tbody.appendChild(tr);
      tbody.appendChild(detailTr);
    });

    tbody.querySelectorAll('.fdrs-pub-row-checkbox').forEach(function (cb) {
      cb.addEventListener('change', function () {
        var id = parseInt(cb.getAttribute('data-aes-id'), 10);
        if (cb.checked) selected.add(id); else selected.delete(id);
        updatePublishButton();
      });
    });
    tbody.querySelectorAll('.fdrs-pub-view-btn').forEach(function (btn) {
      btn.addEventListener('click', function () { toggleDetail(parseInt(btn.getAttribute('data-aes-id'), 10)); });
    });
    syncCheckboxesFromSelection();
    if (openDetailAesId) {
      var openRow = tbody.querySelector('tr.fdrs-pub-detail-row[data-detail-for="' + openDetailAesId + '"]');
      if (openRow) loadDetailInto(openRow, openDetailAesId);
      else openDetailAesId = null;
    }
    if (isPublishing()) setPublishControlsDisabled(true);
  }

  function syncCheckboxesFromSelection() {
    tbody.querySelectorAll('.fdrs-pub-row-checkbox').forEach(function (cb) {
      cb.checked = selected.has(parseInt(cb.getAttribute('data-aes-id'), 10));
    });
  }

  function apiError(data, fallback) {
    if (!data) return fallback;
    return data.error || data.message || fallback;
  }

  function isPublishing() {
    return !!activeJobId;
  }

  function setPublishControlsDisabled(disabled) {
    publishBtn.disabled = disabled || selected.size === 0;
    confirmYesBtn.disabled = disabled;
    select.disabled = disabled;
    refreshBtn.disabled = disabled;
    if (selectVisibleBtn) selectVisibleBtn.disabled = disabled;
    clearSelectionBtn.disabled = disabled;
    if (searchInput) searchInput.disabled = disabled;
    if (queueFiltersEl) {
      queueFiltersEl.querySelectorAll('button').forEach(function (btn) { btn.disabled = disabled; });
    }
    listViewBtns.forEach(function (btn) { btn.disabled = disabled; });
    tbody.querySelectorAll('.fdrs-pub-row-checkbox').forEach(function (cb) {
      cb.disabled = disabled;
    });
  }

  function updatePublishButton() {
    var flaggedSelected = selectedFlaggedCountryCount();
    if (publishCountEl) publishCountEl.textContent = String(selected.size);
    publishBtn.disabled = isPublishing() || selected.size === 0;
    if (!isPublishing()) confirmBox.classList.add('hidden');
    if (actionBar) actionBar.classList.toggle('hidden', !summaryLoaded);
    if (actionSummaryEl) {
      actionSummaryEl.textContent = selected.size
        ? (selected.size + ' countr' + (selected.size === 1 ? 'y' : 'ies') + ' selected')
        : 'No countries selected';
    }
    if (actionFlagsEl) {
      if (!selected.size) {
        actionFlagsEl.textContent = 'Select countries, then publish. Flags are advisory.';
      } else if (flaggedSelected) {
        actionFlagsEl.textContent = flaggedSelected + ' of those have advisory flags.';
      } else {
        actionFlagsEl.textContent = 'None of the selected countries have advisory flags.';
      }
    }
    if (summaryLoaded) renderCards();
  }

  function setProgress(percent, stage, message, current, total, opts) {
    opts = opts || {};
    if (opts.reset) lastPercent = 0;
    var raw = Math.max(0, Math.min(100, Number(percent || 0)));
    var pct = opts.reset ? raw : Math.max(lastPercent, raw);
    lastPercent = pct;
    if (progressBarEl) progressBarEl.style.width = pct + '%';
    if (progressTextEl) progressTextEl.textContent = Math.round(pct) + '%';
    if (progressStageEl) {
      progressStageEl.textContent = (message && String(message).trim()) ? String(message).trim() : (stage || 'Publishing…');
    }
    if (progressTitleEl) {
      progressTitleEl.textContent = cancelRequested ? 'Stopping…' : 'Publishing…';
    }
    if (progressCountEl) {
      if (total !== null && total !== undefined && total !== '' && Number(total) > 0) {
        progressCountEl.textContent = (current || 0) + ' / ' + total + ' countries';
      } else {
        progressCountEl.textContent = '';
      }
    }
  }

  function showProgress() {
    if (progressEl) progressEl.classList.remove('hidden');
    if (progressSpinnerEl) progressSpinnerEl.classList.remove('hidden');
    if (cancelBtn) {
      cancelBtn.disabled = false;
      cancelBtn.classList.remove('hidden');
    }
    if (cancelBtnText) cancelBtnText.textContent = 'Stop publishing';
    confirmBox.classList.add('hidden');
    setPublishControlsDisabled(true);
  }

  function hideProgress() {
    if (progressEl) progressEl.classList.add('hidden');
    if (progressSpinnerEl) progressSpinnerEl.classList.add('hidden');
    cancelRequested = false;
    setPublishControlsDisabled(false);
    updatePublishButton();
  }

  function stopPolling() {
    if (pollTimer) {
      clearTimeout(pollTimer);
      pollTimer = null;
    }
    activeJobId = null;
    pollDelayMs = POLL_INITIAL_MS;
  }

  function schedulePoll() {
    pollTimer = setTimeout(pollStatus, pollDelayMs);
    pollDelayMs = Math.min(Math.round(pollDelayMs * POLL_BACKOFF), POLL_MAX_MS);
  }

  function renderPublishResult(job) {
    var stats = (job && job.stats) || {};
    var t = stats.totals || {};
    var countries = stats.published_countries || 0;
    setResultMessage(
      resultEl,
      'text-green-700 text-sm py-3',
      'Published ' + countries + ' countr' + (countries === 1 ? 'y' : 'ies') + ': +' +
        (t.new || 0) + ' new, ~' + (t.changed || 0) + ' changed, -' + (t.removed || 0) +
        ' removed, ' + (t.source || 0) + ' source.',
      'fas fa-check-circle mr-1'
    );
  }

  function finishJob(job, kind) {
    stopPolling();
    hideProgress();
    if (kind === 'completed') {
      renderPublishResult(job);
      if (currentAssignmentId) loadSummary(currentAssignmentId, { keepResult: true });
      return;
    }
    if (kind === 'cancelled') {
      setResultMessage(resultEl, 'text-amber-800 text-sm py-3', 'Publishing stopped. Already-published countries stay published.');
      if (currentAssignmentId) loadSummary(currentAssignmentId, { keepResult: true });
      return;
    }
    setResultMessage(resultEl, 'text-red-700 text-sm py-3', (job && (job.error || job.message)) || 'Publish failed');
  }

  function pollStatus() {
    if (!activeJobId || !currentAssignmentId) return;
    fetch(statusUrl(currentAssignmentId, activeJobId), { headers: { 'Accept': 'application/json' } })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (result) {
        var data = result.data || {};
        if (!result.ok || !data.success) {
          throw new Error(apiError(data, 'Failed to read publication status'));
        }
        setProgress(data.percent, data.stage, data.message, data.current, data.total);
        if (data.status === 'completed') {
          finishJob(data, 'completed');
          return;
        }
        if (data.status === 'failed') {
          finishJob(data, 'failed');
          return;
        }
        if (data.status === 'cancelled') {
          finishJob(data, 'cancelled');
          return;
        }
        if (data.status === 'cancel_requested') {
          cancelRequested = true;
          if (progressTitleEl) progressTitleEl.textContent = 'Stopping…';
          if (cancelBtn) cancelBtn.disabled = true;
          if (cancelBtnText) cancelBtnText.textContent = 'Stopping…';
        }
        schedulePoll();
      })
      .catch(function (err) {
        stopPolling();
        hideProgress();
        setResultMessage(resultEl, 'text-red-700 text-sm py-3', err.message || 'Failed to read publication status');
      });
  }

  function attachToJob(jobId, assignmentId, opts) {
    opts = opts || {};
    activeJobId = jobId;
    cancelRequested = false;
    pollDelayMs = POLL_INITIAL_MS;
    if (assignmentId && String(select.value) !== String(assignmentId)) {
      select.value = String(assignmentId);
    }
    currentAssignmentId = assignmentId || currentAssignmentId || parseInt(select.value, 10);
    showProgress();
    setProgress(0, 'queued', opts.message || 'Starting…', 0, null, { reset: true });
    resultEl.replaceChildren();
    pollStatus();
  }

  function readActiveJobs() {
    var payload = document.getElementById('fdrs-publication-active-jobs');
    if (!payload) return [];
    try {
      return JSON.parse(payload.textContent || '[]') || [];
    } catch (e) {
      return [];
    }
  }

  function kindBadge(kind) {
    var map = {
      new: 'bg-green-100 text-green-800',
      changed: 'bg-amber-100 text-amber-800',
      removed: 'bg-red-100 text-red-800',
      source: 'bg-blue-50 text-blue-900',
      unchanged: 'bg-gray-100 text-gray-600'
    };
    return el('span', 'inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-semibold ' + (map[kind] || map.unchanged), kind);
  }

  function fmtVal(v, disagg, isImputed) {
    var frag = document.createDocumentFragment();
    if (v === null || v === undefined || String(v).trim() === '') {
      frag.appendChild(el('span', 'text-gray-300', '—'));
      return frag;
    }
    appendText(frag, formatAnalysisNumber(v));
    if (disagg) {
      appendText(frag, ' ');
      var mark = el('span', 'text-gray-400', '\u25A6');
      mark.title = 'Has a disaggregated breakdown';
      frag.appendChild(mark);
    }
    if (isImputed) {
      appendText(frag, ' ');
      var imp = el('span', 'text-amber-800', '(imputed)');
      imp.title = 'Reported value is missing; the imputed value will be published';
      frag.appendChild(imp);
    }
    return frag;
  }

  function comparedToCell(flag, item) {
    if (flag) {
      var published = flag.published_numeric != null ? flag.published_numeric : flag.published_value;
      if (published != null && published !== '') {
        return formatAnalysisNumber(published) + ' last published';
      }
      var prior = flag.prior_numeric != null ? flag.prior_numeric : flag.prior_value;
      if (prior != null && prior !== '') {
        return formatAnalysisNumber(prior) + (analysisPriorPeriodName ? (' in ' + analysisPriorPeriodName) : ' previous period');
      }
    }
    if (item && item.published_value != null && item.published_value !== '') {
      return formatAnalysisNumber(item.published_value) + ' last published';
    }
    return '—';
  }

  function changeCell(flag, item) {
    if (item && item.kind === 'removed') return 'Cleared';
    if (!flag) return '—';
    var changePct = flag.pct_vs_published != null ? flag.pct_vs_published : flag.pct_vs_prior;
    return formatPct(changePct) || '—';
  }

  function renderDetail(row, data) {
    var body = row.querySelector('.fdrs-pub-detail-body');
    var items = (data.items || []).slice();
    if (!items.length) {
      body.replaceChildren(el('span', 'text-gray-500', 'No pending changes for this country.'));
      return;
    }
    var flaggedItems = flaggedItemByAes[data.assignment_entity_status_id] || {};
    items.sort(function (a, b) {
      var fa = flaggedItems[a.form_item_id] ? 0 : 1;
      var fb = flaggedItems[b.form_item_id] ? 0 : 1;
      if (fa !== fb) return fa - fb;
      return (a.label || '').localeCompare(b.label || '');
    });
    var table = el('table', 'w-full text-xs');
    var thead = document.createElement('thead');
    var headRow = el('tr', 'text-left text-gray-500');
    ['Indicator', 'Change', 'Review', 'Compared to', 'Current value', 'Δ'].forEach(function (label) {
      if (label === 'Δ') {
        headRow.appendChild(deltaHeader('py-1 pr-3 text-left font-medium'));
        return;
      }
      headRow.appendChild(el('th', 'py-1 pr-3', label));
    });
    thead.appendChild(headRow);
    var tbodyEl = document.createElement('tbody');
    items.forEach(function (it) {
      var flag = flaggedItems[it.form_item_id];
      var tr = el('tr', 'border-t border-gray-200' + (flag ? ' bg-amber-50' : ''));
      tr.appendChild(el('td', 'py-1 pr-3 text-gray-800', it.label || ''));
      var kindTd = el('td', 'py-1 pr-3');
      kindTd.appendChild(kindBadge(it.kind));
      tr.appendChild(kindTd);
      var whyTd = el('td', 'py-1 pr-3');
      if (flag && flag.reasons && flag.reasons.length) {
        var whyWrap = el('div', 'flex flex-wrap gap-1');
        var sev = flag.severity === 'high' ? 'bg-red-100 text-red-800' : 'bg-amber-100 text-amber-800';
        flag.reasons.forEach(function (reason) {
          whyWrap.appendChild(el('span', 'inline-flex items-center px-1.5 py-0.5 rounded text-[11px] font-semibold ' + sev, reasonLabel(reason)));
        });
        whyTd.appendChild(whyWrap);
      } else {
        whyTd.appendChild(el('span', 'text-gray-300', '—'));
      }
      tr.appendChild(whyTd);
      tr.appendChild(el('td', 'py-1 pr-3 text-gray-600', comparedToCell(flag, it)));
      var currentTd = el('td', 'py-1 pr-3');
      currentTd.appendChild(fmtVal(it.current_value, it.current_disagg_data, it.current_is_imputed));
      tr.appendChild(currentTd);
      var changeClass = 'py-1 pr-3 font-semibold ' + (flag && flag.severity === 'high' ? 'text-red-700' : 'text-gray-800');
      tr.appendChild(el('td', changeClass, changeCell(flag, it)));
      tbodyEl.appendChild(tr);
    });
    table.appendChild(thead);
    table.appendChild(tbodyEl);
    body.replaceChildren(table);
  }

  function loadDetailInto(row, aesId) {
    if (detailCache[aesId]) { renderDetail(row, detailCache[aesId]); return; }
    var body = row.querySelector('.fdrs-pub-detail-body');
    body.textContent = 'Loading…';
    fetch(detailUrl(currentAssignmentId, aesId))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.success) {
          body.replaceChildren(el('span', 'text-red-600', data.message || 'Failed to load'));
          return;
        }
        detailCache[aesId] = data;
        renderDetail(row, data);
      })
      .catch(function (err) {
        body.replaceChildren(el('span', 'text-red-600', err.message || 'Failed to load'));
      });
  }

  function openDetail(aesId) {
    openDetailAesId = aesId;
    tbody.querySelectorAll('tr.fdrs-pub-detail-row').forEach(function (r) { r.classList.add('hidden'); });
    tbody.querySelectorAll('.fdrs-pub-view-btn').forEach(function (btn) {
      btn.setAttribute('aria-expanded', btn.getAttribute('data-aes-id') === String(aesId) ? 'true' : 'false');
    });
    var row = tbody.querySelector('tr.fdrs-pub-detail-row[data-detail-for="' + aesId + '"]');
    if (!row) return;
    row.classList.remove('hidden');
    loadDetailInto(row, aesId);
  }

  function toggleDetail(aesId) {
    if (openDetailAesId === aesId) {
      openDetailAesId = null;
      var row = tbody.querySelector('tr.fdrs-pub-detail-row[data-detail-for="' + aesId + '"]');
      if (row) row.classList.add('hidden');
      var btn = tbody.querySelector('.fdrs-pub-view-btn[data-aes-id="' + aesId + '"]');
      if (btn) btn.setAttribute('aria-expanded', 'false');
      return;
    }
    openDetail(aesId);
  }

  function loadSummary(assignedFormId, opts) {
    opts = opts || {};
    if (isPublishing() && assignedFormId !== currentAssignmentId) return;
    currentAssignmentId = assignedFormId;
    selected = new Set();
    currentFlags = [];
    reviewsByAes = {};
    flaggedItemByAes = {};
    currentSummary = null;
    openDetailAesId = null;
    searchQuery = '';
    if (searchInput) searchInput.value = '';
    detailCache = {};
    loadingEl.classList.remove('hidden');
    if (!opts.keepResult && !isPublishing()) resultEl.replaceChildren();
    confirmBox.classList.add('hidden');
    cardsEl.replaceChildren();
    if (secondaryCountsEl) secondaryCountsEl.classList.add('hidden');
    if (allClearEl) allClearEl.classList.add('hidden');
    if (actionBar) actionBar.classList.add('hidden');
    setTbodyMessage('Loading…');
    var requestId = ++summaryRequestId;

    fetch(summaryUrl(assignedFormId))
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (requestId !== summaryRequestId) return;
        loadingEl.classList.add('hidden');
        summaryLoaded = true;
        if (!data.success) {
          setTbodyMessage(data.message || 'Failed to load preview', 'text-red-600');
          return;
        }
        currentSummary = data;
        currentCountries = data.countries || [];
        currentFlags = (data.analysis && data.analysis.flags) || [];
        analysisPriorPeriodName = (data.analysis && data.analysis.prior_period_name) || '';
        buildReviews();
        queueFilter = currentFlags.length ? 'attention' : 'all';
        renderCards();
        renderAllClear();
        renderQueue();
        if (isPublishing()) setPublishControlsDisabled(true);
      })
      .catch(function (err) {
        if (requestId !== summaryRequestId) return;
        loadingEl.classList.add('hidden');
        setTbodyMessage(err.message || 'Failed to load preview', 'text-red-600');
      });
  }

  function ensureSummaryLoaded() {
    if (summaryLoaded || !select.value) return;
    loadSummary(parseInt(select.value, 10));
  }

  select.addEventListener('change', function () { loadSummary(parseInt(select.value, 10)); });
  refreshBtn.addEventListener('click', function () { if (currentAssignmentId) loadSummary(currentAssignmentId); });

  if (selectVisibleBtn) {
    selectVisibleBtn.addEventListener('click', function () {
      visibleAesIds().forEach(function (id) { selected.add(id); });
      syncCheckboxesFromSelection();
      updatePublishButton();
    });
  }

  listViewBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      setListMode(btn.getAttribute('data-list-view'));
    });
  });

  if (searchInput) {
    searchInput.addEventListener('input', function () {
      searchQuery = (searchInput.value || '').trim();
      renderQueue();
    });
  }

  if (queueFiltersEl) {
    queueFiltersEl.addEventListener('keydown', function (e) {
      if (e.key !== 'ArrowRight' && e.key !== 'ArrowLeft') return;
      var buttons = Array.prototype.slice.call(queueFiltersEl.querySelectorAll('.fdrs-pub-queue-filter'));
      var i = buttons.indexOf(document.activeElement);
      if (i < 0) return;
      e.preventDefault();
      var next = e.key === 'ArrowRight'
        ? (i + 1) % buttons.length
        : (i - 1 + buttons.length) % buttons.length;
      buttons[next].focus();
      buttons[next].click();
    });
  }

  clearSelectionBtn.addEventListener('click', function () {
    selected = new Set();
    syncCheckboxesFromSelection();
    updatePublishButton();
  });

  publishBtn.addEventListener('click', function () {
    if (!selected.size) return;
    var chosen = currentCountries.filter(function (c) { return selected.has(c.assignment_entity_status_id); });
    var newTotal = 0, changedTotal = 0, removedTotal = 0, sourceTotal = 0;
    chosen.forEach(function (c) {
      var counts = c.counts || {};
      newTotal += counts.new || 0;
      changedTotal += counts.changed || 0;
      removedTotal += counts.removed || 0;
      sourceTotal += counts.source || 0;
    });

    confirmText.replaceChildren();
    appendText(confirmText, 'Publish ' + chosen.length + ' countr' + (chosen.length === 1 ? 'y' : 'ies') + ': ');
    confirmText.appendChild(el('strong', '', '+' + newTotal));
    appendText(confirmText, ' new, ');
    confirmText.appendChild(el('strong', '', '~' + changedTotal));
    appendText(confirmText, ' changed');
    if (sourceTotal > 0) {
      appendText(confirmText, ', ');
      confirmText.appendChild(el('strong', '', String(sourceTotal)));
      appendText(confirmText, ' source stamp' + (sourceTotal === 1 ? '' : 's') +
        ' (reported vs imputed; figures stay the same)');
    }
    if (removedTotal > 0) {
      appendText(confirmText, ', and ');
      confirmText.appendChild(el('strong', 'text-red-700', removedTotal + ' value(s) that will be cleared'));
      appendText(confirmText, ' from the public site (previously published, no longer reported)');
    }
    var selectedAes = selected;
    var reviewInSelection = currentFlags.filter(function (f) {
      return selectedAes.has(f.assignment_entity_status_id);
    }).length;
    var flaggedCountries = selectedFlaggedCountryCount();
    appendText(confirmText, '.');
    if (reviewInSelection) {
      appendText(confirmText, ' Includes ');
      confirmText.appendChild(el('strong', 'text-amber-900', String(reviewInSelection)));
      appendText(confirmText, ' flagged variation' + (reviewInSelection === 1 ? '' : 's') +
        ' across ' + flaggedCountries + ' countr' + (flaggedCountries === 1 ? 'y' : 'ies') +
        '. Flags are advisory.');
    }
    confirmBox.classList.remove('hidden');
    confirmBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  });

  confirmNoBtn.addEventListener('click', function () { confirmBox.classList.add('hidden'); });

  confirmYesBtn.addEventListener('click', function () {
    if (!selected.size || isPublishing()) return;
    confirmYesBtn.disabled = true;
    showProgress();
    setProgress(0, 'queued', 'Starting…', 0, null, { reset: true });
    resultEl.replaceChildren();
    fetch(publishUrl(currentAssignmentId), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken, 'Accept': 'application/json' },
      body: JSON.stringify({ assignment_entity_status_ids: Array.from(selected) })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; }); })
      .then(function (result) {
        var data = result.data || {};
        if (result.status === 409 && data.job_id) {
          attachToJob(data.job_id, currentAssignmentId, { message: 'Resuming publication…' });
          return;
        }
        if (!result.ok || !data.success || !data.job_id) {
          throw new Error(apiError(data, 'Publish failed'));
        }
        attachToJob(data.job_id, currentAssignmentId, { message: 'Queued' });
      })
      .catch(function (err) {
        hideProgress();
        setResultMessage(resultEl, 'text-red-700 text-sm py-3', err.message || 'Publish failed');
      });
  });

  if (cancelBtn) {
    cancelBtn.addEventListener('click', function () {
      if (!activeJobId || cancelRequested) return;
      cancelRequested = true;
      cancelBtn.disabled = true;
      if (cancelBtnText) cancelBtnText.textContent = 'Stopping…';
      if (progressTitleEl) progressTitleEl.textContent = 'Stopping…';
      fetch(cancelUrl(currentAssignmentId, activeJobId), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken, 'Accept': 'application/json' }
      })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (result) {
          if (!result.ok || !(result.data && result.data.success)) {
            throw new Error(apiError(result.data, 'Failed to stop publishing'));
          }
        })
        .catch(function (err) {
          cancelRequested = false;
          cancelBtn.disabled = false;
          if (cancelBtnText) cancelBtnText.textContent = 'Stop publishing';
          setResultMessage(resultEl, 'text-red-700 text-sm py-3', err.message || 'Failed to stop publishing');
        });
    });
  }

  function resumeActiveJobIfNeeded() {
    var jobs = readActiveJobs().filter(function (j) { return j && j.job_id; });
    if (!jobs.length) return false;
    var match = jobs[0];
    if (select.value) {
      var current = parseInt(select.value, 10);
      match = jobs.find(function (j) { return parseInt(j.assigned_form_id, 10) === current; }) || jobs[0];
    }
    var assignmentId = parseInt(match.assigned_form_id, 10);
    if (assignmentId && String(select.value) !== String(assignmentId)) {
      select.value = String(assignmentId);
    }
    if (window.AdminUnderlineTabs) {
      window.AdminUnderlineTabs.activateStripTab('#data-sync-tabs', 'publication', { panelSelector: '.data-panel' });
    }
    if ((location.hash || '').replace('#', '') !== 'publication') {
      try { history.replaceState(null, '', '#publication'); } catch (e) { /* ignore */ }
    }
    ensureSummaryLoaded();
    attachToJob(match.job_id, assignmentId, { message: match.message || 'Resuming publication…' });
    return true;
  }

  // Deep-link #publication, or wait until the user opens the tab so we don't
  // fire a summary request while the panel is hidden.
  if (!resumeActiveJobIfNeeded()) {
    if ((location.hash || '').replace('#', '') === 'publication') {
      ensureSummaryLoaded();
    }
  }
  document.querySelectorAll('#data-sync-tabs .settings-tab[data-tab="publication"]').forEach(function (btn) {
    btn.addEventListener('click', function () { ensureSummaryLoaded(); });
  });
});
</script>
