<style nonce="{{ csp_nonce() }}">
.upr-vis-card {
    display: flex;
    flex-direction: column;
    min-height: 16rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    background: #fff;
    overflow: hidden;
}
.upr-vis-card[hidden] {
    display: none;
}
.upr-vis-card__header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #e5e7eb;
    background: #f9fafb;
}
.upr-vis-card__toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.75rem;
    padding: 0.75rem 1rem 0;
}
.upr-vis-card__links {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-left: auto;
}
.upr-vis-search {
    flex: 1 1 10rem;
    min-width: 0;
    padding: 0.35rem 0.6rem;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    font-size: 0.875rem;
}
.upr-vis-search:focus {
    outline: none;
    border-color: var(--btn-primary, #0d9488);
    box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.25);
}
.upr-vis-search:disabled {
    background: #f9fafb;
    color: #9ca3af;
}
.upr-vis-link {
    background: none;
    border: 0;
    padding: 0;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--btn-primary, #0d9488);
    cursor: pointer;
}
.upr-vis-link:hover { text-decoration: underline; }
.upr-vis-link:disabled {
    color: #9ca3af;
    cursor: default;
    text-decoration: none;
}
.upr-vis-card__body,
.upr-vis-card__list {
    flex: 1;
    padding: 0.75rem 1rem 1rem;
}
.upr-vis-card__list {
    max-height: 18rem;
    overflow: auto;
}
.upr-vis-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    min-height: 8rem;
    padding: 1.5rem 0.75rem;
    text-align: center;
    color: #6b7280;
    font-size: 0.875rem;
}
.upr-vis-empty i { font-size: 1.25rem; color: #9ca3af; margin-bottom: 0.15rem; }
.upr-vis-dashboards {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 0.5rem;
}
.upr-vis-dashboards .upr-vis-empty {
    flex: 1 1 100%;
    width: 100%;
}
.upr-vis-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0;
    padding: 0.4rem 0.7rem;
    border: 1px solid #d1d5db;
    border-radius: 9999px;
    background: #fff;
    font-size: 0.8125rem;
    color: #374151;
    cursor: pointer;
}
.upr-vis-chip:hover { border-color: #9ca3af; }
.upr-vis-chip.is-checked,
.upr-vis-chip:has(input:checked) {
    border-color: var(--btn-primary, #0d9488);
    background: #f0fdfa;
    color: #134e4a;
}
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
.upr-vis-chip input {
    margin: 0;
    width: 0.9rem;
    height: 0.9rem;
    accent-color: var(--btn-primary, #0d9488);
}
.upr-vis-command {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 0.75rem 1rem;
}
.upr-vis-command__actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
}
.upr-vis-idml-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.45rem;
    text-align: start;
}
.upr-vis-idml-btn__text {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    line-height: 1.15;
}
.upr-vis-idml-btn__hint {
    font-size: 0.6875rem;
    font-weight: 500;
    color: #6b7280;
}
.upr-vis-table-tools {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.75rem;
}
.upr-vis-format {
    display: inline-flex;
    flex-shrink: 0;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    overflow: hidden;
}
.upr-vis-format button {
    border: 0;
    background: #fff;
    padding: 0.35rem 0.8rem;
    font-size: 0.8125rem;
    font-weight: 600;
    color: #374151;
    cursor: pointer;
}
.upr-vis-format button + button {
    border-inline-start: 1px solid #d1d5db;
}
.upr-vis-format button[aria-pressed="true"] {
    background: #0f766e;
    color: #fff;
}
.upr-vis-format button:disabled {
    opacity: 0.55;
    cursor: default;
}
.upr-vis-full-zip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    text-decoration: none;
}
.upr-vis-full-zip.is-disabled {
    opacity: 0.55;
    pointer-events: none;
}
.upr-vis-table-tools .upr-vis-search {
    flex: 1 1 14rem;
    max-width: 22rem;
}
.upr-vis-table-wrap {
    max-height: 32rem;
    overflow: auto;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    background: #fff;
}
.upr-vis-table {
    width: max-content;
    min-width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 0.875rem;
    color: #111827;
}
.upr-vis-table th,
.upr-vis-table td {
    padding: 0.45rem 0.7rem;
    border-bottom: 1px solid #f3f4f6;
    text-align: center;
    vertical-align: middle;
    background: #fff;
}
.upr-vis-table th {
    position: sticky;
    top: 0;
    z-index: 2;
    background: #f9fafb;
    font-size: 0.75rem;
    font-weight: 600;
    color: #374151;
    border-bottom-color: #e5e7eb;
    vertical-align: bottom;
}
.upr-vis-table .upr-vis-country-cell {
    text-align: start;
    white-space: nowrap;
    min-width: 12rem;
    max-width: none;
}
.upr-vis-table th:first-child {
    width: 2.5rem;
    max-width: none;
}
.upr-vis-table tbody tr:hover td {
    background: #f9fafb;
}
.upr-vis-table input[type="checkbox"] {
    margin: 0;
    width: 1rem;
    height: 1rem;
    accent-color: var(--btn-primary, #0d9488);
}
.upr-vis-table th {
    max-width: 8rem;
    white-space: normal;
    line-height: 1.2;
}
.upr-vis-file {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 0.375rem;
    color: #0f766e;
    text-decoration: none;
}
a.upr-vis-file:hover,
a.upr-vis-file:focus {
    background: #f0fdfa;
    color: #115e59;
}
.upr-vis-file.is-empty {
    color: #d1d5db;
}
.upr-vis-when {
    font-size: 0.75rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
}
.upr-vis-table .upr-vis-empty {
    text-align: center;
}
.upr-vis-bundle-tag {
    margin-inline-start: 0.5rem;
    font-size: 0.75rem;
    font-weight: 600;
    color: #0f766e;
}
.upr-vis-table .upr-vis-iso {
    margin-inline-start: 0.5rem;
    margin-left: 0;
}
.upr-vis-iso {
    margin-left: auto;
    font-size: 0.75rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
}
.upr-vis-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 0.5rem 1.25rem;
    border-bottom: 1px solid #e5e7eb;
}
.upr-vis-toolbar__tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
}
.upr-vis-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1rem;
}
.upr-vis-filters__field {
    flex: 1 1 16rem;
    min-width: 0;
    max-width: 28rem;
}
@media (max-width: 639px) {
    .upr-vis-filters__field {
        flex-basis: 100%;
        max-width: none;
    }
    .upr-vis-card__links {
        margin-left: 0;
    }
    .upr-vis-card__header {
        flex-wrap: wrap;
    }
}
.upr-vis-filters__field[hidden] {
    display: none;
}
.upr-vis-mode-tab {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: #4b5563;
    cursor: pointer;
}
.upr-vis-mode-tab i {
    font-size: 0.8125rem;
}
.upr-vis-mode-tab:hover {
    color: #111827;
    border-bottom-color: #d1d5db;
}
.upr-vis-mode-tab.is-active {
    color: #0f766e;
    border-bottom-color: #0d9488;
}
.upr-vis-preview-pane {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}
.upr-vis-preview-pane[hidden] {
    display: none;
}
.upr-vis-generate-actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem;
    padding-top: 0.25rem;
}
.upr-vis-narrative-check {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0;
    padding: 0.15rem 0;
    font-size: 0.8125rem;
    color: #374151;
    cursor: pointer;
    white-space: normal;
}
.upr-vis-narrative-check[hidden] {
    display: none;
}
.upr-vis-narrative-check input {
    margin: 0;
    width: 0.9rem;
    height: 0.9rem;
    accent-color: var(--btn-primary, #0d9488);
}
.upr-vis-narrative-files {
    max-width: 40rem;
}
.upr-vis-narrative-files[hidden] {
    display: none;
}
.upr-vis-generate-split {
    position: relative;
}
.upr-vis-generate-split > #upr-vis-format-toggle {
    padding-left: 0.5rem;
    padding-right: 0.5rem;
}
.upr-vis-generate-split.is-open > #upr-vis-format-toggle i {
    transform: rotate(180deg);
}
.upr-vis-generate-menu {
    display: none;
    position: absolute;
    inset-inline-start: 0;
    top: calc(100% + 0.25rem);
    min-width: max(100%, 10rem);
    padding: 0.25rem;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 0.35rem;
    box-shadow: 0 4px 12px rgba(1, 30, 65, 0.12);
    z-index: 30;
}
.upr-vis-generate-split.is-open .upr-vis-generate-menu {
    display: block;
}
.upr-vis-generate-menu button {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    width: 100%;
    text-align: start;
    border: none;
    background: transparent;
    color: #374151;
    font-size: 0.8rem;
    line-height: 1.25;
    padding: 0.4rem 0.6rem;
    border-radius: 0.25rem;
    cursor: pointer;
}
.upr-vis-generate-menu button i {
    margin-inline-start: auto;
    visibility: hidden;
    font-size: 0.7rem;
    color: #0f766e;
}
.upr-vis-generate-menu button:hover,
.upr-vis-generate-menu button:focus {
    background: #f3f4f6;
    color: #011e41;
}
.upr-vis-generate-menu button[aria-checked="true"] {
    background: #f0fdfa;
    color: #134e4a;
    font-weight: 600;
}
.upr-vis-generate-menu button[aria-checked="true"] i {
    visibility: visible;
}
</style>
<link rel="stylesheet" href="{{ upr_static_url('css/upr.css') }}">
<link rel="stylesheet" href="{{ url_for('upr.fonts_css', v=upr_asset_v()) }}">

<div id="panel-upr"

            {% include "plugins/upr/upr/_manage_tools.html" %}
        </div>
    {% else %}
        <div class="rounded-lg border border-gray-200 bg-gray-50 px-4 py-8 text-center text-sm text-gray-600">
            <i class="fas fa-lock text-gray-400 mb-2" aria-hidden="true"></i>
            <p>{{ _('Bulk export is available to system managers.') }}</p>
        </div>
    {% endif %}
</div>
