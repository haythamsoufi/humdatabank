# Gitleaks configuration (see https://github.com/gitleaks/gitleaks)
title = "Humanitarian Databank"

[extend]
useDefault = true

[allowlist]
description = "Env templates, public embed data, and known false positives"
paths = [
    '''Backoffice/env.example''',
    # Synced Website data: public Tableau/Power BI embed URLs (not credentials).
    '''Website/data/embed_content\.json''',
]
regexes = [
    # Power BI publish-to-web / view links use base64 ?r= tokens that match grafana-api-key.
    '''app\.powerbi\.com/view\?r=''',
]
