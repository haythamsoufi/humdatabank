<div class="plugin-field-builder">
  <h4 class="text-md font-semibold mb-3">NSD Add-rows list</h4>
  <div class="plugin-option-to-properties mb-3">
    <label class="block text-sm font-medium text-gray-700 mb-1">Add button text</label>
    <input type="text" name="add_label" value="{{ config.get('add_label', 'Add') }}" class="shadow-sm block w-full text-sm border-gray-300 rounded-md">
  </div>
  <div class="plugin-option-to-properties">
    <label class="block text-sm font-medium text-gray-700 mb-1">Columns (JSON)</label>
    <textarea name="columns" rows="6" class="shadow-sm block w-full text-sm border-gray-300 rounded-md font-mono">{{ (config.get('columns') or [{'key': 'name', 'label': 'Name', 'type': 'text'}]) | tojson }}</textarea>
    <p class="text-xs text-gray-500 mt-1">Each column: key, label, type ("text" or "select"), options (for select), placeholder.</p>
  </div>
</div>
