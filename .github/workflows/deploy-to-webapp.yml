# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# Manual entry point. Build and deploy steps live in deploy-to-webapp-target.yml
# so this file can call that workflow once per environment. Calling this file
# from itself exceeds GitHub's reusable-workflow depth limit.

name: Deploy to Webapp

# Shown in the Actions run list instead of the default "Manually run by …" title.
# Manual runs: title uses environment and release label. Release runs use the published tag.
run-name: >-
  ${{ github.event_name == 'release'
    && format('Auto-deploy to Staging — {0}', github.event.release.tag_name)
    || format('Deploy to Webapp — {0} ({1})', inputs.environment == 'Both' && 'Staging + Production' || inputs.environment, inputs.release_label) }}

on:
  # Release auto-deploy to Staging is disabled — use workflow_dispatch to deploy.
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment. Both runs Staging and Production in parallel (separate image tags, secrets, and deploy targets).'
        required: true
        type: choice
        options:
          - Staging
          - Production
          - Both
      release_label:
        description: 'Release label stamped in the app (APP_VERSION fallback, e.g. v1.7). Not the ACR image tag — that is staging or production per environment.'
        required: true
        default: 'v1.7'
        type: string
      restart_after_deploy:
        description: 'Restart the web app after deploy so it pulls the new image'
        required: false
        default: true
        type: boolean

jobs:
  # One full build → deploy per environment. "Both" starts Staging and Production
  # together. Each flow keeps its own GitHub environment (secrets and approvals)
  # and ACR tag (staging|production). fail-fast is off so one failure does not
  # cancel the other.
  deploy_environment:
    name: ${{ matrix.environment }}
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ fromJSON(github.event_name == 'release' && '["Staging"]' || inputs.environment == 'Both' && '["Staging","Production"]' || inputs.environment == 'Production' && '["Production"]' || '["Staging"]') }}
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-to-webapp-target.yml
    secrets: inherit
    with:
      environment: ${{ matrix.environment }}
      release_label: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_label }}
      restart_after_deploy: ${{ github.event_name == 'release' && true || inputs.restart_after_deploy }}
