<style nonce="{{ csp_nonce() }}">
.upr-vis-card {
    display: flex;
    flex-direction: column;
    min-height: 16rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    background: #fff;
    overflow: hidden;
}
.upr-vis-card__header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem;
    padding: 0.75rem 1rem;
    border-bottom: 1px solid #e5e7eb;
    background: #f9fafb;
}
.upr-vis-card__toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.5rem 0.75rem;
    padding: 0.75rem 1rem 0;
}
.upr-vis-card__links {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin-left: auto;
}
.upr-vis-search {
    flex: 1 1 10rem;
    min-width: 0;
    padding: 0.35rem 0.6rem;
    border: 1px solid #d1d5db;
    border-radius: 0.375rem;
    font-size: 0.875rem;
}
.upr-vis-search:focus {
    outline: none;
    border-color: var(--btn-primary, #0d9488);
    box-shadow: 0 0 0 2px rgba(13, 148, 136, 0.25);
}
.upr-vis-search:disabled {
    background: #f9fafb;
    color: #9ca3af;
}
.upr-vis-link {
    background: none;
    border: 0;
    padding: 0;
    font-size: 0.75rem;
    font-weight: 600;
    color: var(--btn-primary, #0d9488);
    cursor: pointer;
}
.upr-vis-link:hover { text-decoration: underline; }
.upr-vis-link:disabled {
    color: #9ca3af;
    cursor: default;
    text-decoration: none;
}
.upr-vis-card__body,
.upr-vis-card__list {
    flex: 1;
    padding: 0.75rem 1rem 1rem;
}
.upr-vis-card__list {
    max-height: 18rem;
    overflow: auto;
}
.upr-vis-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.35rem;
    min-height: 8rem;
    padding: 1.5rem 0.75rem;
    text-align: center;
    color: #6b7280;
    font-size: 0.875rem;
}
.upr-vis-empty i { font-size: 1.25rem; color: #9ca3af; margin-bottom: 0.15rem; }
.upr-vis-dashboards {
    display: flex;
    flex-wrap: wrap;
    align-content: flex-start;
    gap: 0.5rem;
}
.upr-vis-dashboards .upr-vis-empty {
    flex: 1 1 100%;
    width: 100%;
}
.upr-vis-chip {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0;
    padding: 0.4rem 0.7rem;
    border: 1px solid #d1d5db;
    border-radius: 9999px;
    background: #fff;
    font-size: 0.8125rem;
    color: #374151;
    cursor: pointer;
}
.upr-vis-chip:hover { border-color: #9ca3af; }
.upr-vis-chip.is-checked,
.upr-vis-chip:has(input:checked) {
    border-color: var(--btn-primary, #0d9488);
    background: #f0fdfa;
    color: #134e4a;
}
.sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}
.upr-vis-chip input {
    margin: 0;
    width: 0.9rem;
    height: 0.9rem;
    accent-color: var(--btn-primary, #0d9488);
}
.upr-vis-country {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    margin: 0;
    padding: 0.35rem 0.4rem;
    border-radius: 0.375rem;
    font-size: 0.875rem;
    color: #111827;
    cursor: pointer;
}
.upr-vis-country:hover { background: #f3f4f6; }
.upr-vis-country input {
    margin: 0;
    width: 1rem;
    height: 1rem;
    accent-color: var(--btn-primary, #0d9488);
    flex-shrink: 0;
}
.upr-vis-iso {
    margin-left: auto;
    font-size: 0.75rem;
    color: #6b7280;
    font-variant-numeric: tabular-nums;
}
.upr-vis-progress {
    max-width: 40rem;
    padding: 0.85rem 1rem;
    border: 1px solid #e5e7eb;
    border-radius: 0.5rem;
    background: #f9fafb;
}
.upr-vis-progress.is-success { border-color: #bbf7d0; background: #f0fdf4; }
.upr-vis-progress.is-error { border-color: #fecaca; background: #fef2f2; }
.upr-vis-progress.is-warn { border-color: #fde68a; background: #fffbeb; }
.upr-vis-toolbar {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    justify-content: flex-start;
    gap: 0.5rem 1.25rem;
    border-bottom: 1px solid #e5e7eb;
}
.upr-vis-toolbar__tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
}
.upr-vis-filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: 1rem;
}
.upr-vis-filters__field {
    flex: 1 1 16rem;
    min-width: 12rem;
    max-width: 28rem;
}
.upr-vis-filters__field[hidden] {
    display: none;
}
.upr-vis-mode-tab {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
    font-weight: 500;
    border: 0;
    border-bottom: 2px solid transparent;
    background: transparent;
    color: #4b5563;
    cursor: pointer;
}
.upr-vis-mode-tab i {
    font-size: 0.8125rem;
}
.upr-vis-mode-tab:hover {
    color: #111827;
    border-bottom-color: #d1d5db;
}
.upr-vis-mode-tab.is-active {
    color: #0f766e;
    border-bottom-color: #0d9488;
}
.upr-vis-preview-pane {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
}
.upr-vis-preview-pane[hidden] {
    display: none;
}
</style>
<link rel="stylesheet" href="{{ url_for('upr_visuals.static_file', filename='css/upr-visuals.css') }}">

<div id="panel-upr-visuals"
     class="explore-panel{% if explore_first_tab != 'upr-visuals' %} hidden{% endif %}"
     role="tabpanel"
     aria-labelledby="tab-upr-visuals">
    {% if can_manage_upr_visuals %}
        <div class="-mt-4 sm:-mt-6">
            {% include "plugins/upr_visuals/upr_visuals/_manage_tools.html" %}
        </div>
    {% else %}
        <div class="rounded-lg border border-gray-200 bg-gray-50 px-4 py-8 text-center text-sm text-gray-600">
            <i class="fas fa-lock text-gray-400 mb-2" aria-hidden="true"></i>
            <p>{{ _('Bulk PNG generation is available to system managers.') }}</p>
        </div>
    {% endif %}
</div>
{% if can_manage_upr_visuals %}

window.UprVisualsAdminConfig = {

        loadingAssignments: {{ _('Loading assignments…')|tojson }},
        loadingCountries: {{ _('Loading countries…')|tojson }},
        noAssignments: {{ _('No Unified Plan or Report assignments found.')|tojson }},
        noCountries: {{ _('This assignment has no countries.')|tojson }},
        noDashboards: {{ _('No dashboards available for this assignment.')|tojson }},
        loadFailed: {{ _('Could not load data. Refresh the page and try again.')|tojson }},
        needAssignment: {{ _('Select an assignment.')|tojson }},
        needDashboards: {{ _('Select at least one dashboard.')|tojson }},
        needCountries: {{ _('Select at least one country.')|tojson }},
        startFailed: {{ _('Could not start export.')|tojson }},
        selectedCount: {{ _('{selected} of {total} selected')|tojson }},
        generating: {{ _('Generating PNGs…')|tojson }},
        queued: {{ _('Queued')|tojson }},
        rendering: {{ _('Rendering…')|tojson }},

        failed: {{ _('Export failed.')|tojson }},
        cancelled: {{ _('Export cancelled.')|tojson }},
        unnamedAssignment: {{ _('Assignment {id}')|tojson }},
        selectCountry: {{ _('Select a country')|tojson }},
        previewNeedAssignment: {{ _('Select an assignment to preview a country visual.')|tojson }},
        previewNeedCountry: {{ _('Select a country to preview.')|tojson }},

    }
};
</script>
<script nonce="{{ csp_nonce() }}" src="{{ url_for('upr_visuals.static_file', filename='js/upr-visuals-shared.js') }}"></script>
<script nonce="{{ csp_nonce() }}" src="{{ url_for('upr_visuals.static_file', filename='js/upr-visuals-download.js') }}"></script>
<script nonce="{{ csp_nonce() }}" src="{{ url_for('upr_visuals.static_file', filename='js/upr-visuals-admin.js') }}"></script>
{% endif %}
