<script nonce="{{ csp_nonce() }}">
document.addEventListener('DOMContentLoaded', function () {
    const syncRoot = document.getElementById('fdrs-sync-root');
    if (!syncRoot) return;

    let currentTemplateId = {{ template.id }};
    const TEMPLATE_API_URLS = {
        runDataSync: {{ url_for("fdrs.run_data_sync", template_id=0) | tojson }},
        dataSyncStatus: {{ url_for("fdrs.data_sync_status", template_id=0, job_id="__JOB_ID__") | tojson }},
        dataSyncCancel: {{ url_for("fdrs.data_sync_cancel", template_id=0, job_id="__JOB_ID__") | tojson }},
        runSyncVerify: {{ url_for("fdrs.run_sync_verify", template_id=0) | tojson }},
        syncVerifyStatus: {{ url_for("fdrs.sync_verify_status", template_id=0, job_id="__JOB_ID__") | tojson }},
        syncVerifyCancel: {{ url_for("fdrs.sync_verify_cancel", template_id=0, job_id="__JOB_ID__") | tojson }},
        syncVerifyResults: {{ url_for("fdrs.sync_verify_results", template_id=0, job_id="__JOB_ID__") | tojson }},
        syncVerifyLatest: {{ url_for("fdrs.sync_verify_latest", template_id=0) | tojson }},
        syncVerifyLatestResults: {{ url_for("fdrs.sync_verify_latest_results", template_id=0) | tojson }}
    };

    function templateApiUrl(pathTemplate, templateId) {
        return pathTemplate.replace(/\/0(\/|$|\?|(?=\/))/, '/' + encodeURIComponent(templateId) + '$1');
    }

    function escapeHtmlAttr(value) {
        if (window.escapeHtmlAttr) return window.escapeHtmlAttr(value);
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function prependFaIcon(btn, className) {
        if (!btn) return;
        const icon = document.createElement('i');
        icon.className = className;
        icon.setAttribute('aria-hidden', 'true');
        btn.insertBefore(icon, btn.firstChild);
    }

    function renderStatCards(container, items) {
        if (!container) return;
        container.replaceChildren();
        items.forEach(function (item) {
            const wrap = document.createElement('div');
            wrap.className = 'border rounded-md px-3 py-2 ' + item.cls;
            const label = document.createElement('div');
            label.className = 'text-xs uppercase tracking-wide font-medium';
            label.textContent = item.label;
            const value = document.createElement('div');
            value.className = 'text-lg font-semibold';
            value.textContent = String(item.value);
            wrap.append(label, value);
            container.appendChild(wrap);
        });
    }

    function renderConfigSummaryRows(container, rows) {
        if (!container) return;
        container.replaceChildren();
        rows.forEach(function (row) {
            const wrap = document.createElement('div');
            wrap.className = row.inline ? 'flex items-center gap-2' : 'flex items-start justify-between gap-4';
            const label = document.createElement('span');
            label.className = row.inline ? 'text-gray-500' : 'text-gray-500 shrink-0';
            label.textContent = row.label;
            wrap.appendChild(label);
            if (row.node) {
                wrap.appendChild(row.node);
            } else {
                const value = document.createElement('span');
                value.className = 'font-medium text-gray-900 text-right';
                value.textContent = row.value == null ? '' : String(row.value);
                wrap.appendChild(value);
            }
            container.appendChild(wrap);
        });
    }

    function appendMultilineText(parent, text) {
        String(text == null ? '' : text).split('\n').forEach(function (part, i) {
            if (i) parent.appendChild(document.createElement('br'));
            parent.appendChild(document.createTextNode(part));
        });
    }

    function appendTextLink(parent, href, text, className, attrs) {
        const a = document.createElement('a');
        a.className = className || 'text-purple-700 underline';
        a.textContent = text;
        a.setAttribute('href', href);
        if (attrs) {
            Object.keys(attrs).forEach(function (key) {
                a.setAttribute(key, attrs[key]);
            });
        }
        parent.appendChild(a);
        return a;
    }

    function activateSyncMainTab() {
        if (window.AdminUnderlineTabs) {
            window.AdminUnderlineTabs.activateStripTab('#data-sync-tabs', 'sync', { panelSelector: '.data-panel' });
        }
        if ((location.hash || '').replace('#', '') !== 'sync') {
            history.replaceState(null, '', '#sync');
        }
    }

    function showInlineFormError(el, message) {
        if (!el) return;
        if (!message) {
            el.classList.add('hidden');
            el.textContent = '';
            return;
        }
        el.textContent = message;
        el.classList.remove('hidden');
    }

    function makeConfigModal(selector, closeYears) {
        if (!window.ModalUtils || typeof window.ModalUtils.makeModal !== 'function') {
            return {
                openModal: function () {},
                closeModal: function () {},
                isOpen: function () { return false; }
            };
        }
        return window.ModalUtils.makeModal(selector, {
            onOpen: function () {
                if (typeof closeYears === 'function') closeYears(false);
            }
        });
    }

    let syncVerifyResultsUrl = null;
    let syncVerifyTableState = { sheet: 'data_points', page: 1 };
    let syncVerifyGridHelper = null;
    let pendingVerifyGrid = null;
    let syncVerifyFetchSeq = 0;
    let syncVerifySearchTimer = null;
    const SYNC_VERIFY_PAGE_SIZE = 500;

    function formatFdrsLastRunDate(iso) {
        if (!iso) return '';
        const parsed = new Date(iso);
        if (isNaN(parsed.getTime())) return String(iso);
        return parsed.toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
    }

    function renderSyncVerifyLastRun(meta) {
        const banner = document.getElementById('sync-verify-last-run');
        if (!banner || !meta || !meta.exists && !meta.completed_at && !meta.stats) {
            if (banner && !(meta && (meta.completed_at || meta.stats))) banner.classList.add('hidden');
            return;
        }
        banner.classList.remove('hidden');
        const dateEl = document.getElementById('sync-verify-last-run-date');
        if (dateEl && meta.completed_at) {
            dateEl.textContent = ' · ' + formatFdrsLastRunDate(meta.completed_at);
        }
        const statsEl = document.getElementById('sync-verify-last-run-stats');
        if (statsEl && meta.stats) {
            statsEl.textContent = formatSyncVerifyStats(meta.stats);
        }
        const dl = document.getElementById('sync-verify-last-run-download');
        if (dl && meta.download_url && isSafeHref(meta.download_url)) {
            dl.classList.remove('hidden');
            dl.setAttribute('href', meta.download_url);
        }
    }

    function showVerifyGridError(message) {
        const err = document.getElementById('sync-verify-grid-error');
        if (!err) return;
        if (!message) {
            err.classList.add('hidden');
            err.textContent = '';
            return;
        }
        err.textContent = message;
        err.classList.remove('hidden');
    }

    function showVerifyGridNote(message) {
        const note = document.getElementById('sync-verify-grid-note');
        if (!note) return;
        if (!message) {
            note.classList.add('hidden');
            note.textContent = '';
            return;
        }
        note.textContent = message;
        note.classList.remove('hidden');
    }

    function verifyCoverageNote(data) {
        data = data || {};
        const loaded = (data.rows || []).length;
        const filtered = Number(data.filtered_rows || 0);
        const stats = data.stats || {};
        if (data.truncated && filtered > loaded) {
            return {{ _("Showing")|tojson|safe }} + ' ' + loaded + ' / ' + filtered + ' '
                + {{ _("rows. The rest are not in this table, and search only covers loaded rows. Use “Missing and mismatch only” to load problem rows.")|tojson|safe }};
        }
        const problemsOnlyFile = !!(stats.problems_only);
        const problemsBox = document.getElementById('sync-verify-problems-only');
        const viewingProblems = !!(problemsBox && problemsBox.checked);
        if (!viewingProblems && problemsOnlyFile && (data.sheet || '') === 'data_points' && Number(stats.total || 0) > filtered) {
            return {{ _("This saved workbook only contains missing and mismatch rows. Run verification again to store the full comparison.")|tojson|safe }};
        }
        return '';
    }

    function setVerifyGridLoading(on) {
        const el = document.getElementById('syncVerifyGrid-loading');
        if (!el) return;
        if (window.AgGridHelper && typeof AgGridHelper.showGridLoadingOverlay === 'function') {
            if (on) AgGridHelper.showGridLoadingOverlay(el);
            else AgGridHelper.hideGridLoadingOverlay(el);
            return;
        }
        el.style.display = on ? 'flex' : 'none';
    }

    function resetSyncVerifyTable() {
        syncVerifyResultsUrl = null;
        syncVerifyTableState = { sheet: 'data_points', page: 1 };
        const cards = document.getElementById('sync-verify-stats-cards');
        if (cards) cards.replaceChildren();
        const search = document.getElementById('sync-verify-search');
        if (search) search.value = '';
        showVerifyGridError('');
        showVerifyGridNote('');
        pendingVerifyGrid = null;
        const pager = document.getElementById('sync-verify-pager');
        if (pager) pager.classList.add('hidden');
        if (syncVerifyGridHelper) syncVerifyGridHelper.setRowData([]);
    }

    function statusBadgeClass(status) {
        const s = String(status || '').toLowerCase();
        if (s === 'matched') return 'bg-green-50 text-green-800';
        if (s === 'missing') return 'bg-red-50 text-red-800';
        if (s === 'mismatch') return 'bg-amber-50 text-amber-800';
        if (s.indexOf('skip') === 0) return 'bg-gray-100 text-gray-700';
        return 'bg-gray-50 text-gray-700';
    }

    function renderSyncVerifyStats(stats) {
        const cards = document.getElementById('sync-verify-stats-cards');
        if (!cards) return;
        stats = stats || {};
        const items = [
            { label: {{ _("Matched")|tojson|safe }}, value: stats.matched || 0, cls: 'border-green-200 bg-green-50 text-green-800' },
            { label: {{ _("Skipped")|tojson|safe }}, value: stats.skipped_intentionally || 0, cls: 'border-gray-200 bg-gray-50 text-gray-700' },
            { label: {{ _("Missing")|tojson|safe }}, value: stats.missing || 0, cls: 'border-red-200 bg-red-50 text-red-800' },
            { label: {{ _("Mismatch")|tojson|safe }}, value: stats.mismatch || 0, cls: 'border-amber-200 bg-amber-50 text-amber-800' }
        ];
        renderStatCards(cards, items);
    }

    function setActiveSheetButton(sheet) {
        document.querySelectorAll('#sync-verify-sheet-tabs [data-verify-sheet]').forEach(function (btn) {
            const on = btn.getAttribute('data-verify-sheet') === sheet;
            btn.classList.toggle('bg-blue-50', on);
            btn.classList.toggle('text-blue-700', on);
            btn.classList.toggle('text-gray-600', !on);
            btn.classList.toggle('bg-white', !on);
        });
    }

    function buildVerifyColumnDefs(columns, rows) {
        const defs = (columns || []).map(function (col) {
            const key = String(col || '').toLowerCase();
            const def = {
                field: col,
                headerName: col,
                minWidth: (key === 'kpi' || key === 'name' || key.indexOf('message') !== -1) ? 220 : 120,
                flex: 1
            };
            if (key === 'status') {
                def.cellRenderer = function (params) {
                    const text = params.value == null ? '' : String(params.value);
                    if (!text) return '';
                    return '<span class="inline-flex px-1.5 py-0.5 rounded text-xs font-medium '
                        + statusBadgeClass(text) + '">' + escapeHtmlAttr(text) + '</span>';
                };
                def.minWidth = 140;
            }
            def.filter = false;
            def.sortable = true;
            return def;
        });
        return defs.length ? defs : [{ field: '_empty', headerName: '', hide: true }];
    }

    function applyVerifyGrid(columns, rows) {
        if (typeof AgGridHelper === 'undefined' || !document.getElementById('syncVerifyGrid')) return;
        const colDefs = buildVerifyColumnDefs(columns, rows);
        if (!syncVerifyGridHelper) {
            syncVerifyGridHelper = new AgGridHelper({
                containerId: 'syncVerifyGrid',
                templateId: 'fdrs-sync-verify',
                columnDefs: colDefs,
                rowData: rows || [],
                filterPersistence: false,
                columnVisibilityOptions: { enableExport: true, enableReset: true },
                heightOptions: { minHeight: 400, maxHeight: 560, viewportOffset: 180 },
                options: {
                    getRowStyle: function (params) {
                        if (!params.data) return null;
                        const s = String(params.data.status || '').toLowerCase();
                        if (s === 'missing') return { backgroundColor: '#fef2f2' };
                        if (s === 'mismatch') return { backgroundColor: '#fffbeb' };
                        return null;
                    }
                }
            });
            syncVerifyGridHelper.initialize();
        } else if (syncVerifyGridHelper.gridApi) {
            if (typeof syncVerifyGridHelper.gridApi.setFilterModel === 'function') {
                syncVerifyGridHelper.gridApi.setFilterModel(null);
            }
            if (typeof syncVerifyGridHelper.gridApi.setGridOption === 'function') {
                syncVerifyGridHelper.gridApi.setGridOption('columnDefs', colDefs);
            }
            syncVerifyGridHelper._hasSizedColumnsToFit = false;
            syncVerifyGridHelper.setRowData(rows || []);
        }
        if (syncVerifyGridHelper.gridApi && typeof syncVerifyGridHelper.gridApi.setGridOption === 'function') {
            syncVerifyGridHelper.gridApi.setGridOption('quickFilterText', '');
        }
    }

    function syncPanelIsVisible() {
        const panel = document.getElementById('panel-sync');
        return !!(panel && !panel.classList.contains('hidden'));
    }

    function paintVerifyGrid() {
        if (!syncPanelIsVisible()) return;
        if (!pendingVerifyGrid) return;
        if (typeof AgGridHelper === 'undefined') {
            showVerifyGridError({{ _("The results table could not start. Reload the page.")|tojson|safe }});
            return;
        }
        applyVerifyGrid(pendingVerifyGrid.columns, pendingVerifyGrid.rows);
        const api = syncVerifyGridHelper && syncVerifyGridHelper.gridApi;
        if (api && typeof api.sizeColumnsToFit === 'function') {
            requestAnimationFrame(function () {
                api.sizeColumnsToFit();
            });
        }
    }

    function renderVerifyPager(data) {
        const pager = document.getElementById('sync-verify-pager');
        const label = document.getElementById('sync-verify-pager-label');
        const prev = document.getElementById('sync-verify-page-prev');
        const next = document.getElementById('sync-verify-page-next');
        if (!pager || !label) return;
        const filtered = Number(data.filtered_rows || 0);
        const pageSize = Number(data.per_page || SYNC_VERIFY_PAGE_SIZE) || SYNC_VERIFY_PAGE_SIZE;
        const page = Math.max(1, Number(data.page || 1));
        const loaded = (data.rows || []).length;
        if (!filtered) {
            pager.classList.add('hidden');
            return;
        }
        const start = (page - 1) * pageSize + 1;
        const end = start + loaded - 1;
        const pageCount = Math.max(1, Math.ceil(filtered / pageSize));
        label.textContent = {{ _("Showing")|tojson|safe }} + ' ' + start.toLocaleString()
            + '–' + end.toLocaleString() + ' / ' + filtered.toLocaleString()
            + ' · ' + {{ _("page")|tojson|safe }} + ' ' + page + ' / ' + pageCount
            + '. ' + {{ _("Download Excel for the full sheet.")|tojson|safe }};
        pager.classList.remove('hidden');
        if (prev) {
            prev.disabled = page <= 1;
            prev.style.opacity = page <= 1 ? '0.5' : '1';
        }
        if (next) {
            next.disabled = page >= pageCount;
            next.style.opacity = page >= pageCount ? '0.5' : '1';
        }
        const pageInput = document.getElementById('sync-verify-page-input');
        if (pageInput) {
            pageInput.max = String(pageCount);
            pageInput.value = String(page);
        }
    }

    function renderSyncVerifyTable(data) {
        const wrap = document.getElementById('sync-verify-table-wrap');
        if (!wrap) return;
        wrap.classList.remove('hidden');
        showVerifyGridError('');
        showVerifyGridNote(verifyCoverageNote(data));
        renderSyncVerifyStats(data.stats);
        setActiveSheetButton(data.sheet || syncVerifyTableState.sheet);
        syncVerifyTableState.page = Math.max(1, Number(data.page || syncVerifyTableState.page || 1));
        renderVerifyPager(data);
        pendingVerifyGrid = {
            columns: data.columns || [],
            rows: data.rows || []
        };
        paintVerifyGrid();
        setVerifyGridLoading(false);
    }

    function fetchSyncVerifyResultsPage() {
        if (!syncVerifyResultsUrl) return;
        const seq = ++syncVerifyFetchSeq;
        setVerifyGridLoading(true);
        showVerifyGridError('');
        const params = new URLSearchParams();
        params.set('sheet', syncVerifyTableState.sheet);
        params.set('page', String(syncVerifyTableState.page || 1));
        params.set('per_page', String(SYNC_VERIFY_PAGE_SIZE));
        const search = document.getElementById('sync-verify-search');
        const query = search && search.value ? search.value.trim() : '';
        if (query) params.set('q', query);
        const problemsBox = document.getElementById('sync-verify-problems-only');
        if (problemsBox && problemsBox.checked && syncVerifyTableState.sheet === 'data_points') {
            params.set('problems_only', '1');
        }
        fetch(syncVerifyResultsUrl + '?' + params.toString(), { headers: { 'Accept': 'application/json' } })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (seq !== syncVerifyFetchSeq) return;
                if (!data || data.success === false) {
                    throw new Error((data && data.error) || {{ _("Failed to load verification table")|tojson|safe }});
                }
                const filtered = Number(data.filtered_rows || 0);
                const pageSize = Number(data.per_page || SYNC_VERIFY_PAGE_SIZE) || SYNC_VERIFY_PAGE_SIZE;
                const pageCount = Math.max(1, Math.ceil(filtered / pageSize));
                if (filtered && syncVerifyTableState.page > pageCount) {
                    syncVerifyTableState.page = pageCount;
                    fetchSyncVerifyResultsPage();
                    return;
                }
                renderSyncVerifyTable(data);
            })
            .catch(function (err) {
                if (seq !== syncVerifyFetchSeq) return;
                setVerifyGridLoading(false);
                const wrap = document.getElementById('sync-verify-table-wrap');
                if (wrap) wrap.classList.remove('hidden');
                showVerifyGridError(err.message || {{ _("Failed to load verification table")|tojson|safe }});
            });
    }

    function loadSyncVerifyResults(resultsUrl) {
        syncVerifyResultsUrl = resultsUrl;
        syncVerifyTableState.page = 1;
        fetchSyncVerifyResultsPage();
    }

    document.querySelectorAll('#sync-verify-sheet-tabs [data-verify-sheet]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            syncVerifyTableState.sheet = this.getAttribute('data-verify-sheet');
            syncVerifyTableState.page = 1;
            const search = document.getElementById('sync-verify-search');
            if (search) search.value = '';
            fetchSyncVerifyResultsPage();
        });
    });
    const verifySearch = document.getElementById('sync-verify-search');
    if (verifySearch) {
        verifySearch.addEventListener('input', function () {
            if (syncVerifySearchTimer) clearTimeout(syncVerifySearchTimer);
            syncVerifySearchTimer = setTimeout(function () {
                syncVerifyTableState.page = 1;
                if (syncVerifyResultsUrl) fetchSyncVerifyResultsPage();
            }, 300);
        });
    }
    const verifyProblemsOnly = document.getElementById('sync-verify-problems-only');
    if (verifyProblemsOnly) {
        verifyProblemsOnly.addEventListener('change', function () {
            syncVerifyTableState.page = 1;
            if (syncVerifyResultsUrl) fetchSyncVerifyResultsPage();
        });
    }
    const verifyPagePrev = document.getElementById('sync-verify-page-prev');
    const verifyPageNext = document.getElementById('sync-verify-page-next');
    if (verifyPagePrev) {
        verifyPagePrev.addEventListener('click', function () {
            if (syncVerifyTableState.page <= 1) return;
            syncVerifyTableState.page -= 1;
            fetchSyncVerifyResultsPage();
        });
    }
    if (verifyPageNext) {
        verifyPageNext.addEventListener('click', function () {
            syncVerifyTableState.page += 1;
            fetchSyncVerifyResultsPage();
        });
    }
    const verifyPageInput = document.getElementById('sync-verify-page-input');
    if (verifyPageInput) {
        verifyPageInput.addEventListener('change', function () {
            const nextPage = parseInt(verifyPageInput.value, 10);
            if (!nextPage || nextPage < 1) {
                verifyPageInput.value = String(syncVerifyTableState.page || 1);
                return;
            }
            syncVerifyTableState.page = nextPage;
            fetchSyncVerifyResultsPage();
        });
    }
    const syncTabBtn = document.querySelector('#data-sync-tabs [data-tab="sync"]');
    if (syncTabBtn) {
        syncTabBtn.addEventListener('click', function () {
            requestAnimationFrame(paintVerifyGrid);
        });
    }

    window.updateDataSyncUrlTemplates = function (templateId) {
        currentTemplateId = templateId;
        updateDataSyncUrlTemplates(templateId);
    };

// Data Sync (config window; progress stays on the sync tab)
const dataSyncRunBtn = document.getElementById('data-sync-run-btn');
const dataSyncRunBtnText = document.getElementById('data-sync-run-btn-text');
const dataSyncSettings = document.getElementById('data-sync-settings');
const dataSyncConfigSummary = document.getElementById('data-sync-config-summary');
const dataSyncConfigSummaryBody = document.getElementById('data-sync-config-summary-body');
const dataSyncFooterSettings = document.getElementById('data-sync-footer-settings');
const dataSyncFooterRunning = document.getElementById('data-sync-footer-running');
const dataSyncFooterDone = document.getElementById('data-sync-footer-done');
const dataSyncStopBtn = document.getElementById('data-sync-stop-btn');
const dataSyncStopBtnText = document.getElementById('data-sync-stop-btn-text');
const dataSyncRunAgainBtn = document.getElementById('data-sync-run-again-btn');
const dataSyncReloadBtn = document.getElementById('data-sync-reload-btn');
const dataSyncResult = document.getElementById('data-sync-result');
const dataSyncResultText = document.getElementById('data-sync-result-text');
const dataSyncProgress = document.getElementById('data-sync-progress');
const dataSyncProgressStage = document.getElementById('data-sync-progress-stage');
const dataSyncProgressBar = document.getElementById('data-sync-progress-bar');
const dataSyncProgressText = document.getElementById('data-sync-progress-text');
const dataSyncProgressCount = document.getElementById('data-sync-progress-count');

const SYNC_STATUS_LABELS = {
    0: {{ _("Not filled")|tojson|safe }},
    100: {{ _("Saved")|tojson|safe }},
    200: {{ _("Reopened")|tojson|safe }},
    300: {{ _("Submitted")|tojson|safe }},
    400: {{ _("Validated")|tojson|safe }},
    500: {{ _("Published")|tojson|safe }}
};
const FDRS_YEARS_START = {{ fdrs_years_start }};
const FDRS_YEARS_END = {{ fdrs_years_end }};

const dataSyncYearsWrap = document.getElementById('data-sync-years-wrap');
const dataSyncYearsToggle = document.getElementById('data-sync-years-toggle');
const dataSyncYearsDropdown = document.getElementById('data-sync-years-dropdown');
const dataSyncYearsLabel = document.getElementById('data-sync-years-label');
const dataSyncYearsSelectAll = document.getElementById('data-sync-years-select-all');
const dataSyncYearsClearAll = document.getElementById('data-sync-years-clear-all');

function getDataSyncYearCheckboxes() {
    return Array.from(document.querySelectorAll('input[name="data-sync-year"]'));
}

function getSelectedDataSyncYears() {
    return getDataSyncYearCheckboxes()
        .filter(function (el) { return el.checked; })
        .map(function (el) { return parseInt(el.value, 10); })
        .filter(function (n) { return !isNaN(n); })
        .sort(function (a, b) { return a - b; });
}

function yearsAreContiguous(years) {
    for (let i = 1; i < years.length; i += 1) {
        if (years[i] !== years[i - 1] + 1) return false;
    }
    return true;
}

function formatDataSyncYearsDisplay(years) {
    if (!years.length) {
        return {{ _("No years selected")|tojson|safe }};
    }
    const allYears = [];
    for (let y = FDRS_YEARS_START; y <= FDRS_YEARS_END; y += 1) {
        allYears.push(y);
    }
    const yearsWord = {{ _("years")|tojson|safe }};
    if (years.length === allYears.length) {
        return FDRS_YEARS_START + '\u2013' + FDRS_YEARS_END + ' (' + years.length + ' ' + yearsWord + ')';
    }
    if (years.length <= 4 || !yearsAreContiguous(years)) {
        if (years.length <= 8) return years.join(', ');
        return years.slice(0, 6).join(', ') + '\u2026 (' + years.length + ' ' + yearsWord + ')';
    }
    return years[0] + '\u2013' + years[years.length - 1] + ' (' + years.length + ' ' + yearsWord + ')';
}

function updateDataSyncYearsLabel() {
    if (!dataSyncYearsLabel) return;
    dataSyncYearsLabel.textContent = formatDataSyncYearsDisplay(getSelectedDataSyncYears());
}

function setDataSyncYearsOpen(isOpen) {
    if (!dataSyncYearsDropdown || !dataSyncYearsToggle) return;
    dataSyncYearsDropdown.classList.toggle('hidden', !isOpen);
    dataSyncYearsToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

function setAllDataSyncYears(checked) {

function isSafeHref(url) {
    if (!url || typeof url !== 'string') return false;

function scheduleDataSyncPoll() {
    dataSyncPollTimer = setTimeout(pollDataSyncStatus, dataSyncPollDelayMs);
    dataSyncPollDelayMs = Math.min(
        Math.round(dataSyncPollDelayMs * DATA_SYNC_POLL_BACKOFF_FACTOR),

function setDataSyncProgress(percent, stage, message, current, total, opts) {
    opts = opts || {};
    if (opts.resetProgress) {
        dataSyncLastPercent = 0;
    }
    const raw = Math.max(0, Math.min(100, Number(percent || 0)));
    const pct = opts.resetProgress ? raw : Math.max(dataSyncLastPercent, raw);
    dataSyncLastPercent = pct;
    if (dataSyncProgressBar) dataSyncProgressBar.style.width = pct + '%';
    if (dataSyncProgressText) dataSyncProgressText.textContent = `${Math.round(pct)}%`;
    if (dataSyncProgressStage) {
        const stageText = (message && message.trim()) ? message.trim() : (stage || '-');
        dataSyncProgressStage.textContent = stageText;
    }
    if (dataSyncProgressCount) {
        if (total !== null && total !== undefined && total !== '' && Number(total) > 0) {
            dataSyncProgressCount.textContent = `${current || 0} / ${total}`;
        } else {
            dataSyncProgressCount.textContent = '';
        }
    }
}

function readJobPoll(res) {
    const type = (res.headers.get('content-type') || '').toLowerCase();
    if (res.status === 401 || res.status === 403) {
        return res.json().then(function (data) {
            return { denied: true, data: data };
        }).catch(function () {
            return { denied: true };
        });
    }
    if (res.status === 404) {
        if (type.indexOf('application/json') === -1) {
            return Promise.resolve({ missing: true });
        }
        return res.json().then(function (data) {
            return { missing: true, data: data };
        }).catch(function () {
            return { missing: true };
        });
    }
    if (type.indexOf('application/json') === -1) {
        return Promise.reject(new Error({{ _("Request failed")|tojson|safe }} + ' (' + res.status + ')'));
    }
    return res.json().then(function (data) {
        return { ok: res.ok, data: data };
    });
}

function jobPollIsMissing(result) {
    if (!result) return false;
    if (result.missing) return true;
    const data = result.data || {};
    return data.success === false && /not found/i.test(String(data.error || ''));
}

function pollDataSyncStatus() {
    if (!dataSyncActiveJobId) return;
    const url = dataSyncStatusUrlTemplate.replace('__JOB_ID__', encodeURIComponent(dataSyncActiveJobId));

    fetch(url)
        .then(readJobPoll)
        .then(result => {
            if (result && result.denied) {
                stopDataSyncPolling();
                clearDataSyncStorage();
                dataSyncResult.classList.remove('hidden');
                dataSyncResultText.textContent = (result.data && result.data.error) || {{ _("Access denied")|tojson|safe }};
                dataSyncResultText.className = 'text-sm text-red-700';
                showDataSyncDone();
                return;
            }
            if (jobPollIsMissing(result)) {
                stopDataSyncPolling();
                clearDataSyncStorage();
                resetDataSyncUI();
                return;
            }
            const data = result.data;
            if (!result.ok || !data || !data.success || !data.job) {
                throw new Error((data && data.error) || 'Failed to read sync status');
            }
            const job = data.job;

            setDataSyncProgress(job.percent, job.stage, job.message, job.current, job.total);

            if (job.status === 'completed') {
                const finishedJobId = dataSyncActiveJobId;
                stopDataSyncPolling();
                clearDataSyncStorage();
                dataSyncResult.classList.remove('hidden');
                const stats = job.stats || {};
                let msg = `Loaded: ${stats.loaded || 0}, Skipped: ${stats.skipped || 0}, Inserted: ${stats.inserted || 0}, Updated: ${stats.updated || 0}, Unchanged: ${stats.unchanged || 0}, Errors: ${stats.errors || 0}`;
                dataSyncResultText.replaceChildren();
                if (job.download_ready && job.download_url) {
                    msg += `\n\n` + {{ _("Preview Excel ready:")|tojson|safe }} + ` `;
                    appendMultilineText(dataSyncResultText, msg);
                    appendTextLink(
                        dataSyncResultText,
                        isSafeHref(job.download_url) ? job.download_url : '#',
                        {{ _("Download")|tojson|safe }},
                        'text-purple-700 underline'
                    );
                } else {
                    appendMultilineText(dataSyncResultText, msg);
                }
                if (finishedJobId && /^[a-fA-F0-9]{32}$/.test(finishedJobId)) {
                    dataSyncResultText.appendChild(document.createTextNode(' '));
                    appendTextLink(
                        dataSyncResultText,
                        '/admin/import-logs/' + encodeURIComponent(finishedJobId),
                        {{ _("View change log")|tojson|safe }},
                        'text-purple-700 underline',
                        { target: '_blank', rel: 'noopener' }
                    );
                }
                dataSyncResultText.className = 'text-sm text-green-700';
                showDataSyncDone();
                return;
            }
            if (job.status === 'failed') {
                stopDataSyncPolling();
                clearDataSyncStorage();
                dataSyncResult.classList.remove('hidden');
                dataSyncResultText.textContent = job.error || {{ _("Sync failed")|tojson|safe }};
                dataSyncResultText.className = 'text-sm text-red-700';
                showDataSyncDone();
                return;
            }
            if (job.status === 'cancelled') {
                stopDataSyncPolling();
                clearDataSyncStorage();
                dataSyncResult.classList.remove('hidden');
                dataSyncResultText.textContent = job.error || {{ _("Sync cancelled.")|tojson|safe }};
                dataSyncResultText.className = 'text-sm text-amber-700';
                showDataSyncDone();
                return;
            }
            if (job.status === 'cancel_requested') {
                setDataSyncStopping();
            }

            // Continue polling (2s initially, backs off to 5s to limit access-log noise)
            scheduleDataSyncPoll();
        })
        .catch(err => {
            if (!dataSyncActiveJobId) return;
            if (dataSyncProgressStage) {
                dataSyncProgressStage.textContent = (err.message || {{ _("Request failed")|tojson|safe }})
                    + ' — ' + {{ _("retrying")|tojson|safe }};
            }
            scheduleDataSyncPoll();
        });
}

    dataSyncRunBtn.addEventListener('click', function() {
        const params = collectDataSyncParams();

        if (params.batchSizeRawTrim) {
            if (isNaN(params.batchSize) || params.batchSize < 100) {
                showInlineFormError(dataSyncFormError, {{ _("Invalid batch size. Please enter a number >= 100 (or leave empty).")|tojson|safe }});
                return;
            }
        }

        if (!params.selectedYears.length) {
            showInlineFormError(dataSyncFormError, {{ _("Select at least one reporting year.")|tojson|safe }});
            return;
        }

        if (!params.reportedStates.length) {
            showInlineFormError(dataSyncFormError, {{ _("Select at least one data status to include.")|tojson|safe }});
            return;
        }

        showInlineFormError(dataSyncFormError, '');
        dataSyncConfigModal.closeModal();
        resetDataSyncUI();
        renderDataSyncConfigSummary(params);
        setDataSyncUIMode('running');
        if (dataSyncProgress) dataSyncProgress.classList.remove('hidden');
        setDataSyncProgress(0, 'starting', {{ _("Starting...")|tojson|safe }}, 0, null, { resetProgress: true });

        const csrfToken = document.querySelector('meta[name="csrf-token"]') && document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        const payload = {
            fdrs_years: params.years,
            dry_run: params.dryRun,
            test: params.test,
            async: true,
            imputed_use_cache: params.imputedUseCache,
            sync_documents: params.syncDocuments,
            fdrs_reported_import_states: params.reportedStates
        };
        if (params.batchSize !== null) {
            payload.batch_size = params.batchSize;
        }
        fetch(templateApiUrl(TEMPLATE_API_URLS.runDataSync, currentTemplateId), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken || ''
            },
            body: JSON.stringify(payload)
        })
        .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(result) {
            var ok = result.ok;
            var data = result.data || {};
            if (!ok || !data.success || !data.job_id) {
                throw new Error(data.error || {{ _("Sync failed")|tojson|safe }});
            }
            dataSyncActiveJobId = data.job_id;
            writeDataSyncStorage(data.job_id);
            dataSyncPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
            pollDataSyncStatus();
        })
        .catch(function(err) {
            dataSyncResult.classList.remove('hidden');
            dataSyncResultText.textContent = err.message || {{ _("Request failed")|tojson|safe }};
            dataSyncResultText.className = 'text-sm text-red-700';
            showDataSyncDone();
        });
    });
}

function resumeDataSyncJobIfNeeded() {
    let jobId = null;
    const serverJobs = readDataSyncActiveJobs().filter(function (j) { return j && j.job_id; });
    if (serverJobs.length) {
        jobId = serverJobs[0].job_id;
    } else {
        try {
            const stored = JSON.parse(localStorage.getItem(DATA_SYNC_STORAGE_KEY) || 'null');
            if (stored && stored.jobId) {
                jobId = stored.jobId;
            }
        } catch (e) { /* ignore */ }
    }
    if (!jobId) return;

    dataSyncActiveJobId = jobId;
    writeDataSyncStorage(jobId);
    activateSyncMainTab();
    dataSyncConfigModal.closeModal();
    setDataSyncUIMode('running');
    if (dataSyncProgress) dataSyncProgress.classList.remove('hidden');
    setDataSyncProgress(0, 'resuming', {{ _("Resuming sync...")|tojson|safe }}, 0, null, { resetProgress: true });
    dataSyncPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
    pollDataSyncStatus();
}

        syncVerifyYearsClearAll.addEventListener('click', function () {
            setAllSyncVerifyYears(false);
        });
    }
}

(function bindVerifySkipImputed() {
    const skipBox = document.getElementById('sync-verify-skip-imputed');
    const cacheBox = document.getElementById('sync-verify-imputed-cache');
    if (!skipBox || !cacheBox) return;
    function syncCacheEnabled() {
        cacheBox.disabled = !!skipBox.checked;
    }
    skipBox.addEventListener('change', syncCacheEnabled);
    syncCacheEnabled();
})();

let syncVerifyActiveJobId = null;
let syncVerifyPollTimer = null;
let syncVerifyPollDelayMs = 2000;
const SYNC_VERIFY_STORAGE_KEY = 'fdrs_sync_verify_job_' + currentTemplateId;
let syncVerifyUIMode = 'settings';
let syncVerifyStopRequested = false;
let syncVerifyLastPercent = 0;

function readSyncVerifyActiveJobs() {
    const el = document.getElementById('sync-verify-active-jobs');
    if (!el) return [];
    try {
        return JSON.parse(el.textContent || '[]') || [];
    } catch (e) {
        return [];
    }
}

function writeSyncVerifyStorage(jobId) {
    try {
        localStorage.setItem(SYNC_VERIFY_STORAGE_KEY, JSON.stringify({ jobId: jobId }));
    } catch (e) { /* ignore */ }
}

function clearSyncVerifyStorage() {
    try {
        localStorage.removeItem(SYNC_VERIFY_STORAGE_KEY);
    } catch (e) { /* ignore */ }
}

function stopSyncVerifyPolling() {
    if (syncVerifyPollTimer) {
        clearTimeout(syncVerifyPollTimer);
        syncVerifyPollTimer = null;
    }
    syncVerifyActiveJobId = null;
    syncVerifyPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
}

function scheduleSyncVerifyPoll() {
    syncVerifyPollTimer = setTimeout(pollSyncVerifyStatus, syncVerifyPollDelayMs);
    syncVerifyPollDelayMs = Math.min(
        Math.round(syncVerifyPollDelayMs * DATA_SYNC_POLL_BACKOFF_FACTOR),
        DATA_SYNC_POLL_MAX_MS
    );
}

function getSelectedSyncVerifyStates() {
    return Array.from(document.querySelectorAll('input[name="sync-verify-status"]:checked'))
        .map(function (el) { return parseInt(el.value, 10); })
        .filter(function (n) { return !isNaN(n); });
}

function collectSyncVerifyParams() {
    const selectedYears = getSelectedSyncVerifyYears();
    const test = !!(document.getElementById('sync-verify-test') && document.getElementById('sync-verify-test').checked);
    const skipImputed = !!(document.getElementById('sync-verify-skip-imputed') && document.getElementById('sync-verify-skip-imputed').checked);
    return {
        years: selectedYears.join(','),
        selectedYears: selectedYears,
        test: test,
        skipImputed: skipImputed,
        imputedUseCache: !skipImputed && !!(document.getElementById('sync-verify-imputed-cache') && document.getElementById('sync-verify-imputed-cache').checked),
        reportedStates: getSelectedSyncVerifyStates()
    };
}

function renderSyncVerifyConfigSummary(params) {
    if (!syncVerifyConfigSummaryBody) return;
    const yearsDisplay = params.test
        ? '2024'
        : formatDataSyncYearsDisplay(params.selectedYears || []);
    const statusLabels = (params.reportedStates || [])
        .map(function (code) { return SYNC_STATUS_LABELS[code] || String(code); })
        .join(', ');
    const rows = [
        { label: {{ _("Years")|tojson|safe }}, value: yearsDisplay },
        { label: {{ _("Data status")|tojson|safe }}, value: statusLabels || '-' },
        { label: {{ _("Test mode")|tojson|safe }}, node: dataSyncBoolIcon(params.test), inline: true },
        { label: {{ _("Skip imputed")|tojson|safe }}, node: dataSyncBoolIcon(params.skipImputed), inline: true },
        { label: {{ _("Cached imputed values")|tojson|safe }}, node: dataSyncBoolIcon(params.imputedUseCache), inline: true }
    ];
    renderConfigSummaryRows(syncVerifyConfigSummaryBody, rows);
}

function setSyncVerifyRunButtonRunning() {
    if (!syncVerifyRunBtn || !syncVerifyRunBtnText) return;
    syncVerifyRunBtn.disabled = true;
    syncVerifyRunBtnText.textContent = {{ _("Running...")|tojson|safe }};
    const iconEl = syncVerifyRunBtn.querySelector('i');
    if (iconEl) iconEl.remove();
    prependFaIcon(syncVerifyRunBtn, 'fas fa-spinner fa-spin mr-2');
}

function setSyncVerifyUIMode(mode) {
    syncVerifyUIMode = mode;
    const isSettings = mode === 'settings';
    const isRunning = mode === 'running';
    const isDone = mode === 'done';
    const verifySummaryHasRows = syncVerifyConfigSummaryBody && syncVerifyConfigSummaryBody.childNodes.length > 0;
    if (syncVerifyConfigSummary) syncVerifyConfigSummary.classList.toggle('hidden', isSettings || !verifySummaryHasRows);
    if (syncVerifyFooterRunning) syncVerifyFooterRunning.classList.toggle('hidden', !isRunning);
    if (syncVerifyFooterDone) syncVerifyFooterDone.classList.toggle('hidden', !isDone);
    if (isRunning) setSyncVerifyRunButtonRunning();
    if (isSettings || isDone) resetSyncVerifyRunButton();
}

function resetSyncVerifyRunButton() {
    if (!syncVerifyRunBtn || !syncVerifyRunBtnText) return;
    syncVerifyRunBtn.disabled = false;
    const spinner = syncVerifyRunBtn.querySelector('i.fa-spinner');
    if (spinner) spinner.remove();
    if (!syncVerifyRunBtn.querySelector('i.fa-clipboard-check')) {
        prependFaIcon(syncVerifyRunBtn, 'fas fa-clipboard-check mr-2');
    }
    syncVerifyRunBtnText.textContent = {{ _("Run verification")|tojson|safe }};
}

function resetSyncVerifyStopButton() {
    syncVerifyStopRequested = false;
    if (!syncVerifyStopBtn || !syncVerifyStopBtnText) return;
    syncVerifyStopBtn.disabled = false;
    syncVerifyStopBtnText.textContent = {{ _("Stop verification")|tojson|safe }};
}

function setSyncVerifyStopping() {
    syncVerifyStopRequested = true;
    if (!syncVerifyStopBtn || !syncVerifyStopBtnText) return;
    syncVerifyStopBtn.disabled = true;
    syncVerifyStopBtnText.textContent = {{ _("Stopping...")|tojson|safe }};
}

function showSyncVerifyDone() {
    setSyncVerifyUIMode('done');
}

function resetSyncVerifyUI(opts) {
    opts = opts || {};
    syncVerifyResult.classList.add('hidden');
    syncVerifyResultText.textContent = '';
    if (syncVerifyProgress) syncVerifyProgress.classList.add('hidden');
    if (syncVerifyProgressStage) syncVerifyProgressStage.textContent = '-';
    if (syncVerifyProgressBar) syncVerifyProgressBar.style.width = '0%';
    if (syncVerifyProgressText) syncVerifyProgressText.textContent = '0%';
    if (syncVerifyProgressCount) syncVerifyProgressCount.textContent = '';
    if (syncVerifyConfigSummaryBody) syncVerifyConfigSummaryBody.replaceChildren();
    if (syncVerifyDownloadBtn && !opts.keepTable) {
        syncVerifyDownloadBtn.classList.add('hidden');
        syncVerifyDownloadBtn.setAttribute('href', '#');
    }
    if (!opts.keepTable) {
        resetSyncVerifyTable();
    }
    syncVerifyLastPercent = 0;
    stopSyncVerifyPolling();
    resetSyncVerifyRunButton();
    resetSyncVerifyStopButton();
    setSyncVerifyUIMode('settings');
}

function setSyncVerifyProgress(percent, stage, message, current, total, opts) {
    opts = opts || {};
    if (opts.resetProgress) {
        syncVerifyLastPercent = 0;
    }
    const raw = Math.max(0, Math.min(100, Number(percent || 0)));
    const pct = opts.resetProgress ? raw : Math.max(syncVerifyLastPercent, raw);
    syncVerifyLastPercent = pct;
    if (syncVerifyProgressBar) syncVerifyProgressBar.style.width = pct + '%';
    if (syncVerifyProgressText) syncVerifyProgressText.textContent = `${Math.round(pct)}%`;
    if (syncVerifyProgressStage) {
        const stageText = (message && message.trim()) ? message.trim() : (stage || '-');
        syncVerifyProgressStage.textContent = stageText;
    }
    if (syncVerifyProgressCount) {
        if (total !== null && total !== undefined && total !== '' && Number(total) > 0) {
            syncVerifyProgressCount.textContent = `${current || 0} / ${total}`;
        } else {
            syncVerifyProgressCount.textContent = '';
        }
    }
}

function formatSyncVerifyStats(stats) {
    stats = stats || {};
    return {{ _("Points:")|tojson|safe }}
        + ' ' + String(stats.total || 0)
        + ' — '
        + String(stats.matched || 0) + ' ' + {{ _("matched")|tojson|safe }}
        + ', '
        + String(stats.skipped_intentionally || 0) + ' ' + {{ _("skipped")|tojson|safe }}
        + ', '
        + String(stats.missing || 0) + ' ' + {{ _("missing")|tojson|safe }}
        + ', '
        + String(stats.mismatch || 0) + ' ' + {{ _("mismatch")|tojson|safe }};
}

function abandonStaleVerifyJob() {
    stopSyncVerifyPolling();
    clearSyncVerifyStorage();
    resetSyncVerifyUI();
    restoreLatestVerifyIfNeeded(true);
}

function pollSyncVerifyStatus() {
    if (!syncVerifyActiveJobId) return;
    const url = syncVerifyStatusUrlTemplate.replace('__JOB_ID__', encodeURIComponent(syncVerifyActiveJobId));
    fetch(url)
        .then(readJobPoll)
        .then(result => {
            if (result && result.denied) {
                stopSyncVerifyPolling();
                clearSyncVerifyStorage();
                syncVerifyResult.classList.remove('hidden');
                syncVerifyResultText.textContent = (result.data && result.data.error) || {{ _("Access denied")|tojson|safe }};
                syncVerifyResultText.className = 'text-sm text-red-700';
                showSyncVerifyDone();
                return;
            }
            if (jobPollIsMissing(result)) {
                abandonStaleVerifyJob();
                return;
            }
            const data = result.data;
            if (!result.ok || !data || !data.success || !data.job) {
                throw new Error((data && data.error) || 'Failed to read verification status');
            }
            const job = data.job;
            setSyncVerifyProgress(job.percent, job.stage, job.message, job.current, job.total);
            if (job.status === 'completed') {
                stopSyncVerifyPolling();
                clearSyncVerifyStorage();
                syncVerifyResult.classList.remove('hidden');
                const stats = job.stats || {};
                const problems = (stats.missing || 0) + (stats.mismatch || 0);
                let msg = formatSyncVerifyStats(stats);
                const downloadUrl = job.download_url || templateApiUrl(TEMPLATE_API_URLS.syncVerifyLatest, currentTemplateId).replace(/\/sync-verify-latest$/, '/sync-verify-latest/download');
                if (job.download_ready && downloadUrl) {
                    const safeUrl = isSafeHref(downloadUrl) ? downloadUrl : '#';
                    if (syncVerifyDownloadBtn) {
                        syncVerifyDownloadBtn.classList.remove('hidden');
                        syncVerifyDownloadBtn.setAttribute('href', safeUrl);
                    }
                    msg += ' ';
                    syncVerifyResultText.replaceChildren();
                    syncVerifyResultText.appendChild(document.createTextNode(msg));
                    appendTextLink(
                        syncVerifyResultText,
                        safeUrl,
                        {{ _("Download Excel")|tojson|safe }},
                        'text-blue-700 underline'
                    );
                } else {
                    syncVerifyResultText.textContent = msg;
                }
                syncVerifyResultText.className = problems ? 'text-sm text-amber-700' : 'text-sm text-green-700';
                renderSyncVerifyLastRun({
                    exists: true,
                    completed_at: new Date().toISOString(),
                    stats: stats,
                    download_url: downloadUrl
                });
                showSyncVerifyDone();
                const resultsUrl = job.results_url || templateApiUrl(TEMPLATE_API_URLS.syncVerifyLatestResults, currentTemplateId);
                if (resultsUrl) {
                    loadSyncVerifyResults(resultsUrl);
                }
                return;
            }
            if (job.status === 'failed') {
                stopSyncVerifyPolling();
                clearSyncVerifyStorage();
                syncVerifyResult.classList.remove('hidden');
                syncVerifyResultText.textContent = job.error || {{ _("Verification failed")|tojson|safe }};
                syncVerifyResultText.className = 'text-sm text-red-700';
                showSyncVerifyDone();
                return;
            }
            if (job.status === 'cancelled') {
                stopSyncVerifyPolling();
                clearSyncVerifyStorage();
                syncVerifyResult.classList.remove('hidden');
                syncVerifyResultText.textContent = job.error || {{ _("Verification cancelled.")|tojson|safe }};
                syncVerifyResultText.className = 'text-sm text-amber-700';
                showSyncVerifyDone();
                return;
            }
            if (job.status === 'cancel_requested') {
                setSyncVerifyStopping();
            }
            scheduleSyncVerifyPoll();
        })
        .catch(err => {
            if (!syncVerifyActiveJobId) return;
            if (syncVerifyProgressStage) {
                syncVerifyProgressStage.textContent = (err.message || {{ _("Request failed")|tojson|safe }})
                    + ' — ' + {{ _("retrying")|tojson|safe }};
            }
            scheduleSyncVerifyPoll();
        });
}

if (syncVerifyRunAgainBtn) {
    syncVerifyRunAgainBtn.addEventListener('click', function () {
        resetSyncVerifyUI({ keepTable: true });
        syncVerifyConfigModal.openModal();
    });
}
if (syncVerifyStopBtn) {
    syncVerifyStopBtn.addEventListener('click', function() {
        if (!syncVerifyActiveJobId || syncVerifyStopRequested) return;
        setSyncVerifyStopping();
        const url = syncVerifyCancelUrlTemplate.replace('__JOB_ID__', encodeURIComponent(syncVerifyActiveJobId));
        const csrfToken = document.querySelector('meta[name="csrf-token"]') && document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken || ''
            }
        })
        .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(result) {
            if (!result.ok || !(result.data && result.data.success)) {
                throw new Error((result.data && result.data.error) || {{ _("Failed to stop verification")|tojson|safe }});
            }
        })
        .catch(function(err) {
            resetSyncVerifyStopButton();
            syncVerifyResult.classList.remove('hidden');
            syncVerifyResultText.textContent = err.message || {{ _("Failed to stop verification")|tojson|safe }};
            syncVerifyResultText.className = 'text-sm text-red-700';
        });
    });
}
if (syncVerifyRunBtn) {
    syncVerifyRunBtn.addEventListener('click', function() {
        const params = collectSyncVerifyParams();
        if (!params.test && !params.selectedYears.length) {
            showInlineFormError(syncVerifyFormError, {{ _("Select at least one reporting year.")|tojson|safe }});
            return;
        }
        if (!params.reportedStates.length) {
            showInlineFormError(syncVerifyFormError, {{ _("Select at least one data status to include.")|tojson|safe }});
            return;
        }
        showInlineFormError(syncVerifyFormError, '');
        syncVerifyConfigModal.closeModal();
        resetSyncVerifyUI({ keepTable: true });
        renderSyncVerifyConfigSummary(params);
        setSyncVerifyUIMode('running');
        if (syncVerifyProgress) syncVerifyProgress.classList.remove('hidden');
        setSyncVerifyProgress(0, 'starting', {{ _("Starting...")|tojson|safe }}, 0, null, { resetProgress: true });

        const csrfToken = document.querySelector('meta[name="csrf-token"]') && document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        const payload = {
            fdrs_years: params.years,
            test: params.test,
            skip_imputed: params.skipImputed,
            imputed_use_cache: params.imputedUseCache,
            fdrs_reported_import_states: params.reportedStates
        };
        fetch(templateApiUrl(TEMPLATE_API_URLS.runSyncVerify, currentTemplateId), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken || ''
            },
            body: JSON.stringify(payload)
        })
        .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(result) {
            var ok = result.ok;
            var data = result.data || {};
            if (!ok || !data.success || !data.job_id) {
                throw new Error(data.error || {{ _("Verification failed")|tojson|safe }});
            }
            syncVerifyActiveJobId = data.job_id;
            writeSyncVerifyStorage(data.job_id);
            syncVerifyPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
            pollSyncVerifyStatus();
        })
        .catch(function(err) {
            syncVerifyResult.classList.remove('hidden');
            syncVerifyResultText.textContent = err.message || {{ _("Request failed")|tojson|safe }};
            syncVerifyResultText.className = 'text-sm text-red-700';
            showSyncVerifyDone();
        });
    });
}

function resumeSyncVerifyJobIfNeeded() {
    let jobId = null;
    const serverJobs = readSyncVerifyActiveJobs().filter(function (j) { return j && j.job_id; });
    if (serverJobs.length) {
        jobId = serverJobs[0].job_id;
    } else {
        try {
            const stored = JSON.parse(localStorage.getItem(SYNC_VERIFY_STORAGE_KEY) || 'null');
            if (stored && stored.jobId) {
                jobId = stored.jobId;
            }
        } catch (e) { /* ignore */ }
    }
    if (!jobId) return;
    syncVerifyActiveJobId = jobId;
    writeSyncVerifyStorage(jobId);
    activateSyncMainTab();
    syncVerifyConfigModal.closeModal();
    setSyncVerifyUIMode('running');
    if (syncVerifyProgress) syncVerifyProgress.classList.remove('hidden');
    setSyncVerifyProgress(0, 'resuming', {{ _("Resuming verification...")|tojson|safe }}, 0, null, { resetProgress: true });
    syncVerifyPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
    pollSyncVerifyStatus();
}

function restoreLatestVerifyIfNeeded(force) {
    if (!force && readSyncVerifyActiveJobs().length) return;
    if (!force) {
        try {
            const stored = JSON.parse(localStorage.getItem(SYNC_VERIFY_STORAGE_KEY) || 'null');
            if (stored && stored.jobId) return;
        } catch (e) { /* ignore */ }
    }
    const latestUrl = templateApiUrl(TEMPLATE_API_URLS.syncVerifyLatest, currentTemplateId);
    setVerifyGridLoading(true);
    fetch(latestUrl, { headers: { 'Accept': 'application/json' } })
        .then(function (res) { return res.json(); })
        .then(function (data) {
            if (!data || data.success === false || !data.exists) {
                setVerifyGridLoading(false);
                showVerifyGridNote({{ _("No verification results yet. Run verification to fill this table.")|tojson|safe }});
                return;
            }
            renderSyncVerifyLastRun(data);
            if (data.download_url && syncVerifyDownloadBtn && isSafeHref(data.download_url)) {
                syncVerifyDownloadBtn.classList.remove('hidden');
                syncVerifyDownloadBtn.setAttribute('href', data.download_url);
            }
            if (data.results_url) {
                loadSyncVerifyResults(data.results_url);
            }
        })
        .catch(function () {
            setVerifyGridLoading(false);
        });
}

resumeSyncVerifyJobIfNeeded();
if (syncVerifyActiveJobId) {
    setVerifyGridLoading(false);
}
restoreLatestVerifyIfNeeded();
});
</script>
