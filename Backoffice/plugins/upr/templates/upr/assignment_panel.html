{# Live UPR panel on Unified Plan / Report assignment pages. #}
<div id="upr-panel" class="bg-white p-3 sm:p-6 rounded-lg border border-gray-200 mb-4 sm:mb-6"
     data-aes-id="{{ assignment_status.id }}"
     data-loading="{{ _('Loading visuals…')|forceescape }}"
     data-translating="{{ _('Translating visuals… {done} of {total}')|forceescape }}"
     data-remaining="{{ _('{pending} remaining')|forceescape }}"
     data-failed="{{ _('Could not load visuals.')|forceescape }}">
    <div class="upr-embed__toolbar">
        <div id="upr-tabs" class="upr-embed__tabs" role="tablist" aria-label="{{ _('UPR')|forceescape }}"></div>
        <div class="upr-embed__tools">
            {% include "plugins/upr/upr/_language_select.html" %}
            <div class="upr-download">
            <button type="button" id="upr-download" class="btn btn-icon btn-sm btn-secondary"
                    title="{{ _('Download')|forceescape }}"
                    aria-label="{{ _('Download')|forceescape }}"
                    aria-haspopup="menu"
                    aria-expanded="false"
                    aria-controls="upr-download-menu">
                <i class="fas fa-download" aria-hidden="true"></i>
            </button>
            <div id="upr-download-menu" class="upr-download__menu" role="menu">
                {% include "plugins/upr/upr/_download_menu.html" %}
            </div>
            </div>
        </div>
    </div>
    <p id="upr-status" class="text-sm text-gray-500 mb-2"></p>
    <div id="upr-body" class="upr-visual-report__body upr-vis-page"></div>
</div>
{% include "plugins/upr/upr/_narrative_modal.html" %}
