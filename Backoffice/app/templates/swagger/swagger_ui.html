<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% include 'components/_client_console_guard.html' %}
    <title>{{ ORG_NAME }} API Documentation</title>
    <link rel="stylesheet" type="text/css" href="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui.css" />
    <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.9.0/favicon-32x32.png" sizes="32x32" />
    <link rel="icon" type="image/png" href="https://unpkg.com/swagger-ui-dist@5.9.0/favicon-16x16.png" sizes="16x16" />
    <style nonce="{{ csp_nonce() }}">
        html {
            box-sizing: border-box;
            overflow: -moz-scrollbars-vertical;
            overflow-y: scroll;
        }
        *, *:before, *:after {
            box-sizing: inherit;
        }
        body {
            margin: 0;
            background: #fafafa;
        }
        .swagger-ui .scheme-container .schemes > div:has(.servers) {
            display: none;
        }
    </style>
</head>
<body{% if show_staging_banner %} class="has-staging-banner"{% endif %}>
    {% include 'components/_staging_environment_banner.html' %}
    <div id="swagger-ui"></div>

    <script src="https://unpkg.com/swagger-ui-dist@5.9.0/swagger-ui-bundle.js"></script>
    <script nonce="{{ csp_nonce() }}">
        window.onload = function() {
            window.__clientLog && window.__clientLog('Swagger UI: Initializing...');

            // Check if Swagger UI libraries loaded
            if (typeof SwaggerUIBundle === 'undefined') {
                console.error('Swagger UI: SwaggerUIBundle is not defined');
                document.getElementById('swagger-ui').innerHTML =
                    '<div style="padding: 20px; font-family: Arial;">' +
                    '<h2>Error: Swagger UI libraries failed to load</h2>' +
                    '<p>Please check your internet connection and refresh the page.</p>' +
                    '</div>';
                return;
            }

            const specUrl = window.location.origin + '/api-docs/openapi.json';
            window.__clientLog && window.__clientLog('Swagger UI: Loading spec from', specUrl);

            // Test if spec URL is accessible
            fetch(specUrl)
                .then(response => {
                    window.__clientLog && window.__clientLog('Swagger UI: Spec fetch response status', response.status);
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status + ': ' + response.statusText);
                    }
                    return response.json();
                })
                .then(spec => {
                    window.__clientLog && window.__clientLog('Swagger UI: Spec loaded successfully', {
                        openapi: spec.openapi,
                        paths: Object.keys(spec.paths || {}).length,
                        tags: spec.tags?.length || 0
                    });

                    function headerValue(headers, name) {
                        if (!headers) return '';
                        if (typeof headers.get === 'function') {
                            return headers.get(name) || headers.get(name.toLowerCase()) || '';
                        }
                        const found = Object.keys(headers).find(function (key) {
                            return key.toLowerCase() === name.toLowerCase();
                        });
                        return found ? headers[found] : '';
                    }

                    function specPath(url) {
                        const parsed = new URL(url, window.location.origin);
                        let path = parsed.pathname;
                        const prefixes = (spec.servers || []).map(function (server) {
                            try {
                                return new URL(server.url, window.location.origin).pathname.replace(/\/$/, '');
                            } catch (e) {
                                return '';
                            }
                        }).filter(Boolean).sort(function (a, b) { return b.length - a.length; });
                        for (let i = 0; i < prefixes.length; i++) {
                            const prefix = prefixes[i];
                            if (path === prefix || path.indexOf(prefix + '/') === 0) {
                                path = path.slice(prefix.length) || '/';
                                break;
                            }
                        }
                        return path;
                    }

                    function findOperation(url, method) {
                        const path = specPath(url);
                        const methodName = String(method || 'get').toLowerCase();
                        const direct = spec.paths && spec.paths[path];
                        if (direct && direct[methodName]) return direct[methodName];
                        const actual = path.split('/').filter(Boolean);
                        const templates = Object.keys(spec.paths || {});
                        for (let i = 0; i < templates.length; i++) {
                            const tmpl = templates[i];
                            const parts = tmpl.split('/').filter(Boolean);
                            if (parts.length !== actual.length) continue;
                            const matches = parts.every(function (part, index) {
                                return (part.charAt(0) === '{' && part.charAt(part.length - 1) === '}') || part === actual[index];
                            });
                            if (matches && spec.paths[tmpl][methodName]) return spec.paths[tmpl][methodName];
                        }
                        return null;
                    }

                    // Initialize Swagger UI with inline spec.
                    // credentials stay omitted so a logged-in browser cannot
                    // authorize Try it out. Key routes need Authorize; session-only
                    // routes are refused here.
                    const ui = SwaggerUIBundle({
                        spec: spec,  // Use inline spec for better error handling
                        dom_id: '#swagger-ui',
                        deepLinking: true,
                        presets: [
                            SwaggerUIBundle.presets.apis
                        ],
                        layout: "BaseLayout",
                        filter: true,
                        validatorUrl: null,
                        withCredentials: false,
                        persistAuthorization: true,
                        tryItOutEnabled: true,
                        supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch'],
                        requestInterceptor: function (req) {
                            req.credentials = 'omit';
                            var target;
                            try {
                                target = new URL(req.url, window.location.origin);
                            } catch (e) {
                                throw new Error('Try it out only calls this host.');
                            }
                            if (target.origin !== window.location.origin) {
                                throw new Error('Try it out only calls this host.');
                            }
                            const op = findOperation(req.url, req.method);
                            if (!op) return req;
                            const schemes = [];
                            (op.security || []).forEach(function (entry) {
                                if (entry && typeof entry === 'object') {
                                    Object.keys(entry).forEach(function (name) { schemes.push(name); });
                                }
                            });
                            if (!schemes.length) return req;
                            if (schemes.every(function (name) { return name === 'SessionAuth'; })) {
                                throw new Error('This route requires a logged-in Backoffice session. An API key cannot call it, so Try it out is disabled.');
                            }
                            const bearer = String(headerValue(req.headers, 'Authorization') || '').trim();
                            const apiKey = String(headerValue(req.headers, 'X-API-Key') || '').trim();
                            if (!/^Bearer\s+\S+/i.test(bearer) && !apiKey) {
                                throw new Error('This route requires an API key. Click Authorize, paste the key, and try again.');
                            }
                            return req;
                        },
                        onComplete: function() {
                            window.__clientLog && window.__clientLog('Swagger UI: Initialization complete');
                        }
                    });

                    window.swaggerUI = ui;
                    window.__clientLog && window.__clientLog('Swagger UI: Bundle created');
                })
                .catch(error => {
                    console.error('Swagger UI: Error loading spec', error);
                    const errContainer = document.getElementById('swagger-ui');
                    if (errContainer) {
                        errContainer.textContent = '';
                        const wrap = document.createElement('div');
                        wrap.style.cssText = 'padding:20px;font-family:Arial;color:red';
                        const h2 = document.createElement('h2');
                        h2.textContent = 'Error Loading API Documentation';
                        const pErr = document.createElement('p');
                        const strong = document.createElement('strong');
                        strong.textContent = 'Error: ';
                        pErr.appendChild(strong);
                        pErr.appendChild(document.createTextNode(error.message || String(error)));
                        const pCheck = document.createElement('p');
                        pCheck.textContent = 'Please check:';
                        const ul = document.createElement('ul');
                        const li1 = document.createElement('li');
                        li1.textContent = 'Server is running';
                        const li2 = document.createElement('li');
                        const link = document.createElement('a');
                        link.href = specUrl;
                        link.target = '_blank';
                        link.textContent = 'OpenAPI JSON is accessible';
                        li2.appendChild(link);
                        const li3 = document.createElement('li');
                        li3.textContent = 'Browser console for more details';
                        ul.appendChild(li1); ul.appendChild(li2); ul.appendChild(li3);
                        wrap.appendChild(h2); wrap.appendChild(pErr);
                        wrap.appendChild(pCheck); wrap.appendChild(ul);
                        errContainer.appendChild(wrap);
                    }
                });
        };
    </script>
</body>
</html>
