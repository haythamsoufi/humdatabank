# Build and deploy humanitarian-databank-mcp to Azure App Service (staging).
#
# Manual only — run from Actions → "Deploy MCP to Azure" → Run workflow.
#
# Staging app: ifrc-databank-mcp-staging (resource group ifrctgo001rg)
# Image:       ifrcimage.azurecr.io/databank_mcp:<tag>
#
# Required GitHub secrets (environment: staging):
#   ACR_USERNAME / ACR_PASSWORD — ifrcimage.azurecr.io
#   AZURE_MCP_PUBLISH_PROFILE — publish profile XML for ifrc-databank-mcp-staging
#     (deploy + Kudu /api/restart when restart_after_deploy is true)

name: Deploy MCP to Azure

run-name: Deploy MCP — staging (${{ inputs.version }})

on:
  workflow_dispatch:
    inputs:
      version:
        description: Container image tag in ACR (e.g. v1.1)
        required: true
        default: v1.1
        type: string
      restart_after_deploy:
        description: Restart the web app after deploy so it pulls the new image
        required: false
        default: true
        type: boolean

env:
  ACR_REGISTRY: ifrcimage.azurecr.io
  IMAGE_NAME: databank_mcp
  EFFECTIVE_VERSION: ${{ inputs.version }}

jobs:
  build:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push MCP container image
        uses: docker/build-push-action@v7
        with:
          context: ./humanitarian-databank-mcp
          file: ./humanitarian-databank-mcp/Dockerfile
          push: true
          tags: |
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EFFECTIVE_VERSION }}
            ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          platforms: linux/amd64
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Deploy MCP to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: ifrc-databank-mcp-staging
          images: ${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EFFECTIVE_VERSION }}
          publish-profile: ${{ secrets.AZURE_MCP_PUBLISH_PROFILE }}

      # Mutable ACR tags are not pulled again unless the App Service recycles.
      # Staging AZURE_CREDENTIALS is scoped to Backoffice apps, not MCP — use Kudu
      # deployment credentials from the MCP publish profile (same secret as deploy).
      - name: Restart Azure Web App (Kudu)
        if: inputs.restart_after_deploy
        env:
          PUBLISH_PROFILE: ${{ secrets.AZURE_MCP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import base64
          import os
          import sys
          import urllib.error
          import urllib.request
          import xml.etree.ElementTree as ET

          xml = os.environ.get("PUBLISH_PROFILE", "")
          if not xml.strip():
              print("PUBLISH_PROFILE is empty", file=sys.stderr)
              sys.exit(1)

          root = ET.fromstring(xml)
          profile = None
          for pp in root.findall("publishProfile"):
              if pp.get("publishMethod") == "MSDeploy":
                  profile = pp
                  break
          if profile is None:
              for pp in root.findall("publishProfile"):
                  if "scm.azurewebsites.net" in (pp.get("publishUrl") or ""):
                      profile = pp
                      break
          if profile is None:
              print("No MSDeploy / SCM publishProfile in AZURE_MCP_PUBLISH_PROFILE", file=sys.stderr)
              sys.exit(1)

          host = (profile.get("publishUrl") or "").split(":")[0]
          user = profile.get("userName") or ""
          pwd = profile.get("userPWD") or ""
          if not host or not user or not pwd:
              print("publishProfile missing publishUrl, userName, or userPWD", file=sys.stderr)
              sys.exit(1)

          url = f"https://{host}/api/restart"
          req = urllib.request.Request(url, method="POST", data=b"")
          token = base64.b64encode(f"{user}:{pwd}".encode()).decode("ascii")
          req.add_header("Authorization", f"Basic {token}")

          try:
              with urllib.request.urlopen(req, timeout=120) as resp:
                  print(f"Restart requested via Kudu: HTTP {resp.status} ({url})")
          except urllib.error.HTTPError as exc:
              body = exc.read().decode("utf-8", errors="replace")
              print(f"Kudu restart failed: HTTP {exc.code} {exc.reason}\n{body}", file=sys.stderr)
              sys.exit(1)
          PY

      - name: Deployment summary
        run: |
          {
            echo "## MCP deployed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| App | \`ifrc-databank-mcp-staging\` |"
            echo "| Resource group | \`ifrctgo001rg\` |"
            echo "| Image | \`${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.EFFECTIVE_VERSION }}\` |"
            echo "| URL | https://ifrc-databank-mcp-staging.azurewebsites.net/mcp |"
            echo ""
            echo "Backoffice staging \`MCP_UPSTREAM_URL\` should be \`https://ifrc-databank-mcp-staging.azurewebsites.net\`."
          } >> "$GITHUB_STEP_SUMMARY"
