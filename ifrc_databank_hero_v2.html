<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IFRC Humanitarian Databank — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #011E41;
    --navy-2: #0a2f66;
    --navy-deep: #00060f;
    --red: #C8102E;
    --red-light: #ff5470;
    --blue: #3E7BFA;
    --ease-expo: cubic-bezier(.16,1,.3,1);
    --ease-quad: cubic-bezier(.25,.46,.45,.94);
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; height:100%; background: var(--navy); }
  body{ overflow:hidden; }
  ::selection{ background: rgba(200,16,46,.35); }

  .scene{
    position: relative;
    display: flex;
    width: 100%;
    height: 100vh;
    min-height: 560px;
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
    opacity:0; transform: scale(1.015);
  }
  .scene.in{ animation: sceneIn .6s var(--ease-expo) forwards; }
  @keyframes sceneIn{ to{ opacity:1; transform: scale(1); } }

  /* ---------- left: animated visual ---------- */
  .hero-visual{
    position: relative;
    flex: 1 1 auto;
    min-width: 0;
    height: 100%;
    display: flex;
    align-items: center;
    overflow: hidden;
    background:
      radial-gradient(58% 58% at 10% 14%, rgba(62,123,250,.24), transparent 62%),
      radial-gradient(54% 54% at 94% 90%, rgba(200,16,46,.16), transparent 60%),
      radial-gradient(120% 85% at 50% 112%, rgba(0,4,14,.6), transparent 60%),
      linear-gradient(165deg, var(--navy-2) 0%, var(--navy) 42%, var(--navy-deep) 100%);
  }

  canvas#network{
    position:absolute; inset:0; width:100%; height:100%; display:block;
    z-index:1; opacity:0; transition: opacity 1.1s ease;
  }
  canvas#network.in{ opacity:1; }

  .aurora{ position:absolute; inset:-16%; z-index:0; filter: blur(64px); pointer-events:none; will-change: transform; }
  .aurora span{ position:absolute; border-radius:50%; }
  .aurora .b1{
    width:42vw; height:42vw; max-width:560px; max-height:560px; top:-10%; left:-8%;
    background: radial-gradient(circle at 35% 35%, rgba(62,123,250,.55), rgba(62,123,250,0) 68%);
    animation: driftA 24s var(--ease-quad) infinite alternate;
  }
  .aurora .b2{
    width:36vw; height:36vw; max-width:480px; max-height:480px; bottom:-14%; right:-6%;
    background: radial-gradient(circle at 60% 60%, rgba(200,16,46,.42), rgba(200,16,46,0) 68%);
    animation: driftB 28s var(--ease-quad) infinite alternate;
  }
  .aurora .b3{
    width:26vw; height:26vw; max-width:360px; max-height:360px; top:36%; left:44%;
    background: radial-gradient(circle, rgba(255,255,255,.10), transparent 70%);
    animation: driftC 20s var(--ease-quad) infinite alternate;
  }
  @keyframes driftA{ from{ transform: translate(0,0) scale(1); } to{ transform: translate(6%,7%) scale(1.12); } }
  @keyframes driftB{ from{ transform: translate(0,0) scale(1); } to{ transform: translate(-6%,-5%) scale(1.08); } }
  @keyframes driftC{ from{ transform: translate(0,0) scale(1); } to{ transform: translate(-4%,5%) scale(.9); } }

  .spotlight{
    position:absolute; inset:0; z-index:2; pointer-events:none; opacity:0;
    transition: opacity .5s ease;
    background: radial-gradient(circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.09), transparent 40%);
    mix-blend-mode: screen;
  }
  .hero-visual:hover .spotlight{ opacity:1; }

  .grain{ position:absolute; inset:0; z-index:3; pointer-events:none; opacity:.04; mix-blend-mode: overlay; background-repeat: repeat; background-size: 128px 128px; }

  .hero-content{
    position: relative; z-index:4; width:100%; max-width:600px;
    padding-inline: 7vw 4vw;
    will-change: transform;
  }

  /* brand mark */
  .brand-mark{ position:relative; width:104px; height:104px; margin:0 0 36px 0; opacity:0; transform: translateY(14px) scale(.92); filter: blur(6px); }
  .brand-mark.in{ animation: markIn .7s var(--ease-expo) forwards, breathe 4.8s ease-in-out .7s infinite; }
  @keyframes markIn{ to{ opacity:1; transform: translateY(0) scale(1); filter: blur(0); } }
  @keyframes breathe{ 0%,100%{ transform: scale(1); } 50%{ transform: scale(1.025); } }

  .brand-glow{
    position:absolute; inset:-34px; border-radius:50%;
    background: radial-gradient(circle, rgba(200,16,46,.38) 0%, rgba(62,123,250,.16) 55%, transparent 72%);
    filter: blur(18px); opacity:.5;
    animation: glowPulse 5s var(--ease-quad) .8s infinite;
  }
  @keyframes glowPulse{ 0%,100%{ opacity:.4; transform: scale(1); } 50%{ opacity:.72; transform: scale(1.08); } }

  .brand-flash{
    position:absolute; inset:-4px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.6); opacity:0; transform: scale(.6);
  }
  .brand-mark.in .brand-flash{ animation: flashPing .9s var(--ease-quad) .12s 1; }
  @keyframes flashPing{ 0%{ opacity:.85; transform: scale(.6); } 100%{ opacity:0; transform: scale(2.7); } }

  .brand-ring{
    position:absolute; inset:-10px; border-radius:50%;
    background: conic-gradient(from 0deg, rgba(200,16,46,.65), rgba(62,123,250,.5), rgba(200,16,46,.65));
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
    opacity:.7;
    animation: ringSpin 26s linear infinite;
  }
  @keyframes ringSpin{ to{ transform: rotate(360deg); } }

  .brand-badge{
    position:relative; width:100%; height:100%; border-radius:50%; background:#fff;
    display:flex; align-items:center; justify-content:center;
    box-shadow: 0 14px 40px rgba(0,0,0,.4), 0 0 0 1px rgba(255,255,255,.06);
  }
  .brand-badge svg{ width:60%; height:60%; }

  /* eyebrow chip */
  .eyebrow{
    display: inline-flex; align-items:center; gap:9px;
    margin:0 0 20px 0; padding:7px 16px 7px 12px; border-radius:999px;
    background: rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.16);
    color: rgba(255,255,255,.92); font-size:.8rem; font-weight:600; letter-spacing:.01em;
    opacity:0; transform: translateY(10px);
    backdrop-filter: blur(6px);
  }
  .eyebrow.in{ animation: fadeUp .55s var(--ease-expo) forwards; }
  .eyebrow .dot{ position:relative; width:7px; height:7px; border-radius:50%; background: var(--red); flex-shrink:0; }
  .eyebrow .dot::after{ content:''; position:absolute; inset:-5px; border-radius:50%; border:1.5px solid var(--red); opacity:0; }
  .eyebrow.in .dot::after{ animation: dotPing 2.6s ease-out .6s infinite; }
  @keyframes dotPing{ 0%{ opacity:.65; transform: scale(.6); } 70%{ opacity:0; transform: scale(1.9); } 100%{ opacity:0; } }

  h1.headline{
    color:#fff; font-weight:800; letter-spacing:-.01em;
    font-size: clamp(2rem, 3.6vw, 3.05rem); line-height:1.14;
    margin:0 0 22px 0; text-shadow: 0 2px 24px rgba(0,0,0,.35);
    display:flex; flex-wrap:wrap; gap:0 .3em;
    min-height: 1.14em;
  }
  h1.headline .w{ display:inline-block; opacity:0; transform: translateY(.4em); filter: blur(8px); }
  h1.headline.reveal .w{ animation: wordIn .56s var(--ease-expo) forwards; }
  h1.headline .w.accent{
    background: linear-gradient(95deg, var(--red-light), var(--red) 60%);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; color:transparent;
  }
  @keyframes wordIn{ to{ opacity:1; transform: translateY(0); filter: blur(0); } }

  p.subcopy{
    color: rgba(255,255,255,.82); font-weight:400; font-size: clamp(.98rem, 1.25vw, 1.1rem);
    line-height:1.65; max-width:46ch; margin:0;
    opacity:0; transform: translateY(14px);
  }
  p.subcopy.in{ animation: fadeUp .55s var(--ease-expo) forwards; }
  @keyframes fadeUp{ to{ opacity:1; transform: translateY(0); } }

  .hero-footer{
    position:absolute; z-index:4; inset-inline-start:7vw; bottom:26px;
    color: rgba(255,255,255,.38); font-size:.72rem; letter-spacing:.02em;
    opacity:0;
  }
  .hero-footer.in{ animation: fadeUp .6s var(--ease-expo) forwards; }

  /* ---------- right: login panel ---------- */
  .login-panel{
    position:relative; z-index:5; flex:0 0 440px; height:100%;
    background:#fff; display:flex; flex-direction:column; justify-content:center;
    padding:56px 50px; box-shadow: -24px 0 60px rgba(0,0,0,.3);
    opacity:0; transform: translateX(40px);
  }
  .login-panel::before{
    content:''; position:absolute; inset-inline-start:0; top:0; bottom:0; width:4px;
    background: linear-gradient(180deg, var(--blue), var(--navy) 45%, var(--red));
    transform: scaleY(0); transform-origin: top;
  }
  .login-panel.in{ animation: panelIn .6s var(--ease-expo) forwards; }
  .login-panel.in::before{ animation: barGrowV .7s var(--ease-expo) .1s forwards; }
  @keyframes panelIn{ to{ opacity:1; transform: translateX(0); } }
  @keyframes barGrowV{ to{ transform: scaleY(1); } }

  /* staggered reveal of the panel's own content, layered on top of the panel slide-in */
  .lang-switch, .panel-brand, .panel-title, .panel-lead, .btn-sso, .panel-hint, .panel-trust, .panel-footer{
    opacity:0; transform: translateY(12px);
  }
  .login-panel.in .lang-switch{ animation: fadeUp .5s var(--ease-expo) .18s forwards; }
  .login-panel.in .panel-brand{ animation: fadeUp .5s var(--ease-expo) .26s forwards; }
  .login-panel.in .panel-title{ animation: fadeUp .5s var(--ease-expo) .32s forwards; }
  .login-panel.in .panel-lead{ animation: fadeUp .5s var(--ease-expo) .38s forwards; }
  .login-panel.in .btn-sso{ animation: fadeUp .5s var(--ease-expo) .46s forwards; }
  .login-panel.in .panel-hint{ animation: fadeUp .5s var(--ease-expo) .54s forwards; }
  .login-panel.in .panel-trust{ animation: fadeUp .5s var(--ease-expo) .60s forwards; }
  .login-panel.in .panel-footer{ animation: fadeUp .5s var(--ease-expo) .66s forwards; }

  .lang-switch{
    position:absolute; top:24px; inset-inline-end:26px; z-index:6;
    display:flex; align-items:center; gap:2px; padding:3px;
    background:#f2f3f5; border-radius:999px;
  }
  .lang-thumb{
    position:absolute; top:3px; left:3px; height:calc(100% - 6px); width:34px;
    background:#fff; border-radius:999px; box-shadow:0 1px 4px rgba(0,0,0,.12);
    transition: transform .32s var(--ease-expo), width .32s var(--ease-expo);
    z-index:0; will-change: transform;
  }
  .lang-switch button{
    position:relative; z-index:1;
    background:none; border:none; cursor:pointer; padding:5px 11px; border-radius:999px;
    font-family:inherit; font-size:.72rem; font-weight:600; color:#8f98a6; transition: color .2s;
  }
  .lang-switch button.active{ color: var(--navy); }
  .lang-switch button:hover:not(.active){ color:#5b6472; }

  .panel-brand{ font-size:.76rem; font-weight:700; letter-spacing:.09em; color: var(--red); text-transform:uppercase; margin:0 0 16px 0; }
  .panel-title{ margin:0 0 8px 0; font-size:1.5rem; font-weight:800; color: var(--navy); letter-spacing:-.01em; }
  .panel-lead{ margin:0 0 28px 0; font-size:.9rem; color:#6b7280; line-height:1.55; }

  .btn-sso{
    position:relative; overflow:hidden; width:100%; display:flex; align-items:center; justify-content:center; gap:10px;
    padding:14px 18px; background: linear-gradient(135deg, var(--red) 0%, #a80d26 100%); color:#fff;
    border:none; border-radius:10px; font-family:inherit; font-weight:600; font-size:.97rem; cursor:pointer;
    transition: transform .16s ease, box-shadow .25s ease;
    box-shadow: 0 6px 18px rgba(200,16,46,.28);
  }
  .btn-sso:hover{ box-shadow: 0 10px 26px rgba(200,16,46,.4); transform: translateY(-1px); }
  .btn-sso:active{ transform: translateY(0) scale(.98); }
  .btn-sso::after{
    content:''; position:absolute; top:0; left:-60%; width:35%; height:100%;
    background: linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
    transform: skewX(-18deg);
  }
  .btn-sso:hover::after{ animation: shimmer 1.05s ease; }
  @keyframes shimmer{ from{ left:-60%; } to{ left:130%; } }
  .btn-sso-icon, .btn-sso-arrow{ display:flex; flex-shrink:0; }
  .btn-sso-arrow{ transition: transform .2s ease; }
  .btn-sso:hover .btn-sso-arrow{ transform: translateX(3px); }
  .btn-sso-label{ white-space:nowrap; }

  .panel-hint{ margin:14px 0 0 0; font-size:.8rem; color:#9ca3af; text-align:center; line-height:1.5; }

  .panel-trust{
    display:flex; align-items:center; gap:8px; margin-top:26px; padding-top:22px;
    border-top:1px solid #eef0f3; color:#9ca3af; font-size:.76rem;
  }
  .panel-trust svg{ flex-shrink:0; opacity:.8; }

  .panel-footer{ margin-top:16px; text-align:center; }
  .panel-footer a{ color:#6b7280; font-size:.8rem; text-decoration:none; border-bottom:1px solid transparent; transition: color .15s, border-color .15s; cursor:pointer; }
  .panel-footer a:hover{ color: var(--navy); border-color: currentColor; }

  @media (max-width: 1200px){
    .login-panel{ flex-basis:400px; padding:48px 40px; }
  }
  @media (max-width: 880px){
    html,body{ height:auto; }
    body{ overflow:visible; }
    .scene{ flex-direction:column; height:auto; min-height:100vh; }
    .hero-visual{ min-height:54vh; padding:7vh 0 5vh; }
    .hero-content{ padding-inline:7vw; max-width:100%; }
    .hero-footer{ display:none; }
    .login-panel{ flex-basis:auto; width:100%; padding:44px 8vw 48px; box-shadow: 0 -20px 50px rgba(0,0,0,.15); }
    .login-panel::before{ inset-inline-start:0; top:0; bottom:auto; width:100%; height:4px; background: linear-gradient(90deg, var(--blue), var(--navy) 45%, var(--red)); transform-origin:left; }
    .login-panel.in::before{ animation-name: barGrowH; }
    .lang-switch{ top:18px; inset-inline-end:18px; }
  }
  @keyframes barGrowH{ to{ transform: scaleX(1); } }

  @media (prefers-reduced-motion: reduce){
    .scene, .scene.in{ opacity:1 !important; transform:none !important; animation:none !important; }
    canvas#network{ display:none; }
    .aurora span{ animation:none !important; }
    .brand-ring{ animation:none !important; }
    .brand-mark.in .brand-flash{ animation:none !important; opacity:0 !important; }
    .eyebrow .dot::after{ animation:none !important; }
    .brand-glow{ animation:none !important; opacity:.5; }
    .login-panel.in::before, .login-panel::before{ animation:none !important; transform:none !important; }
    .brand-mark, .eyebrow, h1.headline .w, p.subcopy, .login-panel, .hero-footer,
    .login-panel.in .lang-switch, .login-panel.in .panel-brand, .login-panel.in .panel-title,
    .login-panel.in .panel-lead, .login-panel.in .btn-sso, .login-panel.in .panel-hint,
    .login-panel.in .panel-trust, .login-panel.in .panel-footer{
      opacity:1 !important; transform:none !important; filter:none !important; animation:none !important;
    }
  }
</style>
</head>
<body>
<div class="scene" id="scene">

  <section class="hero-visual" id="heroVisual">
    <div class="aurora" id="aurora">
      <span class="b1"></span><span class="b2"></span><span class="b3"></span>
    </div>
    <canvas id="network"></canvas>
    <div class="spotlight"></div>
    <div class="grain" id="grain"></div>

    <main class="hero-content" id="heroContent">
      <div class="brand-mark" id="brandMark">
        <span class="brand-glow"></span>
        <span class="brand-flash"></span>
        <span class="brand-ring"></span>
        <div class="brand-badge">
          <svg viewBox="0 0 369.08 352.26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Humanitarian Databank">
            <polygon fill="#C8102E" points="103.34,103.35 103.34,61.14 139.51,61.14 139.51,103.35 139.50,103.37 181.71,103.37 181.71,139.54 139.50,139.54 139.51,139.53 139.51,181.73 103.34,181.73 103.34,139.53 103.34,139.55 61.14,139.55 61.14,103.37 103.34,103.37"/>
            <path fill="#C8102E" d="m 237.67,120.8 c 0,-28.109997 22.79,-50.889997 50.89,-50.889997 6.26,0 12.25,1.13 17.79,3.2 -10.41,-8.24 -23.56,-13.16 -37.87,-13.16 -33.73,0 -61.07,27.35 -61.07,61.069997 0,33.73 27.34,61.07 61.07,61.07 14.78,0 28.34,-5.25 38.91,-13.99 -5.83,2.32 -12.18,3.6 -18.82,3.6 -28.11,-0.01 -50.9,-22.8 -50.9,-50.9"/>
            <path fill="#333132" d="m 277.93,292.31 c 6.3,0 12.01,-1.11 17.14,-3.32 5.12,-2.21 9.42,-5.44 12.88,-9.66 l -10.8,-9.97 c -4.92,5.75 -11.01,8.62 -18.28,8.62 -4.5,0 -8.52,-0.99 -12.05,-2.96 -3.53,-1.97 -6.28,-4.73 -8.26,-8.26 -1.97,-3.53 -2.96,-7.55 -2.96,-12.05 0,-4.5 0.99,-8.52 2.96,-12.05 1.97,-3.53 4.73,-6.28 8.26,-8.26 3.53,-1.97 7.55,-2.96 12.05,-2.96 7.27,0 13.36,2.84 18.28,8.52 l 10.8,-9.97 c -3.46,-4.16 -7.74,-7.34 -12.83,-9.56 -5.09,-2.21 -10.79,-3.32 -17.09,-3.32 -7.48,0 -14.22,1.61 -20.2,4.83 -5.99,3.22 -10.7,7.69 -14.13,13.4 -3.43,5.71 -5.14,12.17 -5.14,19.37 0,7.2 1.72,13.66 5.14,19.37 3.43,5.71 8.14,10.18 14.13,13.4 5.99,3.22 12.69,4.83 20.1,4.83 m -67.21,-47.57 c 0,4.02 -1.32,7.13 -3.95,9.35 -2.63,2.22 -6.48,3.32 -11.53,3.32 h -13.71 v -25.35 h 13.71 c 5.06,0 8.9,1.09 11.53,3.27 2.63,2.19 3.95,5.32 3.95,9.41 m 18.39,46.32 -16.31,-23.37 c 4.78,-2.08 8.47,-5.07 11.06,-8.99 2.6,-3.91 3.89,-8.57 3.89,-13.97 0,-5.4 -1.28,-10.08 -3.84,-14.03 -2.56,-3.95 -6.22,-6.99 -10.96,-9.14 -4.74,-2.15 -10.34,-3.22 -16.78,-3.22 h -31.48 v 72.72 h 16.83 V 270.8 h 14.65 0.83 l 14.02,20.26 z m -78.95,-59.21 v -13.5 H 95.209997 v 72.72 H 112.04 v -26.49 h 33.66 v -13.5 h -33.66 v -19.22 h 38.12 z m -89.020003,59.21 h 16.83 v -72.72 h -16.83 z"/>
          </svg>
        </div>
      </div>

      <div class="eyebrow" id="eyebrow">
        <span class="dot"></span><span class="eyebrow-text"><strong id="statNum">0</strong>+ <span id="statSuffix"></span></span>
      </div>

      <h1 class="headline" id="headline"></h1>

      <p class="subcopy" id="subcopy"></p>
    </main>

    <div class="hero-footer" id="heroFooter"></div>
  </section>

  <aside class="login-panel" id="loginPanel">
    <div class="lang-switch" id="langSwitch">
      <span class="lang-thumb" id="langThumb" aria-hidden="true"></span>
      <button data-lang="en" class="active" aria-pressed="true" title="English">EN</button>
      <button data-lang="fr" aria-pressed="false" title="Français">FR</button>
      <button data-lang="es" aria-pressed="false" title="Español">ES</button>
      <button data-lang="ar" aria-pressed="false" title="العربية">AR</button>
    </div>

    <div class="panel-brand" id="panelMark">IFRC Humanitarian Databank</div>
    <h2 class="panel-title" id="panelTitle">Sign in</h2>
    <p class="panel-lead" id="panelLead">Use your National Society or IFRC single sign-on account to continue.</p>

    <button class="btn-sso" id="btnLogin" type="button">
      <span class="btn-sso-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6l7-3z"/></svg>
      </span>
      <span class="btn-sso-label" id="btnLabel">Continue with single sign-on</span>
      <span class="btn-sso-arrow" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="12" x2="20" y2="12"/><polyline points="13 5 20 12 13 19"/></svg>
      </span>
    </button>
    <p class="panel-hint" id="panelHint">New here? You can create your account in the same step.</p>

    <div class="panel-trust">
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>
      <span id="trustLabel">Protected by your organization's identity provider</span>
    </div>

    <div class="panel-footer">
      <a id="helpLink" role="button" tabindex="0">Need help signing in?</a>
    </div>
  </aside>

</div>

<script>
(function(){
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var visual = document.getElementById('heroVisual');
  var heroContent = document.getElementById('heroContent');
  var auroraEl = document.getElementById('aurora');
  var canvas = document.getElementById('network');
  var ctx = canvas.getContext('2d');
  var grainEl = document.getElementById('grain');

  // ---- copy (kept deliberately brand/tool-agnostic — no third-party product names) ----

      subcopy:'\u0627\u0644\u0645\u0633\u0627\u062d\u0629 \u0627\u0644\u0622\u0645\u0646\u0629 \u0627\u0644\u0645\u0648\u062d\u062f\u0629 \u0644\u0644\u062a\u062e\u0637\u064a\u0637 \u0648\u0631\u0641\u0639 \u0627\u0644\u062a\u0642\u0627\u0631\u064a\u0631 \u0639\u0628\u0631 \u0634\u0628\u0643\u0629 \u0627\u0644\u0627\u062a\u062d\u0627\u062f \u0627\u0644\u062f\u0648\u0644\u064a\u060c \u0644\u062a\u062d\u0644 \u0645\u062d\u0644 \u0627\u0644\u0645\u0644\u0641\u0627\u062a \u0627\u0644\u0645\u062a\u0646\u0627\u062b\u0631\u0629 \u0648\u0627\u0644\u0623\u062f\u0648\u0627\u062a \u0627\u0644\u0645\u0646\u0641\u0635\u0644\u0629 \u0628\u0645\u0646\u0635\u0629 \u0648\u0627\u062d\u062f\u0629 \u0645\u062a\u0635\u0644\u0629.',

      mark:'\u0628\u0646\u0643 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0625\u0646\u0633\u0627\u0646\u064a\u0629 \u0644\u0644\u0627\u062a\u062d\u0627\u062f \u0627\u0644\u062f\u0648\u0644\u064a',
      title:'\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062f\u062e\u0648\u0644',
      lead:'\u0627\u0633\u062a\u062e\u062f\u0645 \u062d\u0633\u0627\u0628 \u0627\u0644\u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u0648\u062c\u062f \u0627\u0644\u062e\u0627\u0635 \u0628\u062c\u0645\u0639\u064a\u062a\u0643 \u0627\u0644\u0648\u0637\u0646\u064a\u0629 \u0623\u0648 \u0627\u0644\u0627\u062a\u062d\u0627\u062f \u0627\u0644\u062f\u0648\u0644\u064a \u0644\u0644\u0645\u062a\u0627\u0628\u0639\u0629.',
      button:'\u0627\u0644\u0627\u0633\u062a\u0645\u0631\u0627\u0631 \u0639\u0628\u0631 \u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062f\u062e\u0648\u0644 \u0627\u0644\u0645\u0648\u062d\u062f',
      hint:'\u0623\u0648\u0644 \u0645\u0631\u0629 \u0647\u0646\u0627\u061f \u064a\u0645\u0643\u0646\u0643 \u0625\u0646\u0634\u0627\u0621 \u062d\u0633\u0627\u0628\u0643 \u0641\u064a \u0646\u0641\u0633 \u0627\u0644\u062e\u0637\u0648\u0629.',
      trust:'\u0645\u062d\u0645\u064a \u0628\u0648\u0627\u0633\u0637\u0629 \u0645\u0632\u0648\u0651\u062f \u0627\u0644\u0647\u0648\u064a\u0629 \u0627\u0644\u062e\u0627\u0635 \u0628\u0645\u0624\u0633\u0651\u0633\u062a\u0643',
      help:'\u0647\u0644 \u062a\u062d\u062a\u0627\u062c \u0625\u0644\u0649 \u0645\u0633\u0627\u0639\u062f\u0629 \u0644\u062a\u0633\u062c\u064a\u0644 \u0627\u0644\u062f\u062e\u0648\u0644\u061f',
      footer:'\u00A9 2026 \u0627\u0644\u0627\u062a\u062d\u0627\u062f \u0627\u0644\u062f\u0648\u0644\u064a \u2014 \u0628\u0646\u0643 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0627\u0644\u0625\u0646\u0633\u0627\u0646\u064a\u0629'
    }
  };
  var currentLang = 'en';

  function buildHeadline(segments, animate){
    headlineEl.innerHTML = '';
    var idx = 0;
    segments.forEach(function(seg){
      seg.t.split(' ').forEach(function(word){
        var span = document.createElement('span');
        span.className = 'w' + (seg.a ? ' accent' : '');
        span.textContent = word;
        if(animate && !reduced){
          span.style.animationDelay = (idx*38) + 'ms';
        } else {
          span.style.opacity = 1; span.style.filter = 'none'; span.style.transform = 'none';
        }
        headlineEl.appendChild(span);
        idx++;
      });
    });
    headlineEl.classList.remove('reveal');
    if(animate && !reduced){ void headlineEl.offsetWidth; headlineEl.classList.add('reveal'); }
  }

  function setStaticTexts(tr){
    document.getElementById('subcopy').textContent = tr.subcopy;
    document.getElementById('statSuffix').textContent = tr.statSuffix;
    document.getElementById('panelMark').textContent = tr.mark;
    document.getElementById('panelTitle').textContent = tr.title;
    document.getElementById('panelLead').textContent = tr.lead;
    document.getElementById('btnLabel').textContent = tr.button;
    document.getElementById('panelHint').textContent = tr.hint;
    document.getElementById('trustLabel').textContent = tr.trust;
    document.getElementById('helpLink').textContent = tr.help;
    document.getElementById('heroFooter').textContent = tr.footer;
  }

  function moveThumb(btn, animate){
    var thumb = document.getElementById('langThumb');
    if(!btn || !thumb) return;
    if(!animate){ thumb.style.transition = 'none'; }
    thumb.style.width = btn.offsetWidth + 'px';
    thumb.style.transform = 'translateX(' + btn.offsetLeft + 'px)';
    if(!animate){ void thumb.offsetWidth; thumb.style.transition = ''; }
  }

  function markActiveLangButton(lang, animateThumb){
    var activeBtn = null;
    document.querySelectorAll('.lang-switch button').forEach(function(b){
      var active = b.dataset.lang === lang;
      b.classList.toggle('active', active);
      b.setAttribute('aria-pressed', active ? 'true' : 'false');
      if(active) activeBtn = b;
    });
    moveThumb(activeBtn, animateThumb);
  }
  window.addEventListener('resize', function(){
    moveThumb(document.querySelector('.lang-switch button.active'), false);
  });

  function applyLanguage(lang, animateHeadline){
    var tr = translations[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = (lang === 'ar') ? 'rtl' : 'ltr';
    setStaticTexts(tr);
    buildHeadline(tr.headline, animateHeadline);
    markActiveLangButton(lang, true);
  }

  function setLanguage(lang){
    if(lang === currentLang) return;
    currentLang = lang;
    if(reduced){ applyLanguage(lang, false); return; }
    heroContent.style.transition = 'opacity .18s ease';
    heroContent.style.opacity = '0.25';
    setTimeout(function(){
      applyLanguage(lang, false);
      heroContent.style.opacity = '1';
    }, 180);
  }

  document.querySelectorAll('.lang-switch button').forEach(function(b){
    b.addEventListener('click', function(){ setLanguage(b.dataset.lang); });
  });

  var helpLink = document.getElementById('helpLink');
  helpLink.addEventListener('click', function(){ /* wire up to a real support link on integration */ });
  helpLink.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' ') helpLink.click(); });

  document.getElementById('btnLogin').addEventListener('click', function(){
    // Replace with the real SSO entry point, e.g.:
    // window.location.href = '/auth/azure-login?next=' + encodeURIComponent(location.pathname);
    console.log('Redirect to SSO login here.');
  });

  // ---- initial static copy (headline is built by the entrance timeline below) ----
  document.documentElement.lang = 'en';
  document.documentElement.dir = 'ltr';
  setStaticTexts(translations.en);
  markActiveLangButton('en', false);

  function animateCount(el, to, dur){
    var t0 = performance.now();
    function tick(now){
      var p = Math.min(1, (now - t0) / dur);
      var eased = 1 - Math.pow(1 - p, 3);
      el.textContent = Math.round(eased * to);
      if(p < 1) requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);
  }

  // ---- entrance timeline: a richer, choreographed reveal that still settles fast ----
  var scene = document.getElementById('scene');
  if(reduced){
    scene.classList.add('in');
    document.getElementById('brandMark').classList.add('in');
    document.getElementById('eyebrow').classList.add('in');
    document.getElementById('subcopy').classList.add('in');
    document.getElementById('loginPanel').classList.add('in');
    document.getElementById('heroFooter').classList.add('in');
    document.getElementById('statNum').textContent = '190';
    buildHeadline(translations.en.headline, false);
  } else {
    // headline stays empty (as authored in markup) until its staged reveal below.
    // the login panel's own contents (lang switch, title, button, hint, trust, footer)
    // stagger in on their own once .in lands on .login-panel — see the CSS rules above.
    scene.classList.add('in');
    setTimeout(function(){ document.getElementById('brandMark').classList.add('in'); }, 60);
    setTimeout(function(){ document.getElementById('loginPanel').classList.add('in'); }, 200);
    setTimeout(function(){
      document.getElementById('eyebrow').classList.add('in');
      animateCount(document.getElementById('statNum'), 190, 700);
    }, 280);
    setTimeout(function(){ buildHeadline(translations.en.headline, true); }, 420);
    setTimeout(function(){ document.getElementById('subcopy').classList.add('in'); }, 780);
    setTimeout(function(){ document.getElementById('heroFooter').classList.add('in'); }, 950);
  }

  // ---- procedurally generated grain texture (no hand-built data URI) ----
  (function buildGrain(){
    var n = 128;
    var c = document.createElement('canvas');
    c.width = n; c.height = n;
    var gctx = c.getContext('2d');
    var idata = gctx.createImageData(n, n);
    for(var i=0; i<idata.data.length; i+=4){
      var v = Math.random()*255;
      idata.data[i] = idata.data[i+1] = idata.data[i+2] = v;
      idata.data[i+3] = 255;
    }
    gctx.putImageData(idata, 0, 0);
    grainEl.style.backgroundImage = 'url(' + c.toDataURL() + ')';
  })();

  if(reduced) return; // ambient canvas + parallax are motion-only extras

  // ---- ambient constellation network ----
  var DPR = Math.min(window.devicePixelRatio || 1, 2);
  var W, H, nodes = [], pulses = [], LINK_DIST = 140;

  function seedNodes(){
    var count = Math.round(Math.max(24, Math.min(56, (W*H) / 25000)));
    nodes = [];
    for(var i=0; i<count; i++){
      nodes.push({
        x: Math.random()*W, y: Math.random()*H,
        vx: (Math.random()-0.5)*0.18, vy: (Math.random()-0.5)*0.18,
        r: 1.1 + Math.random()*1.3
      });
    }
  }

  function resize(){
    W = visual.clientWidth; H = visual.clientHeight;
    canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
    canvas.style.width = W+'px'; canvas.style.height = H+'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    LINK_DIST = Math.max(90, Math.min(170, Math.min(W, H)*0.22));
    seedNodes();
  }
  window.addEventListener('resize', resize);
  resize();
  setTimeout(function(){ canvas.classList.add('in'); }, 120);

  // network "boot" — nodes/links ramp from sparse+dim to the full ambient state,
  // reading as the network coming online rather than a fixed intro state machine
  var bootStart = performance.now();
  var BOOT_MS = 1600;

  var mouse = {x:-9999, y:-9999, active:false};
  var parTX = 0, parTY = 0, parX = 0, parY = 0;
  visual.addEventListener('mousemove', function(e){
    var r = visual.getBoundingClientRect();
    mouse.x = e.clientX - r.left; mouse.y = e.clientY - r.top; mouse.active = true;
    visual.style.setProperty('--mx', (mouse.x / r.width * 100) + '%');
    visual.style.setProperty('--my', (mouse.y / r.height * 100) + '%');
    parTX = (mouse.x / r.width - 0.5) * 2;
    parTY = (mouse.y / r.height - 0.5) * 2;
  });
  visual.addEventListener('mouseleave', function(){
    mouse.active = false; parTX = 0; parTY = 0;
  });

  function draw(now){
    ctx.clearRect(0, 0, W, H);

    var bootT = Math.min(1, ((now||performance.now()) - bootStart) / BOOT_MS);
    var bootEase = 1 - Math.pow(1 - bootT, 3);

    parX += (parTX - parX) * 0.05;
    parY += (parTY - parY) * 0.05;
    heroContent.style.transform = 'translate(' + (parX*-9) + 'px,' + (parY*-7) + 'px)';
    auroraEl.style.transform = 'translate(' + (parX*7) + 'px,' + (parY*5) + 'px)';

    nodes.forEach(function(n){
      n.x += n.vx; n.y += n.vy;
      if(n.x < 0 || n.x > W){ n.vx *= -1; n.x = Math.max(0, Math.min(W, n.x)); }
      if(n.y < 0 || n.y > H){ n.vy *= -1; n.y = Math.max(0, Math.min(H, n.y)); }
      if(mouse.active){
        var dx = mouse.x - n.x, dy = mouse.y - n.y, d = Math.sqrt(dx*dx + dy*dy);
        if(d < 160 && d > 0.01){ n.x += dx*0.0015; n.y += dy*0.0015; }
      }
      n.vx *= 0.999; n.vy *= 0.999;
    });

    var linkDistNow = LINK_DIST * (0.45 + 0.55*bootEase);
    var maxLinksNow = bootEase > 0.45 ? 2 : 1;
    var edges = [];
    var edgeSet = {};
    for(var i=0; i<nodes.length; i++){
      var neighbors = [];
      for(var j=0; j<nodes.length; j++){
        if(i === j) continue;
        var ddx = nodes[i].x - nodes[j].x, ddy = nodes[i].y - nodes[j].y;
        var d = Math.sqrt(ddx*ddx + ddy*ddy);
        if(d < linkDistNow) neighbors.push({j:j, d:d});
      }
      neighbors.sort(function(a,b){ return a.d - b.d; });
      var added = 0;
      for(var k=0; k<neighbors.length && added < maxLinksNow; k++){
        var j = neighbors[k].j;
        var key = i < j ? i+'_'+j : j+'_'+i;
        if(edgeSet[key]) continue;
        edgeSet[key] = 1;
        var alpha = (0.16 + 0.16*bootEase) * (1 - neighbors[k].d / linkDistNow);
        ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
        ctx.lineWidth = 0.7;
        ctx.beginPath();
        ctx.moveTo(nodes[i].x, nodes[i].y);
        ctx.lineTo(nodes[j].x, nodes[j].y);
        ctx.stroke();
        edges.push({a:nodes[i], b:nodes[j]});
        added++;
      }
    }

    ctx.fillStyle = 'rgba(255,255,255,' + (0.4 + 0.4*bootEase) + ')';
    nodes.forEach(function(n){
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2); ctx.fill();
    });

    // occasional traveling "data pulse" along a real visible edge — signals a live network.
    // firing more eagerly while booting makes the network feel like it's actively coming online.
    var pulseChance = bootT < 1 ? 0.05 : 0.02;
    if(edges.length && pulses.length < 4 && Math.random() < pulseChance){
      var e = edges[(Math.random()*edges.length) | 0];
      pulses.push({a:e.a, b:e.b, t:0, speed:0.008 + Math.random()*0.006});
    }
    for(var p=pulses.length-1; p>=0; p--){
      var pu = pulses[p];
      pu.t += pu.speed;
      if(pu.t >= 1){ pulses.splice(p, 1); continue; }
      var x = pu.a.x + (pu.b.x - pu.a.x)*pu.t;
      var y = pu.a.y + (pu.b.y - pu.a.y)*pu.t;
      var a = Math.sin(pu.t * Math.PI);
      var grad = ctx.createRadialGradient(x, y, 0, x, y, 7);
      grad.addColorStop(0, 'rgba(255,255,255,' + (0.9*a) + ')');
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(x, y, 7, 0, Math.PI*2); ctx.fill();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();
</script>
