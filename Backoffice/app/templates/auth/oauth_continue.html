<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="0;url={{ next_url }}">
    <title>{{ _('Signing in…') }}</title>
    <style nonce="{{ csp_style_nonce() }}">
        html, body {
            margin: 0;
            min-height: 100%;
            background: #011E41;
            color: #fff;
            font-family: Montserrat, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        .oauth-continue {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.25rem;
            text-align: center;
        }
        .oauth-continue h1 {
            margin: 0 0 0.75rem;
            font-size: 1.25rem;
            font-weight: 600;
        }
        .oauth-continue p,
        .oauth-continue a {
            color: #d6e4ff;
            font-size: 0.95rem;
        }
        .oauth-continue a {
            display: inline-block;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <main class="oauth-continue">
        <h1>{{ _('Signing in…') }}</h1>
        <p><a href="{{ next_url }}">{{ _('Continue') }}</a></p>
    </main>
    <script nonce="{{ csp_nonce() }}">
        window.location.replace({{ next_url|tojson }});
    </script>
</body>
</html>
