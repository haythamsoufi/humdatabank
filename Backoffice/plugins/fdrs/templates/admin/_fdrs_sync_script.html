<script nonce="{{ csp_nonce() }}">
document.addEventListener('DOMContentLoaded', function () {
    const syncRoot = document.getElementById('fdrs-sync-root');
    if (!syncRoot) return;

    let currentTemplateId = {{ template.id }};
    const TEMPLATE_API_URLS = {
        runDataSync: {{ url_for("fdrs.run_data_sync", template_id=0) | tojson }},
        dataSyncStatus: {{ url_for("fdrs.data_sync_status", template_id=0, job_id="__JOB_ID__") | tojson }},
        dataSyncCancel: {{ url_for("fdrs.data_sync_cancel", template_id=0, job_id="__JOB_ID__") | tojson }},
        runSyncVerify: {{ url_for("fdrs.run_sync_verify", template_id=0) | tojson }},
        syncVerifyStatus: {{ url_for("fdrs.sync_verify_status", template_id=0, job_id="__JOB_ID__") | tojson }},
        syncVerifyCancel: {{ url_for("fdrs.sync_verify_cancel", template_id=0, job_id="__JOB_ID__") | tojson }},
        syncVerifyResults: {{ url_for("fdrs.sync_verify_results", template_id=0, job_id="__JOB_ID__") | tojson }},
        syncVerifyLatest: {{ url_for("fdrs.sync_verify_latest", template_id=0) | tojson }},
        syncVerifyLatestResults: {{ url_for("fdrs.sync_verify_latest_results", template_id=0) | tojson }}
    };

    function templateApiUrl(pathTemplate, templateId) {
        return pathTemplate.replace(/\/0(\/|$|\?|(?=\/))/, '/' + encodeURIComponent(templateId) + '$1');
    }

    function escapeHtmlAttr(value) {
        if (window.escapeHtmlAttr) return window.escapeHtmlAttr(value);
        return String(value == null ? '' : value)
            .replace(/&/g, '&amp;')
            .replace(/"/g, '&quot;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;');
    }

    function activateSyncMainTab() {
        if (window.AdminUnderlineTabs) {
            window.AdminUnderlineTabs.activateStripTab('#data-sync-tabs', 'sync', { panelSelector: '.data-panel' });
        }
        if ((location.hash || '').replace('#', '') !== 'sync') {
            history.replaceState(null, '', '#sync');
        }
    }

    function setSyncRunDetailsOpen(kind, open) {
        const id = kind === 'verify' ? 'fdrs-sync-verify-run-details' : 'fdrs-sync-run-details';
        const el = document.getElementById(id);
        if (el) el.open = !!open;
    }

    function showFdrsSyncSubtab(which) {
        activateSyncMainTab();
        if (which === 'run' || which === 'verify') {
            setSyncRunDetailsOpen(which, true);
        }
    }

    let syncVerifyResultsUrl = null;
    let syncVerifyTableState = { sheet: 'data_points' };
    let syncVerifyGridHelper = null;

    function formatFdrsLastRunDate(iso) {
        if (!iso) return '';
        const parsed = new Date(iso);
        if (isNaN(parsed.getTime())) return String(iso);
        return parsed.toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
    }

    function renderSyncVerifyLastRun(meta) {
        const banner = document.getElementById('sync-verify-last-run');
        if (!banner || !meta || !meta.exists && !meta.completed_at && !meta.stats) {
            if (banner && !(meta && (meta.completed_at || meta.stats))) banner.classList.add('hidden');
            return;
        }
        banner.classList.remove('hidden');
        const dateEl = document.getElementById('sync-verify-last-run-date');
        if (dateEl && meta.completed_at) {
            dateEl.textContent = ' · ' + formatFdrsLastRunDate(meta.completed_at);
        }
        const statsEl = document.getElementById('sync-verify-last-run-stats');
        if (statsEl && meta.stats) {
            statsEl.textContent = formatSyncVerifyStats(meta.stats);
        }
        const dl = document.getElementById('sync-verify-last-run-download');
        if (dl && meta.download_url && isSafeHref(meta.download_url)) {
            dl.classList.remove('hidden');
            dl.setAttribute('href', meta.download_url);
        }
    }

    function showVerifyGridError(message) {
        const err = document.getElementById('sync-verify-grid-error');
        if (!err) return;
        if (!message) {
            err.classList.add('hidden');
            err.textContent = '';
            return;
        }
        err.textContent = message;
        err.classList.remove('hidden');
    }

    function resetSyncVerifyTable() {
        syncVerifyResultsUrl = null;
        syncVerifyTableState = { sheet: 'data_points' };
        const wrap = document.getElementById('sync-verify-table-wrap');
        if (wrap) wrap.classList.add('hidden');
        const cards = document.getElementById('sync-verify-stats-cards');
        if (cards) cards.innerHTML = '';
        const search = document.getElementById('sync-verify-search');
        if (search) search.value = '';
        showVerifyGridError('');
        if (syncVerifyGridHelper) syncVerifyGridHelper.setRowData([]);
    }

    function statusBadgeClass(status) {
        const s = String(status || '').toLowerCase();
        if (s === 'matched') return 'bg-green-50 text-green-800';
        if (s === 'missing') return 'bg-red-50 text-red-800';
        if (s === 'mismatch') return 'bg-amber-50 text-amber-800';
        if (s.indexOf('skip') === 0) return 'bg-gray-100 text-gray-700';
        return 'bg-gray-50 text-gray-700';
    }

    function renderSyncVerifyStats(stats) {
        const cards = document.getElementById('sync-verify-stats-cards');
        if (!cards) return;
        stats = stats || {};
        const items = [
            { label: {{ _("Matched")|tojson|safe }}, value: stats.matched || 0, cls: 'border-green-200 bg-green-50 text-green-800' },
            { label: {{ _("Skipped")|tojson|safe }}, value: stats.skipped_intentionally || 0, cls: 'border-gray-200 bg-gray-50 text-gray-700' },
            { label: {{ _("Missing")|tojson|safe }}, value: stats.missing || 0, cls: 'border-red-200 bg-red-50 text-red-800' },
            { label: {{ _("Mismatch")|tojson|safe }}, value: stats.mismatch || 0, cls: 'border-amber-200 bg-amber-50 text-amber-800' }
        ];
        cards.innerHTML = items.map(function (item) {
            return '<div class="border rounded-md px-3 py-2 ' + item.cls + '">'
                + '<div class="text-xs uppercase tracking-wide font-medium">' + escapeHtmlAttr(item.label) + '</div>'
                + '<div class="text-lg font-semibold">' + escapeHtmlAttr(item.value) + '</div>'
                + '</div>';
        }).join('');
    }

    function setActiveSheetButton(sheet) {
        document.querySelectorAll('#sync-verify-sheet-tabs [data-verify-sheet]').forEach(function (btn) {
            const on = btn.getAttribute('data-verify-sheet') === sheet;
            btn.classList.toggle('bg-blue-50', on);
            btn.classList.toggle('text-blue-700', on);
            btn.classList.toggle('text-gray-600', !on);
            btn.classList.toggle('bg-white', !on);
        });
    }

    function buildVerifyColumnDefs(columns, rows) {
        const defs = (columns || []).map(function (col) {
            const key = String(col || '').toLowerCase();
            const def = {
                field: col,
                headerName: col,
                minWidth: (key === 'kpi' || key === 'name' || key.indexOf('message') !== -1) ? 220 : 120,
                flex: 1
            };
            if (key === 'status') {
                def.cellRenderer = function (params) {
                    const text = params.value == null ? '' : String(params.value);
                    if (!text) return '';
                    return '<span class="inline-flex px-1.5 py-0.5 rounded text-xs font-medium '
                        + statusBadgeClass(text) + '">' + escapeHtmlAttr(text) + '</span>';
                };
                def.filter = 'customSetFilter';
                def.minWidth = 140;
            }
            return def;
        });
        if (window.AgGridHelper && typeof AgGridHelper.autoDetectColumnFilters === 'function') {
            AgGridHelper.autoDetectColumnFilters(defs, rows || []);
        }
        return defs.length ? defs : [{ field: '_empty', headerName: '', hide: true }];
    }

    function applyVerifyQuickFilter() {
        const search = document.getElementById('sync-verify-search');
        if (syncVerifyGridHelper && syncVerifyGridHelper.gridApi && typeof syncVerifyGridHelper.gridApi.setGridOption === 'function') {
            syncVerifyGridHelper.gridApi.setGridOption('quickFilterText', (search && search.value) || '');
        }
    }

    function applyVerifyGrid(columns, rows) {
        if (typeof AgGridHelper === 'undefined' || !document.getElementById('syncVerifyGrid')) return;
        const colDefs = buildVerifyColumnDefs(columns, rows);
        if (!syncVerifyGridHelper) {
            syncVerifyGridHelper = new AgGridHelper({
                containerId: 'syncVerifyGrid',
                templateId: 'fdrs-sync-verify',
                columnDefs: colDefs,
                rowData: rows || [],
                filterPersistence: false,
                columnVisibilityOptions: { enableExport: true, enableReset: true },
                heightOptions: { minHeight: 400, maxHeight: 560, viewportOffset: 180 },
                options: {
                    getRowStyle: function (params) {
                        if (!params.data) return null;
                        const s = String(params.data.status || '').toLowerCase();
                        if (s === 'missing') return { backgroundColor: '#fef2f2' };
                        if (s === 'mismatch') return { backgroundColor: '#fffbeb' };
                        return null;
                    }
                }
            });
            syncVerifyGridHelper.initialize();
        } else if (syncVerifyGridHelper.gridApi) {
            if (typeof syncVerifyGridHelper.gridApi.setFilterModel === 'function') {
                syncVerifyGridHelper.gridApi.setFilterModel(null);
            }
            if (typeof syncVerifyGridHelper.gridApi.setGridOption === 'function') {
                syncVerifyGridHelper.gridApi.setGridOption('columnDefs', colDefs);
            }
            syncVerifyGridHelper._hasSizedColumnsToFit = false;
            syncVerifyGridHelper.setRowData(rows || []);
        }
        applyVerifyQuickFilter();
    }

    function renderSyncVerifyTable(data) {
        const wrap = document.getElementById('sync-verify-table-wrap');
        if (!wrap) return;
        wrap.classList.remove('hidden');
        showVerifyGridError('');
        renderSyncVerifyStats(data.stats);
        setActiveSheetButton(data.sheet || syncVerifyTableState.sheet);
        applyVerifyGrid(data.columns || [], data.rows || []);
    }

    function fetchSyncVerifyResultsPage() {
        if (!syncVerifyResultsUrl) return;
        const params = new URLSearchParams();
        params.set('sheet', syncVerifyTableState.sheet);
        params.set('all', '1');
        fetch(syncVerifyResultsUrl + '?' + params.toString(), { headers: { 'Accept': 'application/json' } })
            .then(function (res) { return res.json(); })
            .then(function (data) {
                if (!data || data.success === false) {
                    throw new Error((data && data.error) || {{ _("Failed to load verification table")|tojson|safe }});
                }
                renderSyncVerifyTable(data);
            })
            .catch(function (err) {
                const wrap = document.getElementById('sync-verify-table-wrap');
                if (wrap) wrap.classList.remove('hidden');
                showVerifyGridError(err.message || {{ _("Failed to load verification table")|tojson|safe }});
            });
    }

    function loadSyncVerifyResults(resultsUrl) {
        syncVerifyResultsUrl = resultsUrl;
        fetchSyncVerifyResultsPage();
    }

    document.querySelectorAll('#sync-verify-sheet-tabs [data-verify-sheet]').forEach(function (btn) {
        btn.addEventListener('click', function () {
            syncVerifyTableState.sheet = this.getAttribute('data-verify-sheet');
            const search = document.getElementById('sync-verify-search');
            if (search) search.value = '';
            fetchSyncVerifyResultsPage();
        });
    });
    const verifySearch = document.getElementById('sync-verify-search');
    if (verifySearch) {
        verifySearch.addEventListener('input', applyVerifyQuickFilter);
    }

    window.updateDataSyncUrlTemplates = function (templateId) {
        currentTemplateId = templateId;
        updateDataSyncUrlTemplates(templateId);
    };

// Data Sync (in-page Run sub-tab)
const dataSyncModal = document.getElementById('fdrs-sync-root');
const dataSyncModalClose = null;
const dataSyncModalCancel = null;
const dataSyncOpenBtn = null;
const dataSyncRunBtn = document.getElementById('data-sync-run-btn');
const dataSyncRunBtnText = document.getElementById('data-sync-run-btn-text');
const dataSyncSettings = document.getElementById('data-sync-settings');
const dataSyncConfigSummary = document.getElementById('data-sync-config-summary');
const dataSyncConfigSummaryBody = document.getElementById('data-sync-config-summary-body');
const dataSyncFooterSettings = document.getElementById('data-sync-footer-settings');
const dataSyncFooterRunning = document.getElementById('data-sync-footer-running');
const dataSyncFooterDone = document.getElementById('data-sync-footer-done');
const dataSyncStopBtn = document.getElementById('data-sync-stop-btn');
const dataSyncStopBtnText = document.getElementById('data-sync-stop-btn-text');
const dataSyncRunAgainBtn = document.getElementById('data-sync-run-again-btn');
const dataSyncReloadBtn = document.getElementById('data-sync-reload-btn');
const dataSyncResult = document.getElementById('data-sync-result');
const dataSyncResultText = document.getElementById('data-sync-result-text');
const dataSyncProgress = document.getElementById('data-sync-progress');
const dataSyncProgressStage = document.getElementById('data-sync-progress-stage');
const dataSyncProgressBar = document.getElementById('data-sync-progress-bar');
const dataSyncProgressText = document.getElementById('data-sync-progress-text');
const dataSyncProgressCount = document.getElementById('data-sync-progress-count');

const SYNC_STATUS_LABELS = {
    0: {{ _("Not filled")|tojson|safe }},
    100: {{ _("Saved")|tojson|safe }},
    200: {{ _("Reopened")|tojson|safe }},
    300: {{ _("Submitted")|tojson|safe }},
    400: {{ _("Validated")|tojson|safe }},
    500: {{ _("Published")|tojson|safe }}
};
const FDRS_YEARS_START = {{ fdrs_years_start }};
const FDRS_YEARS_END = {{ fdrs_years_end }};

const dataSyncYearsWrap = document.getElementById('data-sync-years-wrap');
const dataSyncYearsToggle = document.getElementById('data-sync-years-toggle');
const dataSyncYearsDropdown = document.getElementById('data-sync-years-dropdown');
const dataSyncYearsLabel = document.getElementById('data-sync-years-label');
const dataSyncYearsSelectAll = document.getElementById('data-sync-years-select-all');
const dataSyncYearsClearAll = document.getElementById('data-sync-years-clear-all');

function getDataSyncYearCheckboxes() {
    return Array.from(document.querySelectorAll('input[name="data-sync-year"]'));
}

function getSelectedDataSyncYears() {
    return getDataSyncYearCheckboxes()
        .filter(function (el) { return el.checked; })
        .map(function (el) { return parseInt(el.value, 10); })
        .filter(function (n) { return !isNaN(n); })
        .sort(function (a, b) { return a - b; });
}

function formatDataSyncYearsDisplay(years) {
    if (!years.length) {
        return {{ _("No years selected")|tojson|safe }};
    }
    const allYears = [];
    for (let y = FDRS_YEARS_START; y <= FDRS_YEARS_END; y += 1) {
        allYears.push(y);
    }
    if (years.length === allYears.length) {
        return FDRS_YEARS_START + '\u2013' + FDRS_YEARS_END + ' (' + years.length + ' ' + {{ _("years")|tojson|safe }} + ')';
    }
    if (years.length <= 4) {
        return years.join(', ');
    }
    return years[0] + '\u2013' + years[years.length - 1] + ' (' + years.length + ' ' + {{ _("years")|tojson|safe }} + ')';
}

function updateDataSyncYearsLabel() {
    if (!dataSyncYearsLabel) return;
    dataSyncYearsLabel.textContent = formatDataSyncYearsDisplay(getSelectedDataSyncYears());
}

function setDataSyncYearsOpen(isOpen) {
    if (!dataSyncYearsDropdown || !dataSyncYearsToggle) return;
    dataSyncYearsDropdown.classList.toggle('hidden', !isOpen);
    dataSyncYearsToggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
}

function setAllDataSyncYears(checked) {
    getDataSyncYearCheckboxes().forEach(function (el) {
        el.checked = checked;
    });
    updateDataSyncYearsLabel();
}

if (dataSyncYearsToggle && dataSyncYearsDropdown) {
    updateDataSyncYearsLabel();
    dataSyncYearsToggle.addEventListener('click', function (event) {
        event.stopPropagation();
        const isOpen = dataSyncYearsDropdown.classList.contains('hidden');
        setDataSyncYearsOpen(isOpen);
    });
    dataSyncYearsDropdown.addEventListener('click', function (event) {
        event.stopPropagation();
    });
    document.addEventListener('click', function () {
        setDataSyncYearsOpen(false);
    });
    getDataSyncYearCheckboxes().forEach(function (el) {
        el.addEventListener('change', updateDataSyncYearsLabel);
    });
    if (dataSyncYearsSelectAll) {
        dataSyncYearsSelectAll.addEventListener('click', function () {
            setAllDataSyncYears(true);
        });
    }
    if (dataSyncYearsClearAll) {
        dataSyncYearsClearAll.addEventListener('click', function () {
            setAllDataSyncYears(false);
        });
    }
}

let dataSyncStatusUrlTemplate = TEMPLATE_API_URLS.dataSyncStatus;
let dataSyncCancelUrlTemplate = TEMPLATE_API_URLS.dataSyncCancel;
let syncVerifyStatusUrlTemplate = TEMPLATE_API_URLS.syncVerifyStatus;
let syncVerifyCancelUrlTemplate = TEMPLATE_API_URLS.syncVerifyCancel;
let dataSyncActiveJobId = null;
let dataSyncPollTimer = null;
let dataSyncPollDelayMs = 2000;
const DATA_SYNC_POLL_INITIAL_MS = 2000;
const DATA_SYNC_POLL_MAX_MS = 5000;
const DATA_SYNC_POLL_BACKOFF_FACTOR = 1.5;
const DATA_SYNC_STORAGE_KEY = 'fdrs_data_sync_job_' + currentTemplateId;
let dataSyncUIMode = 'settings';
let dataSyncStopRequested = false;
let dataSyncLastPercent = 0;

function readDataSyncActiveJobs() {
    const el = document.getElementById('data-sync-active-jobs');
    if (!el) return [];
    try {
        return JSON.parse(el.textContent || '[]') || [];
    } catch (e) {
        return [];
    }
}

function writeDataSyncStorage(jobId) {
    try {
        localStorage.setItem(DATA_SYNC_STORAGE_KEY, JSON.stringify({ jobId: jobId }));
    } catch (e) { /* ignore */ }
}

function clearDataSyncStorage() {
    try {
        localStorage.removeItem(DATA_SYNC_STORAGE_KEY);
    } catch (e) { /* ignore */ }
}

function updateDataSyncUrlTemplates(templateId) {
    dataSyncStatusUrlTemplate = templateApiUrl(TEMPLATE_API_URLS.dataSyncStatus, templateId);
    dataSyncCancelUrlTemplate = templateApiUrl(TEMPLATE_API_URLS.dataSyncCancel, templateId);
    syncVerifyStatusUrlTemplate = templateApiUrl(TEMPLATE_API_URLS.syncVerifyStatus, templateId);
    syncVerifyCancelUrlTemplate = templateApiUrl(TEMPLATE_API_URLS.syncVerifyCancel, templateId);
}
updateDataSyncUrlTemplates(currentTemplateId);

function isSafeHref(url) {
    if (!url || typeof url !== 'string') return false;
    const u = url.trim();
    return u.startsWith('/') || u.startsWith('https://') || u.startsWith('http://');
}

function stopDataSyncPolling() {
    if (dataSyncPollTimer) {
        clearTimeout(dataSyncPollTimer);
        dataSyncPollTimer = null;
    }
    dataSyncActiveJobId = null;
    dataSyncPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
}

function scheduleDataSyncPoll() {
    dataSyncPollTimer = setTimeout(pollDataSyncStatus, dataSyncPollDelayMs);
    dataSyncPollDelayMs = Math.min(
        Math.round(dataSyncPollDelayMs * DATA_SYNC_POLL_BACKOFF_FACTOR),
        DATA_SYNC_POLL_MAX_MS
    );
}

function collectDataSyncParams() {
    const selectedYears = getSelectedDataSyncYears();
    const years = selectedYears.join(',');
    const batchSizeRaw = (document.getElementById('data-sync-batch-size') && document.getElementById('data-sync-batch-size').value) || '';
    const batchSizeRawTrim = (batchSizeRaw || '').trim();
    const batchSize = batchSizeRawTrim ? parseInt(batchSizeRawTrim, 10) : null;
    const dryRun = !!(document.getElementById('data-sync-dry-run') && document.getElementById('data-sync-dry-run').checked);
    const test = !!(document.getElementById('data-sync-test') && document.getElementById('data-sync-test').checked);
    const imputedUseCache = !!(document.getElementById('data-sync-imputed-cache') && document.getElementById('data-sync-imputed-cache').checked);
    const syncDocuments = !!(document.getElementById('data-sync-documents') && document.getElementById('data-sync-documents').checked);
    const statusBoxes = document.querySelectorAll('input[name="data-sync-status"]:checked');
    const reportedStates = Array.from(statusBoxes).map(function (el) {
        return parseInt(el.value, 10);
    }).filter(function (n) { return !isNaN(n); });

    return {
        years: years,
        selectedYears: selectedYears,
        batchSizeRawTrim: batchSizeRawTrim,
        batchSize: batchSize,
        dryRun: dryRun,
        test: test,
        imputedUseCache: imputedUseCache,
        syncDocuments: syncDocuments,
        reportedStates: reportedStates
    };
}

function dataSyncBoolIcon(isTrue) {
    if (isTrue) {
        return '<span class="inline-flex items-center text-green-600" aria-label="' + {{ _("Yes")|tojson|safe }} + '"><i class="fas fa-check-circle" aria-hidden="true"></i></span>';
    }
    return '<span class="inline-flex items-center text-gray-400" aria-label="' + {{ _("No")|tojson|safe }} + '"><i class="fas fa-times-circle" aria-hidden="true"></i></span>';
}

function renderDataSyncConfigSummary(params) {
    if (!dataSyncConfigSummaryBody) return;

    const yearsDisplay = formatDataSyncYearsDisplay(params.selectedYears || []);
    const batchDisplay = params.batchSize !== null && !isNaN(params.batchSize)
        ? String(params.batchSize)
        : {{ _("Default (1000)")|tojson|safe }};
    const statusLabels = (params.reportedStates || [])
        .map(function (code) { return SYNC_STATUS_LABELS[code] || String(code); })
        .join(', ');

    const rows = [
        { label: {{ _("Years")|tojson|safe }}, value: yearsDisplay },
        { label: {{ _("Batch size")|tojson|safe }}, value: batchDisplay },
        { label: {{ _("Data status")|tojson|safe }}, value: statusLabels || '-' },
        { label: {{ _("Sync documents")|tojson|safe }}, value: dataSyncBoolIcon(params.syncDocuments), html: true, inline: true },
        { label: {{ _("Dry run")|tojson|safe }}, value: dataSyncBoolIcon(params.dryRun), html: true, inline: true },
        { label: {{ _("Test mode")|tojson|safe }}, value: dataSyncBoolIcon(params.test), html: true, inline: true },
        { label: {{ _("Cached imputed values")|tojson|safe }}, value: dataSyncBoolIcon(params.imputedUseCache), html: true, inline: true }
    ];

    dataSyncConfigSummaryBody.innerHTML = rows.map(function (row) {
        const valueHtml = row.html ? row.value : escapeHtmlAttr(row.value);
        if (row.inline) {
            return '<div class="flex items-center gap-2">'
                + '<span class="text-gray-500">' + escapeHtmlAttr(row.label) + '</span>'
                + valueHtml
                + '</div>';
        }
        return '<div class="flex items-start justify-between gap-4">'
            + '<span class="text-gray-500 shrink-0">' + escapeHtmlAttr(row.label) + '</span>'
            + '<span class="font-medium text-gray-900 text-right">' + valueHtml + '</span>'
            + '</div>';
    }).join('');
}

function setDataSyncUIMode(mode) {
    dataSyncUIMode = mode;
    const isSettings = mode === 'settings';
    const isRunning = mode === 'running';
    const isDone = mode === 'done';

    if (dataSyncSettings) dataSyncSettings.classList.toggle('hidden', !isSettings);
    if (dataSyncConfigSummary) dataSyncConfigSummary.classList.toggle('hidden', isSettings);
    if (dataSyncFooterSettings) dataSyncFooterSettings.classList.toggle('hidden', !isSettings);
    if (dataSyncFooterRunning) dataSyncFooterRunning.classList.toggle('hidden', !isRunning);
    if (dataSyncFooterDone) dataSyncFooterDone.classList.toggle('hidden', !isDone);

}

function resetDataSyncRunButton() {
    if (!dataSyncRunBtn || !dataSyncRunBtnText) return;
    dataSyncRunBtn.disabled = false;
    dataSyncRunBtnText.textContent = {{ _("Run Sync")|tojson|safe }};
    const spinIcon = dataSyncRunBtn.querySelector('i.fa-spinner');
    if (spinIcon) spinIcon.remove();
    if (!dataSyncRunBtn.querySelector('i.fa-sync-alt')) {
        dataSyncRunBtn.insertAdjacentHTML('afterbegin', '<i class="fas fa-sync-alt mr-2"></i>');
    }
}

function resetDataSyncStopButton() {
    dataSyncStopRequested = false;
    if (!dataSyncStopBtn || !dataSyncStopBtnText) return;
    dataSyncStopBtn.disabled = false;
    dataSyncStopBtnText.textContent = {{ _("Stop sync")|tojson|safe }};
}

function setDataSyncStopping() {
    dataSyncStopRequested = true;
    if (!dataSyncStopBtn || !dataSyncStopBtnText) return;
    dataSyncStopBtn.disabled = true;
    dataSyncStopBtnText.textContent = {{ _("Stopping...")|tojson|safe }};
}

function showDataSyncDone() {
    setDataSyncUIMode('done');
}

function resetDataSyncUI() {
    dataSyncResult.classList.add('hidden');
    dataSyncResultText.textContent = '';
    if (dataSyncProgress) dataSyncProgress.classList.add('hidden');
    if (dataSyncProgressStage) dataSyncProgressStage.textContent = '-';
    if (dataSyncProgressBar) dataSyncProgressBar.style.width = '0%';
    if (dataSyncProgressText) dataSyncProgressText.textContent = '0%';
    if (dataSyncProgressCount) dataSyncProgressCount.textContent = '';
    if (dataSyncConfigSummaryBody) dataSyncConfigSummaryBody.innerHTML = '';
    dataSyncLastPercent = 0;
    stopDataSyncPolling();
    resetDataSyncRunButton();
    resetDataSyncStopButton();
    setDataSyncUIMode('settings');
}

function setDataSyncProgress(percent, stage, message, current, total, opts) {
    opts = opts || {};
    if (opts.resetProgress) {
        dataSyncLastPercent = 0;
    }
    const raw = Math.max(0, Math.min(100, Number(percent || 0)));
    const pct = opts.resetProgress ? raw : Math.max(dataSyncLastPercent, raw);
    dataSyncLastPercent = pct;
    if (dataSyncProgressBar) dataSyncProgressBar.style.width = pct + '%';
    if (dataSyncProgressText) dataSyncProgressText.textContent = `${Math.round(pct)}%`;
    if (dataSyncProgressStage) {
        const stageText = (message && message.trim()) ? message.trim() : (stage || '-');
        dataSyncProgressStage.textContent = stageText;
    }
    if (dataSyncProgressCount) {
        if (total !== null && total !== undefined && total !== '' && Number(total) > 0) {
            dataSyncProgressCount.textContent = `${current || 0} / ${total}`;
        } else {
            dataSyncProgressCount.textContent = '';
        }
    }
}

function pollDataSyncStatus() {
    if (!dataSyncActiveJobId) return;
    const url = dataSyncStatusUrlTemplate.replace('__JOB_ID__', encodeURIComponent(dataSyncActiveJobId));

    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (!data || !data.success || !data.job) {
                throw new Error((data && data.error) || 'Failed to read sync status');
            }
            const job = data.job;

            setDataSyncProgress(job.percent, job.stage, job.message, job.current, job.total);

            if (job.status === 'completed') {
                const finishedJobId = dataSyncActiveJobId;
                stopDataSyncPolling();
                clearDataSyncStorage();
                dataSyncResult.classList.remove('hidden');
                const stats = job.stats || {};
                let msg = `Loaded: ${stats.loaded || 0}, Skipped: ${stats.skipped || 0}, Inserted: ${stats.inserted || 0}, Updated: ${stats.updated || 0}, Unchanged: ${stats.unchanged || 0}, Errors: ${stats.errors || 0}`;
                let logHtml = '';
                if (finishedJobId && /^[a-fA-F0-9]{32}$/.test(finishedJobId)) {
                    logHtml = ` <a class="text-purple-700 underline" href="/admin/import-logs/${encodeURIComponent(finishedJobId)}" target="_blank" rel="noopener">` + {{ _("View change log")|tojson|safe }} + `</a>`;
                }
                if (job.download_ready && job.download_url) {
                    msg += `\n\n` + {{ _("Preview Excel ready:")|tojson|safe }} + ` `;
                    const safeUrl = isSafeHref(job.download_url) ? escapeHtmlAttr(job.download_url) : '#';
                    dataSyncResultText.innerHTML = `${msg.replace(/\n/g, '<br>')}<a class="text-purple-700 underline" href="${safeUrl}">` + {{ _("Download")|tojson|safe }} + `</a>${logHtml}`;
                } else {
                    dataSyncResultText.textContent = msg;
                    if (logHtml) {
                        dataSyncResultText.insertAdjacentHTML('beforeend', logHtml);
                    }
                }
                dataSyncResultText.className = 'text-sm text-green-700';
                showDataSyncDone();
                return;
            }
            if (job.status === 'failed') {
                stopDataSyncPolling();
                clearDataSyncStorage();
                dataSyncResult.classList.remove('hidden');
                dataSyncResultText.textContent = job.error || {{ _("Sync failed")|tojson|safe }};
                dataSyncResultText.className = 'text-sm text-red-700';
                showDataSyncDone();
                return;
            }
            if (job.status === 'cancelled') {
                stopDataSyncPolling();
                clearDataSyncStorage();
                dataSyncResult.classList.remove('hidden');
                dataSyncResultText.textContent = job.error || {{ _("Sync cancelled.")|tojson|safe }};
                dataSyncResultText.className = 'text-sm text-amber-700';
                showDataSyncDone();
                return;
            }
            if (job.status === 'cancel_requested') {
                setDataSyncStopping();
            }

            // Continue polling (2s initially, backs off to 5s to limit access-log noise)
            scheduleDataSyncPoll();
        })
        .catch(err => {
            stopDataSyncPolling();
            dataSyncResult.classList.remove('hidden');
            dataSyncResultText.textContent = err.message || {{ _("Request failed")|tojson|safe }};
            dataSyncResultText.className = 'text-sm text-red-700';
            showDataSyncDone();
        });
}

let syncVerifyStopRequested = false;
let syncVerifyLastPercent = 0;

}

function clearSyncVerifyStorage() {

}

function stopSyncVerifyPolling() {

function scheduleSyncVerifyPoll() {
    syncVerifyPollTimer = setTimeout(pollSyncVerifyStatus, syncVerifyPollDelayMs);
    syncVerifyPollDelayMs = Math.min(
        Math.round(syncVerifyPollDelayMs * DATA_SYNC_POLL_BACKOFF_FACTOR),

        + ', '

        + ', '
        + String(stats.mismatch || 0) + ' ' + {{ _("mismatch")|tojson|safe }};
}

function pollSyncVerifyStatus() {
    if (!syncVerifyActiveJobId) return;
    const url = syncVerifyStatusUrlTemplate.replace('__JOB_ID__', encodeURIComponent(syncVerifyActiveJobId));
    fetch(url)
        .then(res => res.json())
        .then(data => {
            if (!data || !data.success || !data.job) {
                throw new Error((data && data.error) || 'Failed to read verification status');
            }
            const job = data.job;
            setSyncVerifyProgress(job.percent, job.stage, job.message, job.current, job.total);
            if (job.status === 'completed') {
                stopSyncVerifyPolling();
                clearSyncVerifyStorage();
                syncVerifyResult.classList.remove('hidden');
                const stats = job.stats || {};
                const problems = (stats.missing || 0) + (stats.mismatch || 0);
                let msg = formatSyncVerifyStats(stats);
                const downloadUrl = job.download_url || templateApiUrl(TEMPLATE_API_URLS.syncVerifyLatest, currentTemplateId).replace(/\/sync-verify-latest$/, '/sync-verify-latest/download');
                if (job.download_ready && downloadUrl) {
                    const safeUrl = isSafeHref(downloadUrl) ? escapeHtmlAttr(downloadUrl) : '#';
                    if (syncVerifyDownloadBtn) {
                        syncVerifyDownloadBtn.classList.remove('hidden');
                        syncVerifyDownloadBtn.setAttribute('href', safeUrl);
                    }
                    msg += ' ';
                    syncVerifyResultText.innerHTML = escapeHtmlAttr(msg)
                        + ' <a class="text-blue-700 underline" href="' + safeUrl + '">'
                        + {{ _("Download Excel")|tojson|safe }}
                        + '</a>';
                } else {
                    syncVerifyResultText.textContent = msg;
                }
                syncVerifyResultText.className = problems ? 'text-sm text-amber-700' : 'text-sm text-green-700';
                renderSyncVerifyLastRun({
                    exists: true,
                    completed_at: new Date().toISOString(),
                    stats: stats,
                    download_url: downloadUrl
                });
                showSyncVerifyDone();
                const resultsUrl = job.results_url || templateApiUrl(TEMPLATE_API_URLS.syncVerifyLatestResults, currentTemplateId);
                if (resultsUrl) {
                    loadSyncVerifyResults(resultsUrl);
                }
                return;
            }
            if (job.status === 'failed') {
                stopSyncVerifyPolling();
                clearSyncVerifyStorage();
                syncVerifyResult.classList.remove('hidden');
                syncVerifyResultText.textContent = job.error || {{ _("Verification failed")|tojson|safe }};
                syncVerifyResultText.className = 'text-sm text-red-700';
                showSyncVerifyDone();
                return;
            }
            if (job.status === 'cancelled') {
                stopSyncVerifyPolling();
                clearSyncVerifyStorage();
                syncVerifyResult.classList.remove('hidden');
                syncVerifyResultText.textContent = job.error || {{ _("Verification cancelled.")|tojson|safe }};
                syncVerifyResultText.className = 'text-sm text-amber-700';
                showSyncVerifyDone();
                return;
            }
            if (job.status === 'cancel_requested') {
                setSyncVerifyStopping();
            }
            scheduleSyncVerifyPoll();
        })
        .catch(err => {
            stopSyncVerifyPolling();
            syncVerifyResult.classList.remove('hidden');
            syncVerifyResultText.textContent = err.message || {{ _("Request failed")|tojson|safe }};
            syncVerifyResultText.className = 'text-sm text-red-700';
            showSyncVerifyDone();
        });
}

if (syncVerifyRunAgainBtn) {
    syncVerifyRunAgainBtn.addEventListener('click', function () {
        resetSyncVerifyUI({ keepTable: true });
    });
}
if (syncVerifyStopBtn) {
    syncVerifyStopBtn.addEventListener('click', function() {
        if (!syncVerifyActiveJobId || syncVerifyStopRequested) return;
        setSyncVerifyStopping();
        const url = syncVerifyCancelUrlTemplate.replace('__JOB_ID__', encodeURIComponent(syncVerifyActiveJobId));
        const csrfToken = document.querySelector('meta[name="csrf-token"]') && document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken || ''
            }
        })
        .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(result) {
            if (!result.ok || !(result.data && result.data.success)) {
                throw new Error((result.data && result.data.error) || {{ _("Failed to stop verification")|tojson|safe }});
            }
        })
        .catch(function(err) {
            resetSyncVerifyStopButton();
            syncVerifyResult.classList.remove('hidden');
            syncVerifyResultText.textContent = err.message || {{ _("Failed to stop verification")|tojson|safe }};
            syncVerifyResultText.className = 'text-sm text-red-700';
        });
    });
}
if (syncVerifyRunBtn) {
    syncVerifyRunBtn.addEventListener('click', function() {
        const params = collectSyncVerifyParams();
        if (!params.test && !params.selectedYears.length) {
            syncVerifyResult.classList.remove('hidden');
            syncVerifyResultText.textContent = {{ _("Select at least one reporting year.")|tojson|safe }};
            syncVerifyResultText.className = 'text-sm text-red-700';
            return;
        }
        resetSyncVerifyUI();
        const tableWrap = document.getElementById('sync-verify-table-wrap');
        if (tableWrap) tableWrap.classList.add('hidden');
        renderSyncVerifyConfigSummary(params);
        setSyncVerifyUIMode('running');
        if (syncVerifyProgress) syncVerifyProgress.classList.remove('hidden');
        setSyncVerifyProgress(0, 'starting', {{ _("Starting...")|tojson|safe }}, 0, null, { resetProgress: true });
        syncVerifyRunBtn.disabled = true;
        syncVerifyRunBtnText.textContent = {{ _("Running...")|tojson|safe }};
        syncVerifyRunBtn.insertAdjacentHTML('afterbegin', '<i class="fas fa-spinner fa-spin mr-2"></i>');
        const iconEl = syncVerifyRunBtn.querySelector('i.fa-clipboard-check');
        if (iconEl) iconEl.remove();

        const csrfToken = document.querySelector('meta[name="csrf-token"]') && document.querySelector('meta[name="csrf-token"]').getAttribute('content');
        const payload = {
            fdrs_years: params.years,
            test: params.test,
            skip_imputed: params.skipImputed,
            imputed_use_cache: params.imputedUseCache,
            problems_only: params.problemsOnly
        };
        fetch(templateApiUrl(TEMPLATE_API_URLS.runSyncVerify, currentTemplateId), {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': csrfToken || ''
            },
            body: JSON.stringify(payload)
        })
        .then(function(res) { return res.json().then(function(data) { return { ok: res.ok, data: data }; }); })
        .then(function(result) {
            var ok = result.ok;
            var data = result.data || {};
            if (!ok || !data.success || !data.job_id) {
                throw new Error(data.error || {{ _("Verification failed")|tojson|safe }});
            }
            syncVerifyActiveJobId = data.job_id;
            writeSyncVerifyStorage(data.job_id);
            syncVerifyPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
            pollSyncVerifyStatus();
        })
        .catch(function(err) {
            syncVerifyResult.classList.remove('hidden');
            syncVerifyResultText.textContent = err.message || {{ _("Request failed")|tojson|safe }};
            syncVerifyResultText.className = 'text-sm text-red-700';
            showSyncVerifyDone();
        });
    });
}

function resumeSyncVerifyJobIfNeeded() {
    let jobId = null;
    const serverJobs = readSyncVerifyActiveJobs().filter(function (j) { return j && j.job_id; });
    if (serverJobs.length) {
        jobId = serverJobs[0].job_id;
    } else {
        try {
            const stored = JSON.parse(localStorage.getItem(SYNC_VERIFY_STORAGE_KEY) || 'null');
            if (stored && stored.jobId) {
                jobId = stored.jobId;
            }
        } catch (e) { /* ignore */ }
    }
    if (!jobId || !syncVerifyModal) return;
    syncVerifyActiveJobId = jobId;
    writeSyncVerifyStorage(jobId);
    showFdrsSyncSubtab('verify');
    setSyncVerifyUIMode('running');
    if (syncVerifyProgress) syncVerifyProgress.classList.remove('hidden');
    setSyncVerifyProgress(0, 'resuming', {{ _("Resuming verification...")|tojson|safe }}, 0, null, { resetProgress: true });
    syncVerifyPollDelayMs = DATA_SYNC_POLL_INITIAL_MS;
    pollSyncVerifyStatus();
}

function restoreLatestVerifyIfNeeded() {
    if (readSyncVerifyActiveJobs().length) return;
    try {
        const stored = JSON.parse(localStorage.getItem(SYNC_VERIFY_STORAGE_KEY) || 'null');
        if (stored && stored.jobId) return;
    } catch (e) { /* ignore */ }
    const latestUrl = templateApiUrl(TEMPLATE_API_URLS.syncVerifyLatest, currentTemplateId);
    fetch(latestUrl, { headers: { 'Accept': 'application/json' } })
        .then(function (res) { return res.json(); })
        .then(function (data) {
            if (!data || data.success === false || !data.exists) return;
            renderSyncVerifyLastRun(data);
            if (data.download_url && syncVerifyDownloadBtn && isSafeHref(data.download_url)) {
                syncVerifyDownloadBtn.classList.remove('hidden');
                syncVerifyDownloadBtn.setAttribute('href', data.download_url);
            }
            if (data.results_url) {
                loadSyncVerifyResults(data.results_url);
            }
        })
        .catch(function () { /* keep page usable without latest snapshot */ });
}

resumeSyncVerifyJobIfNeeded();
restoreLatestVerifyIfNeeded();
});
</script>
